<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OLIVE 管理</title><!-- admin v0.14 -->
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--acc:#3f9d5a;--warn:#d9534f;--gold:#e0a32a;--blue:#3b82f6;--h:44px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:0 16px;height:var(--h);background:#eee;color:var(--ink);white-space:nowrap}
  button.primary{background:var(--blue);color:#fff}button.ok{background:var(--acc);color:#fff}button.danger{background:var(--warn);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line)}button.sm{height:34px;padding:0 10px;font-size:14px}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,select{font:inherit;font-size:16px;height:var(--h);padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;min-width:0}
  label{display:block;font-size:13px;color:var(--muted)}label>input,label>select{margin-top:4px;color:var(--ink)}
  .muted{color:var(--muted)}small{font-size:13px}.hide{display:none!important}
  .err{color:var(--warn);font-size:14px;min-height:20px;margin-top:8px}

  /* ログイン */
  #vLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #vLogin .box{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px}
  #vLogin h1{margin:0;font-size:22px}

  /* 画面の枠 */
  #vApp{min-height:100vh;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:20;background:#3a3a3a;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top))}
  .top .ttl{font-weight:700;font-size:17px;white-space:nowrap}
  .top select{width:auto;max-width:220px;height:36px;background:#fff}
  .top .who{margin-left:auto;font-size:13px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .top button{height:36px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:14px;padding:0 12px}
  #menuBtn{display:none}
  .alertbar{background:#fde8e8;color:#9b1c1c;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .alertbar button{height:36px;font-size:14px}
  .body{flex:1;display:flex;min-height:0}
  nav{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 0;overflow:auto}
  nav .grp{font-size:12px;color:var(--muted);padding:12px 18px 4px}
  nav a{display:flex;align-items:center;gap:6px;padding:9px 18px;color:var(--ink);text-decoration:none;font-size:15px;cursor:pointer}
  nav a:hover{background:#f3f2ee}nav a.on{background:var(--ink);color:#fff}
  nav a .tag{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;flex:none}nav a.on .tag{color:#ccc}
  main{flex:1;min-width:0;padding:18px 22px 60px;overflow:auto}
  main h1{font-size:22px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 10px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:end}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;vertical-align:middle}
  table.t th{font-size:13px;color:var(--muted);font-weight:400}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border-radius:0;background:#fff;height:36px;font-size:14px;padding:0 12px;border-right:1px solid var(--line)}.seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:#fff}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--gold);color:#fff}.badge.gray{background:#999}.badge.k{background:var(--acc)}.badge.warnb{background:var(--warn)}
  .num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
  .alert{background:#fde8e8;color:#9b1c1c;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:700}
  table.reg{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}table.reg td,table.reg th{padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
  table.reg th{color:var(--muted);font-weight:400}table.reg tr[data-rd]{cursor:pointer}table.reg tr[data-rd]:hover{background:#f3f2ee}
  table.sl{border-collapse:collapse;font-variant-numeric:tabular-nums}table.sl th{font-size:12px;color:var(--muted);font-weight:400;padding:4px 4px;text-align:right;white-space:nowrap}
  table.sl td{padding:3px 4px}table.sl input{width:88px;text-align:right;height:38px}table.sl td.x{width:40px}
  table.fn{border-collapse:collapse}table.fn th{font-size:12px;color:var(--muted);font-weight:400;padding:4px 4px;text-align:left;white-space:nowrap}
  table.fn td{padding:3px 4px;white-space:nowrap}table.fn input,table.fn select{height:38px}table.fn input[data-f=name]{width:390px}table.fn select{width:auto}table.fn input[data-f=value]{width:80px;text-align:right}table.fn .u{display:inline-block;width:1.4em;color:var(--muted);font-size:13px}
  table.fn label.pu{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink);height:38px}table.fn label.pu input{width:auto;height:auto;margin:0}table.fn td.x{width:40px}
  .slw{overflow-x:auto}.slgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
  .kv2{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
  .pwbox{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.05em}
  .pwv{font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .box{background:#fff;border-radius:16px;padding:18px;width:min(520px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .modal .bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}#toast.on{opacity:1}
  @media (max-width:820px){
    #menuBtn{display:inline-block}
    nav{position:fixed;top:52px;bottom:0;left:0;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
    nav.open{transform:none}
    main{padding:14px 16px 60px}
    .top .who{display:none}
    table.perm tr.pr{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
    table.perm tr.pr td{border:none;padding:0 6px;text-align:left!important}
    table.perm .seg{display:flex}table.perm .seg button{flex:1}
  }
</style>
</head>
<body>
<div id="vLogin" class="hide"><form class="box" id="loginForm" autocomplete="on">
  <h1>OLIVE 管理</h1>
  <input id="lid" placeholder="ID" autocomplete="username" autocapitalize="off" spellcheck="false">
  <input id="lpw" type="password" placeholder="パスワード" autocomplete="current-password">
  <button class="primary" type="submit">ログイン</button>
  <div class="err" id="loginErr"></div>
</form></div>

<div id="vApp" class="hide">
  <div class="top">
    <button id="menuBtn">☰</button>
    <span class="ttl">OLIVE 管理</span>
    <select id="storeSel"></select><span id="storeName" style="font-weight:700"></span>
    <span class="who" id="who"></span>
    <button id="logoutBtn">ログアウト</button>
  </div>
  <div id="alertBar"></div>
  <div class="body">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
const SUPABASE_URL='https://gjqaxenwvvazhjtziusf.supabase.co', SUPABASE_KEY='sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
// POS・タイムカードと同じサイト上にあるので、ログイン情報は別の場所にしまう（POSのログインを横取りしない）
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'olive-admin-auth'}});
const EMAIL_DOMAIN='@admin.olive.local';
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2000); }
function guard(btn,fn){ return async(...a)=>{ if(btn.disabled) return; btn.disabled=true; try{ await fn(...a); } finally{ btn.disabled=false; } }; }
function modal(html){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box">${html}</div>`; document.body.appendChild(m); return m; }
function uiAlert(msg){ return new Promise(res=>{ const m=modal(`<div style="white-space:pre-wrap">${esc(msg)}</div><div class="bar"><button class="primary" data-k="ok">OK</button></div>`); m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(); }; }); }
function uiConfirm(msg,okLabel='OK',cls='primary'){ return new Promise(res=>{ const m=modal(`<div style="white-space:pre-wrap">${esc(msg)}</div><div class="bar"><button class="ghost" data-k="no">キャンセル</button><button class="${cls}" data-k="ok">${esc(okLabel)}</button></div>`); m.querySelector('[data-k=no]').onclick=()=>{ m.remove(); res(false); }; m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(true); }; }); }
async function rpc(fn,args){ const r=await sb.rpc(fn,args||{}); if(r.error){ await uiAlert(r.error.message); return {ok:false}; } return {ok:true,data:r.data}; }
function genPw(n=10){ const c='abcdefghjkmnpqrstuvwxyz23456789'; const a=crypto.getRandomValues(new Uint8Array(n)); return [...a].map(x=>c[x%c.length]).join(''); }
const fmtDT=t=>t?new Date(t).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';

// ---------- 画面の一覧（オーナー以外に見せるかは店舗ごとに設定） ----------
const SCREENS=[
  {grp:'集計'},
  {k:'summary',n:'まとめ'},
  {k:'pl',n:'収支'},
  {k:'cast_sales',n:'キャスト'},
  {k:'register',n:'レジ精算'},
  {k:'nippo',n:'日報登録'},
  {k:'cust',n:'お客様分析'},
  {grp:'設定'},
  {k:'set_cast',n:'キャスト管理（給与条件）'},
  {k:'set_pay',n:'給与項目'},
  {k:'set_cash',n:'入出金項目'},
  {k:'set_store',n:'店舗設定'},
  {k:'set_names',n:'名称変更'},
  {k:'set_pos',n:'POS設定'},
  {grp:'履歴'},
  {k:'hist_memo',n:'メモ一覧'},
  {k:'hist_cash',n:'入出金履歴'},
  {k:'hist_print',n:'印刷履歴'},
  {k:'hist_del',n:'削除履歴'},
];
const OWNER_SCREENS=[{grp:'オーナー'},{k:'o_perms',n:'表示設定'},{k:'o_share',n:'顧客情報の共有'},{k:'o_ids',n:'管理サイトのID'}];
const PERM_LABEL={none:'見られない',view:'見るだけ',edit:'変えられる'};

let me=null, storeId=null, page=null;
const stores=()=>me?.stores||[];
const curStore=()=>stores().find(s=>s.id===storeId);
const stSet=()=>me?.settings?.[storeId]||{perms:{},nippo_days:3};
// v0.05：収支は月次・日次を1つの画面にまとめた（前の設定 pl_day／pl_month も読む）
function perm(k){ if(me?.is_owner) return 'edit'; const p=stSet().perms||{}; if(k==='pl') return p.pl||p.pl_day||p.pl_month||'none'; if(k==='register') return p.register||p.register_month||'none'; /* v0.07：レジ精算も月次・日次を1つの画面に */ return p[k]||'none'; }

// ---------- ログイン ----------
$('loginForm').onsubmit=async e=>{ e.preventDefault(); $('loginErr').textContent='';
  const id=$('lid').value.trim().toLowerCase(), pw=$('lpw').value;
  if(!id||!pw){ $('loginErr').textContent='IDとパスワードを入れてください'; return; }
  const btn=e.submitter; if(btn) btn.disabled=true;
  try{ const { error }=await sb.auth.signInWithPassword({email:id+EMAIL_DOMAIN,password:pw});
    if(error){ $('loginErr').textContent='IDかパスワードが違います'; return; }
    $('lpw').value=''; await start(); } finally{ if(btn) btn.disabled=false; } };
$('logoutBtn').onclick=async()=>{ if(!await uiConfirm('ログアウトしますか？')) return; await sb.auth.signOut(); location.reload(); };
$('menuBtn').onclick=()=>$('nav').classList.toggle('open');
function showLogin(msg){ $('vApp').classList.add('hide'); $('vLogin').classList.remove('hide'); $('loginErr').textContent=msg||''; }

async function loadMe(){ const r=await sb.rpc('admin_me'); if(r.error||!r.data) return null; return r.data; }
async function start(){
  const { data:{ session } }=await sb.auth.getSession(); if(!session){ showLogin(); return; }
  me=await loadMe();
  if(!me){ await sb.auth.signOut(); showLogin('このIDでは管理サイトに入れません（止められたか、パスワードが変わりました）'); return; }
  const saved=(()=>{ try{ return localStorage.getItem('olive_admin_store'); }catch(e){ return null; } })();
  storeId=me.is_owner ? (stores().some(s=>s.id===saved)?saved:stores()[0]?.id) : me.store_id;
  $('vLogin').classList.add('hide'); $('vApp').classList.remove('hide');
  $('who').textContent=`${me.name||me.login_id}（ID：${me.login_id}）`;
  renderStoreSel(); renderAll();
  clearInterval(start.t); start.t=setInterval(refreshMe,60000);
}
// 1分ごとに読み直す（止められた・パスワードが変わった時はログアウト。警告も最新にする）
async function refreshMe(){ const m=await loadMe(); if(!m){ await sb.auth.signOut(); showLogin('ログインが切れました。もう一度ログインしてください'); return; } me=m; renderAlert(); }
function renderStoreSel(){
  if(me.is_owner){ $('storeSel').classList.remove('hide'); $('storeName').classList.add('hide');
    $('storeSel').innerHTML=stores().map(s=>`<option value="${s.id}" ${s.id===storeId?'selected':''}>${esc(s.name)}</option>`).join('');
    $('storeSel').onchange=()=>{ storeId=$('storeSel').value; try{ localStorage.setItem('olive_admin_store',storeId); }catch(e){} renderAll(); };
  } else { $('storeSel').classList.add('hide'); $('storeName').classList.remove('hide'); $('storeName').textContent=curStore()?.name||''; }
}
function renderAll(){ renderAlert(); renderNav(); const ok=page&&visible(page); go(ok?page:firstPage()); }
function visible(k){ if(k==='pw') return true; if(OWNER_SCREENS.some(s=>s.k===k)) return me.is_owner; return perm(k)!=='none'; }
function firstPage(){ return SCREENS.find(s=>s.k&&visible(s.k))?.k||'pw'; }

// ---------- 黒服を削除した時の警告 ----------
function renderAlert(){
  const s=stSet(), box=$('alertBar');
  if(!s.pw_alert){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="alertbar"><span>⚠ 黒服（${esc(s.pw_alert_note||'')}）が削除されました。POS・タイムカード・顧客サイトのパスワードを変えてください</span><button class="danger" id="rotBtn">全部のパスワードを新しくする</button></div>`;
  $('rotBtn').onclick=guard($('rotBtn'),()=>rotateAll());
}
async function rotateAll(){
  const st=curStore();
  if(!await uiConfirm(`${st?.name||''} のパスワードを全部新しくします。\n\n・POS・タイムカードの端末\n・顧客サイト\n\n今ログインしている端末は全部ログアウトされます。営業中は注意してください。`,'新しくする','danger')) return;
  const r=await rpc('admin_rotate_store',{p_store:storeId}); if(!r.ok) return;
  await showNewPasswords(r.data); me=await loadMe()||me; renderAll();
}
const CS_KIND={view:'顧客サイト（見る用）',edit:'顧客サイト（編集用）'};
function showNewPasswords(d){ return new Promise(res=>{
  const rows=[...(d.devices||[]).map(x=>`<tr><td>${esc(x.label||'端末')}<br><small class="muted">${esc(x.email||'')}</small></td><td class="pwbox">${esc(x.pw)}</td></tr>`),
              ...(d.cs||[]).map(x=>`<tr><td>${esc(CS_KIND[x.kind]||x.kind)}</td><td class="pwbox">${esc(x.pw)}</td></tr>`)].join('');
  const m=modal(`<h2 style="margin:0">新しいパスワード</h2><div class="muted" style="font-size:14px">このパスワードは、あとからでも「パスワード」の画面で見られます</div><table class="t">${rows||'<tr><td class="muted">変えるものがありませんでした</td></tr>'}</table><div class="bar"><button class="primary" data-k="ok">閉じる</button></div>`);
  m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(); }; }); }

// ---------- メニュー ----------
function renderNav(){
  const items=[...SCREENS,...(me.is_owner?OWNER_SCREENS:[]),{grp:'アカウント'},{k:'pw',n:'パスワード'}];
  let html='', pendingGrp=null;
  for(const s of items){
    if(s.grp){ pendingGrp=s.grp; continue; }
    if(!visible(s.k)) continue;
    if(pendingGrp){ html+=`<div class="grp">${esc(pendingGrp)}</div>`; pendingGrp=null; }
    const p=perm(s.k), tag=(!me.is_owner&&SCREENS.some(x=>x.k===s.k)&&p==='view')?'<span class="tag">見るだけ</span>':'';
    html+=`<a data-go="${s.k}" class="${s.k===page?'on':''}">${esc(s.n)}${tag}</a>`;
  }
  $('nav').innerHTML=html;
  $('nav').querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{ $('nav').classList.remove('open'); go(a.dataset.go); });
}
function go(k){ page=k; $('nav').querySelectorAll('[data-go]').forEach(a=>a.classList.toggle('on',a.dataset.go===k));
  const f=PAGES[k]||pagePending; f(k); $('main').scrollTop=0; window.scrollTo(0,0); }
const nameOf=k=>[...SCREENS,...OWNER_SCREENS].find(s=>s.k===k)?.n||'';

// ---------- まだ作っていない画面 ----------
function pagePending(k){ $('main').innerHTML=`<h1>${esc(nameOf(k))}</h1><div class="card muted">この画面はこれから作ります</div>`; }

const PAGES={};

// ---------- 収支（月次・日次を画面の中で切り替える） ----------
let plTab='month';
PAGES.pl=()=>{
  $('main').innerHTML=`<h1>収支</h1><div class="row" style="margin-bottom:14px"><span class="seg">${[['month','月次'],['day','日次']].map(([v,n])=>`<button data-pt="${v}" class="${plTab===v?'on':''}">${n}</button>`).join('')}</span></div><div class="card muted">${plTab==='month'?'月次':'日次'}の画面はこれから作ります</div>`;
  $('main').querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{ plTab=b.dataset.pt; PAGES.pl(); });
};

// ---------- レジ精算（v0.07：月次・日次を1つの画面で切り替える）----------
// POS の閉店作業と同じ計算。管理サイトでは見るだけ（精算の保存は POS で行う）
const DENOMS=[[10000,'1万円札'],[5000,'5千円札'],[2000,'2千円札'],[1000,'千円札'],[500,'500円玉'],[100,'100円玉'],[50,'50円玉'],[10,'10円玉'],[5,'5円玉'],[1,'1円玉']];
const yen=n=>Number(n||0).toLocaleString('ja-JP')+'円';
const sgnYen=n=>(n>0?'+':'')+yen(n);
function businessDate(d=new Date()){ const x=new Date(d.getTime()-8*3600*1000); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
const bdStart=d=>new Date(`${d}T08:00:00`).toISOString();
const md=x=>`${+x.slice(5,7)}/${+x.slice(8,10)}`;
const WJ=['日','月','火','水','木','金','土'];
let regDate=null, regMonth=null, regTab='day';
const regHead=()=>`<h1>レジ精算 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1><div class="row" style="margin-bottom:14px"><span class="seg">${[['month','月次'],['day','日次']].map(([v,n])=>`<button data-rt="${v}" class="${regTab===v?'on':''}">${n}</button>`).join('')}</span></div>`;
function regTabs(){ $('main').querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{ if(b.dataset.rt==='month'&&regTab==='day'&&regDate) regMonth=regDate.slice(0,7); /* v0.08：日次で見ている日の月を開く */ regTab=b.dataset.rt; PAGES.register(); }); }
PAGES.register=()=>regTab==='month'?regMonthPage():regDayPage();
// 期間（from〈含まない〉〜to〈含まない〉）の日ごとの 現金売上・入金・出金（日払い含む）
async function regMoves(fromEx,toEx){
  const [mv,adv,pay]=await Promise.all([
    sb.from('cash_movements').select('business_date,kind,amount').eq('store_id',storeId).gt('business_date',fromEx).lt('business_date',toEx),
    sb.from('daily_advances').select('business_date,amount').eq('store_id',storeId).gt('business_date',fromEx).lt('business_date',toEx),
    sb.from('payments').select('amount,paid_at,bills!inner(status,store_id)').eq('method','cash').eq('bills.store_id',storeId).gte('paid_at',bdStart(fromEx)).lt('paid_at',bdStart(toEx)) ]);
  const er=mv.error||adv.error||pay.error; if(er) return {error:er};
  const sum={}; const add=(dd,k,v)=>{ if(dd<=fromEx||dd>=toEx) return; (sum[dd]=sum[dd]||{sales:0,cin:0,cout:0})[k]+=Number(v)||0; };
  (mv.data||[]).forEach(x=>add(x.business_date,x.kind==='in'?'cin':'cout',x.amount)); (adv.data||[]).filter(x=>x.amount>0).forEach(x=>add(x.business_date,'cout',x.amount));
  (pay.data||[]).filter(p=>p.bills&&p.bills.status!=='void'&&p.amount).forEach(p=>add(businessDate(new Date(p.paid_at)),'sales',p.amount));
  return {sum}; }
const dayAdd=(d,n)=>{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };

async function regDayPage(){

  const [mv,adv,pay,cls,prev,stf]=await Promise.all([
    sb.from('cash_movements').select('*').eq('store_id',st).eq('business_date',d).order('created_at'),
    sb.from('daily_advances').select('staff_id,amount').eq('store_id',st).eq('business_date',d),
    sb.from('payments').select('amount,bills!inner(status,store_id)').eq('method','cash').eq('bills.store_id',st).gte('paid_at',bdStart(d)).lt('paid_at',bdStart(dayAdd(d,1))),
    sb.from('register_closings').select('*').eq('store_id',st).eq('business_date',d).maybeSingle(),
    sb.from('register_closings').select('business_date,next_float').eq('store_id',st).lt('business_date',d).order('business_date',{ascending:false}).limit(1),
    sb.from('staff').select('id,display_name').eq('store_id',st) ]);

  const nm=id=>(stf.data||[]).find(x=>x.id===id)?.display_name||'';
  const moves=mv.data||[]; const inSum=moves.filter(m=>m.kind==='in').reduce((a,m)=>a+m.amount,0), outSum=moves.filter(m=>m.kind==='out').reduce((a,m)=>a+m.amount,0);
  const advRows=(adv.data||[]).filter(a=>a.amount>0); const advSum=advRows.reduce((a,x)=>a+x.amount,0);
  const cashSales=(pay.data||[]).filter(p=>p.bills&&p.bills.status!=='void').reduce((a,p)=>a+(p.amount||0),0);
  const saved=cls.data||null, prevRow=(prev.data||[])[0]||null;
  // 前回の精算から今日までに未精算の日があれば、その日の現金の動きも本日釣銭に含める（POS と同じ）
  let gapNet=0, gapDays=[]; if(!saved&&prevRow){ const g=await regMoves(prevRow.business_date,d); if(page!=='register'||regDate!==d) return; const done=new Set(); const r2=await sb.from('register_closings').select('business_date').eq('store_id',st).gt('business_date',prevRow.business_date).lt('business_date',d); (r2.data||[]).forEach(x=>done.add(x.business_date)); Object.entries(g.sum||{}).forEach(([k,v])=>{ if(done.has(k)) return; const n=v.sales+v.cin-v.cout; if(n){ gapNet+=n; gapDays.push(k); } }); gapDays.sort(); }
  const idle=!saved&&d<today&&!outSum&&!inSum&&!advSum&&!cashSales;
  const opening=saved?saved.opening_float:(prevRow?Number(prevRow.next_float)+gapNet:null);
  const sales=saved?saved.cash_sales:cashSales, cin=saved?saved.cash_in:inSum, cout=saved?saved.cash_out:outSum+advSum;
  const expected=opening==null?null:opening+sales+cin-cout;
  const counted=saved?saved.counted:idle?expected:null, diff=saved?saved.diff:idle?0:null, deposit=saved?saved.deposit:idle?0:null, next=saved?(saved.next_float??saved.counted-saved.deposit):idle?expected:null;
  const cnt=saved?.counts||{};
  const V=v=>v==null?'<span class="muted">—</span>':yen(v);
  $('main').innerHTML=regHead()+`<div id="regWarn"></div>
  <div class="row" style="margin-bottom:14px"><button class="ghost sm" id="regPrev">◀ 前の日</button><input type="date" id="regDateIn" value="${d}" style="width:auto"><button class="ghost sm" id="regNext">次の日 ▶</button>
    <span class="badge ${saved||idle?'k':d>today?'gray':'warnb'}">${saved?'精算済み':idle?'精算済み（変動なし自動繰越）':d>today?'これから':'未精算'}</span><span class="muted" style="font-size:13px">見るだけ（精算の保存は POS で行います）</span></div>
  <div class="card"><h2>入出金</h2><table class="t">${moves.map(m=>`<tr><td style="width:60px"><span class="badge ${m.kind==='out'?'gray':''}">${m.kind==='out'?'出金':'入金'}</span></td><td style="width:100%">${esc(m.memo||'')}</td><td class="num">${yen(m.amount)}</td></tr>`).join('')}
    <tr><td><span class="badge gray">出金</span></td><td style="width:100%">日払い合計 <small class="muted">${advRows.length?esc(advRows.map(a=>nm(a.staff_id)+' '+a.amount.toLocaleString()).join('、')):'なし'}</small></td><td class="num">${yen(advSum)}</td></tr></table></div>
  <div class="card"><h2>レジ金合わせ</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start">
    <table class="t"><tr><th>金種</th><th class="num">枚数</th><th class="num">金額</th></tr>${saved?DENOMS.map(([v,n])=>{ const c=Number(cnt[v])||0; return `<tr><td>${n}</td><td class="num">${c?c.toLocaleString():''}</td><td class="num">${c?yen(v*c):''}</td></tr>`; }).join('')+`<tr><td><b>合計金額</b></td><td></td><td class="num"><b>${yen(saved.counted)}</b></td></tr>`:'<tr><td colspan="3" class="muted">まだ精算していません</td></tr>'}</table>
    <div class="kv2">
      <span>本日釣銭${gapDays.length?`<br><small class="muted">${gapDays.map(md).join('・')} の未精算分 ${sgnYen(gapNet)} を含む</small>`:''}</span><span class="num">${opening==null?'<span class="muted">初回は POS で入力</span>':yen(opening)}</span>

      <span>入金合計</span><span class="num">${yen(cin)}</span>

      <span>レジ内現金（理論値）</span><span class="num">${V(expected)}</span>

      <span>預金金額</span><span class="num">${V(deposit)}</span>
      <span>翌日釣銭準備金</span><span class="num">${V(next)}</span>
    </div></div></div>
`; regTabs();
  const goD=x=>{ regDate=x; PAGES.register(); };
  $('regDateIn').onchange=e=>{ if(e.target.value) goD(e.target.value); };
  $('regPrev').onclick=()=>goD(dayAdd(d,-1)); $('regNext').onclick=()=>goD(dayAdd(d,1));

  const [g,cl]=await Promise.all([regMoves(from,d), sb.from('register_closings').select('business_date').eq('store_id',st).gt('business_date',from).lt('business_date',d)]);

async function regMonthPage(){
  const today=businessDate(); if(!regMonth) regMonth=today.slice(0,7); const mo=regMonth, st=storeId;
  const [y,m]=mo.split('-').map(Number); const last=new Date(y,m,0).getDate(); const d1=`${mo}-01`, dN=`${mo}-${String(last).padStart(2,'0')}`;
  $('main').innerHTML=regHead()+`<div class="row" style="margin-bottom:14px"><button class="ghost sm" id="rmPrev">◀ 前の月</button><input type="month" id="rmIn" value="${mo}" style="width:auto"><button class="ghost sm" id="rmNext">次の月 ▶</button></div><div class="card" id="rmBox"><div class="muted">読み込み中…</div></div>`; regTabs();
  const goM=x=>{ regMonth=x; PAGES.register(); };
  const shiftM=n=>{ const t=new Date(y,m-1+n,1); goM(`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`); };
  $('rmIn').onchange=e=>{ if(e.target.value) goM(e.target.value); }; $('rmPrev').onclick=()=>shiftM(-1); $('rmNext').onclick=()=>shiftM(1);
  const [r,pv,g]=await Promise.all([ sb.from('register_closings').select('*').eq('store_id',st).gte('business_date',d1).lte('business_date',dN),
    sb.from('register_closings').select('next_float').eq('store_id',st).lt('business_date',d1).order('business_date',{ascending:false}).limit(1),
    regMoves(dayAdd(d1,-1),dayAdd(dN,1)) ]);
  if(page!=='register'||regTab!=='month'||regMonth!==mo||storeId!==st) return;
  const er=r.error||pv.error||g.error; if(er){ $('rmBox').innerHTML=`<div class="err">${esc(er.message)}</div>`; return; }
  const byD={}; (r.data||[]).forEach(x=>byD[x.business_date]=x); const sum=g.sum||{};
  let carry=Number((pv.data||[])[0]?.next_float)||0; const rows=[]; const C=v=>`<td>${v}</td>`; const CS=v=>`<td style="text-align:left;font-size:12px;line-height:1.3">${v}</td>`;
  const tot={sales:0,cin:0,cout:0,diff:0,deposit:0};
  for(let i=1;i<=last;i++){ const dd=`${mo}-${String(i).padStart(2,'0')}`; const dl=`${dd.slice(5).replace('-','/')}（${WJ[new Date(dd+'T00:00:00').getDay()]}）`; const x=byD[dd];
    if(x){ rows.push(`<tr data-rd="${dd}">${C(dl)}${C(yen(x.opening_float))}${C(yen(x.cash_sales))}${C(yen(x.cash_in))}${C(yen(x.cash_out))}${C(yen(x.expected))}${C(yen(x.counted))}<td style="${x.diff?'color:#c0392b':''}">${sgnYen(x.diff)}</td>${C(yen(x.deposit))}${CS('精算済み')}</tr>`);
      tot.sales+=x.cash_sales; tot.cin+=x.cash_in; tot.cout+=x.cash_out; tot.diff+=x.diff; tot.deposit+=x.deposit; carry=Number(x.next_float??(x.counted-x.deposit))||0; continue; }
    if(dd>today){ rows.push(`<tr style="color:var(--muted)">${C(dl)}${C('').repeat(9)}</tr>`); continue; }
    const t=sum[dd]||{sales:0,cin:0,cout:0}; const exp=carry+t.sales+t.cin-t.cout; const idle=!t.sales&&!t.cin&&!t.cout; tot.sales+=t.sales; tot.cin+=t.cin; tot.cout+=t.cout;
    rows.push(`<tr data-rd="${dd}" style="color:var(--muted)">${C(dl)}${C(yen(carry))}${C(yen(t.sales))}${C(yen(t.cin))}${C(yen(t.cout))}${C(yen(exp))}${idle?C(yen(exp))+C(yen(0))+C(yen(0))+CS(dd<today?'精算済み<br>（変動なし自動繰越）':''):C('')+C('')+C('')+CS('<span style="color:#c0392b">未精算</span>')}</tr>`); carry=exp; }
  $('rmBox').innerHTML=`<div style="overflow-x:auto"><table class="reg"><tr>${['日付','本日釣銭','現金売上','入金合計','出金合計','理論値','レジ内現金','過不足','預金','状態'].map(h=>`<th${h==='状態'?' style="text-align:left"':''}>${h}</th>`).join('')}</tr>${rows.join('')}
    <tr style="font-weight:700"><td>合計</td><td></td><td>${yen(tot.sales)}</td><td>${yen(tot.cin)}</td><td>${yen(tot.cout)}</td><td></td><td></td><td style="${tot.diff?'color:#c0392b':''}">${sgnYen(tot.diff)}</td><td>${yen(tot.deposit)}</td><td></td></tr></table></div>
    <div class="muted" style="font-size:13px;margin-top:8px">行を押すと、その日の日次を開きます</div>`;
  $('rmBox').querySelectorAll('[data-rd]').forEach(t=>t.onclick=()=>{ regDate=t.dataset.rd; regTab='day'; PAGES.register(); });
}

// ---------- 給与項目（v0.09：スライド表。店舗で全員同じ）----------
// キャストの時給＝小計（またはポイント）スライド・同伴スライド・保証時給のうち一番高いもの（POS と同じ）。黒服のボーナス総額＝人件費比率のボーナス＋売上ボーナス
const SLIDE_DEF={
  sales:{t:'小計スライド',sub:'係小計で時給が決まる',cols:[{k:'threshold',l:'係小計（万円以上）',sc:10000},{k:'wage',l:'時給（円）'}]},
  points:{t:'ポイントスライド',sub:'ポイントで時給が決まる',cols:[{k:'threshold',l:'ポイント（以上）'},{k:'wage',l:'時給（円）'}]},
  douhan:{t:'同伴スライド',sub:'月の同伴回数で時給が決まる',cols:[{k:'threshold',l:'同伴（回以上）'},{k:'wage',l:'時給（円）'}]},
  hall:{t:'黒服ボーナススライド',sub:'',cols:[{k:'sales_man',l:'売上（万円以上）'},{k:'target_ratio',l:'目標比率（%）',sc:0.01},{k:'b_within',l:'以内'},{k:'b_plus2',l:'＋2%まで'},{k:'b_plus5',l:'＋5%まで'},{k:'b_over',l:'5%超'},{k:'b_sales',l:'売上ボーナス'}]},
};
const slNum=v=>{ const t=String(v??'').replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，\s]/g,''); return t===''?null:Number(t); };
const slShow=(v,sc)=>v==null?'':String(Math.round(Number(v)/(sc||1)*10000)/10000);
function slideCard(kind,rows,ed,note){ const d=SLIDE_DEF[kind];
  const body=rows.map((r,i)=>`<tr data-i="${i}">${d.cols.map(c=>`<td><input inputmode="decimal" data-c="${c.k}" value="${esc(slShow(r[c.k],c.sc))}" ${ed?'':'disabled'}></td>`).join('')}${ed?`<td class="x"><button class="ghost sm" data-del="${i}" aria-label="行を消す">✕</button></td>`:''}</tr>`).join('');
  return `<div class="card" data-sl="${kind}"><h2>${d.t}${d.sub?`<br><small class="muted" style="font-weight:400">${esc(d.sub)}</small>`:''}</h2>${note||''}
    <div class="slw"><table class="sl"><tr>${d.cols.map(c=>`<th>${c.l}</th>`).join('')}${ed?'<th></th>':''}</tr>${body||`<tr><td colspan="${d.cols.length}" class="muted" style="padding:8px 4px">まだ入っていません</td></tr>`}</table></div>
    ${ed?`<div class="row" style="margin-top:10px"><button class="ghost sm" data-add>＋ 行を足す</button><button class="primary sm" data-save>保存</button></div>`:''}</div>`; }
function slideRead(card,kind){ const d=SLIDE_DEF[kind]; const out=[];
  for(const tr of card.querySelectorAll('tr[data-i]')){ const r={}; let empty=true;
    for(const c of d.cols){ const v=slNum(tr.querySelector(`[data-c="${c.k}"]`).value); if(v!=null) empty=false; if(v!=null&&!Number.isFinite(v)) return {err:`「${c.l}」に数字でないものがあります`}; r[c.k]=v==null?null:Math.round(v*(c.sc||1)*10000)/10000; }
    if(empty) continue; if(r[d.cols[0].k]==null||r[d.cols[1].k]==null) return {err:`「${d.cols[0].l}」と「${d.cols[1].l}」は必ず入れてください`}; out.push(r); }
  const k0=d.cols[0].k; out.sort((a,b)=>a[k0]-b[k0]); for(let i=1;i<out.length;i++) if(out[i][k0]===out[i-1][k0]) return {err:`「${d.cols[0].l}」が同じ行が2つあります`};
  return {rows:out}; }

    const sv=$('afSave'); sv.onclick=guard(sv,async()=>{ const m=slNum($('afM').value); if(m==null||!Number.isInteger(m)||m<1||m>180){ await uiAlert('何分前かは 1〜180 の整数で入れてください'); return; } const cl=closeTxt(ax.data.close);
      if(!await uiConfirm(on?`閉店（${cl}）の ${m}分前を過ぎたアフターは、閉店まで働いたことにしますか？\nこれから押す打刻から変わります`:'アフターの延長を「しない」にしますか？\nこれから押す打刻から変わります')) return;
      const r=await rpc('admin_set_after_ext',{p_store:st,p_on:on,p_minutes:m}); if(!r.ok) return; toast('保存しました'); PAGES.set_pay(); }); } }
  { const fc=$('main').querySelector('[data-fines]'); if(fc){ fc.querySelector('[data-fadd]').onclick=()=>{ const tb=fc.querySelector('table.fn'); fc.querySelector('[data-fempty]')?.remove(); tb.insertAdjacentHTML('beforeend',fineRowHtml({},true)); const last=[...tb.querySelectorAll('tr[data-fr]')].pop(); fineRowWire(last,true); last.querySelector('[data-f=name]').focus(); };
    const hs=$('dHoursSave'); if(hs) hs.onclick=guard(hs,async()=>{ const h=slNum($('dHours').value); if(h==null||!(h>0&&h<=24)){ await uiAlert('所定時間は0より大きく24以下の数にしてください'); return; } if(!await uiConfirm(`日給の人の所定時間を ${h}時間 にしますか？\n時間給 ＝ 日給 ÷ ${h}時間 になります`)) return; const r=await rpc('admin_set_daily_hours',{p_store:st,p_hours:h}); if(!r.ok) return; toast('保存しました'); PAGES.set_pay(); });
    const sv=fc.querySelector('[data-fsave]'); sv.onclick=guard(sv,async()=>{ const g=fineRead(fc); if(g.err){ await uiAlert(g.err); return; } if(!await uiConfirm(`罰金の種類を保存しますか？（${g.rows.length}行）\nPOS の「＋罰金」の一覧も変わります。今までに登録した罰金は変わりません`)) return;
      const r=await rpc('admin_save_fine_types',{p_store:st,p_rows:g.rows}); if(!r.ok) return; toast('保存しました'); PAGES.set_pay(); }); } }
  $('wb').querySelectorAll('button').forEach(b=>b.onclick=guard(b,async()=>{ const v=b.dataset.v==='true'; if(v===byPt) return;
    if(!await uiConfirm(`時給の決め方を「${v?'ポイント':'係小計'}」に変えますか？\nPOS の時給の表示も変わります`)) return;
    const r=await rpc('admin_set_wage_basis',{p_store:st,p_by_point:v}); if(!r.ok) return; toast('変えました'); PAGES.set_pay(); }));
  $('main').querySelectorAll('[data-sl]').forEach(card=>{ const kind=card.dataset.sl, d=SLIDE_DEF[kind];
    card.querySelector('[data-add]').onclick=()=>{ const tb=card.querySelector('table.sl'); const ph=tb.querySelector('td[colspan]'); if(ph) ph.parentElement.remove(); const i=tb.querySelectorAll('tr[data-i]').length+Date.now(); const tr=document.createElement('tr'); tr.dataset.i=i; tr.innerHTML=d.cols.map(c=>`<td><input inputmode="decimal" data-c="${c.k}"></td>`).join('')+`<td class="x"><button class="ghost sm" aria-label="行を消す">✕</button></td>`; tr.querySelector('button').onclick=()=>tr.remove(); tb.appendChild(tr); tr.querySelector('input').focus(); };
    card.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>x.closest('tr').remove());
    const sv=card.querySelector('[data-save]'); sv.onclick=guard(sv,async()=>{ const g=slideRead(card,kind); if(g.err){ await uiAlert(g.err); return; }
      if(!await uiConfirm(`${d.t}を保存しますか？（${g.rows.length}行）`)) return;
      const r=kind==='hall'?await rpc('admin_save_hall_bonus',{p_store:st,p_rows:g.rows}):await rpc('admin_save_pay_slides',{p_store:st,p_kind:kind,p_rows:g.rows}); if(!r.ok) return;
      toast('保存しました'); PAGES.set_pay(); }); });
};

// v0.11・SQL 052：罰金の種類（店舗ごと）。POS の在籍リスト「＋罰金」で選ぶ。金額が決まっているものはそのまま登録、時給の％は月末の時給で計算、日給の％はその人の日給で計算
const FINE_TG=[['all','全員'],['hourly','時給の人'],['daily','日給の人']], FINE_CL=[['yen','円'],['hourly_pct','時給の％'],['daily_pct','日給の％'],['input','その都度入れる'],['daily_late','日給：遅刻（時間分）'],['daily_early','日給：早上がり（時間分）']];
const FINE_TIME=c=>c==='daily_late'||c==='daily_early';
function fineRowHtml(r,ed){ const dis=ed?'':'disabled';
  return `<tr data-fr><td><input data-f="name" value="${esc(r.name||'')}" ${dis}></td><td><select data-f="target" ${dis}>${FINE_TG.map(([v,n])=>`<option value="${v}" ${(r.target||'all')===v?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><select data-f="calc" ${dis}>${FINE_CL.map(([v,n])=>`<option value="${v}" ${(r.calc||'yen')===v?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input data-f="value" inputmode="numeric" value="${r.value??''}" ${dis}><span class="u"></span></td><td><label class="pu"><input type="checkbox" data-f="per_unit" ${r.per_unit?'checked':''} ${dis}>個数を入れる</label></td>${ed?'<td class="x"><button class="ghost sm" data-fdel aria-label="行を消す">✕</button></td>':''}</tr>`; }
function fineRowWire(tr,ed){ const cl=tr.querySelector('[data-f=calc]'), v=tr.querySelector('[data-f=value]'), pu=tr.querySelector('[data-f=per_unit]'), u=tr.querySelector('.u');
  const upd=()=>{ const c=cl.value; u.textContent=c==='yen'?'円':c==='input'?'':'%'; v.disabled=!ed||c==='input'; if(c==='input') v.value=''; v.placeholder=FINE_TIME(c)?'足す％':''; pu.disabled=!ed||c!=='yen'; if(c!=='yen') pu.checked=false; }; cl.onchange=upd; upd();
  const d=tr.querySelector('[data-fdel]'); if(d) d.onclick=()=>tr.remove(); }
function fineCard(rows,ed,hours){ return `<div class="card" data-fines><h2>罰金の種類<br><small class="muted" style="font-weight:400">POS の在籍リストの「＋罰金」で選びます</small></h2>
  <div class="muted" style="font-size:13px;margin-bottom:8px;line-height:1.6">円：選ぶとその金額で登録します（「個数を入れる」にすると 金額×個数）<br>時給の％：月末に決まった時給で計算します（POS では「時給×○%」と記録します）<br>日給の％：その人の日給（POS のキャストの詳細で入れます）で計算します<br>その都度入れる：選んだ時に金額を入れます<br>日給：遅刻・早上がり：決まった時刻と打刻（15分丸め）の差 × 時間給（日給 ÷ 下の所定時間）。「足す％」を入れると日給のその％を足します（無断の時など）<br>一覧にないものは、POS で「その他」を選んで理由と金額を入れられます</div>
  <div class="row" style="margin-bottom:10px;font-size:14px">日給の人の所定時間<input id="dHours" inputmode="decimal" value="${hours??''}" ${ed&&hours!=null?'':'disabled'} style="width:80px;text-align:right">時間${ed&&hours!=null?'<button class="ghost sm" id="dHoursSave">保存</button>':''}${hours==null?'<span class="muted" style="font-size:13px">SQL 053 が未実行です</span>':''}</div>
  <div class="slw"><table class="fn"><tr><th>名前</th><th>対象</th><th>決め方</th><th>金額・％</th><th></th>${ed?'<th></th>':''}</tr>${rows.map(r=>fineRowHtml(r,ed)).join('')||''}</table>${rows.length?'':'<div class="muted" data-fempty style="padding:8px 4px">まだ入っていません</div>'}</div>
  ${ed?'<div class="row" style="margin-top:10px"><button class="ghost sm" data-fadd>＋ 行を足す</button><button class="primary sm" data-fsave>保存</button></div>':''}</div>`; }
function fineRead(card){ const out=[]; let i=0;
  for(const tr of card.querySelectorAll('tr[data-fr]')){ i++; const g=k=>tr.querySelector(`[data-f=${k}]`); const name=g('name').value.trim(), calc=g('calc').value, vs=g('value').value;
    if(!name&&!vs.trim()) continue; if(!name) return {err:`${i}行目：名前を入れてください`};
    let value=null; if(FINE_TIME(calc)){ value=slNum(vs); if(value!=null&&(!Number.isInteger(value)||value<=0)) return {err:`${i}行目（${name}）：足す％は1以上の整数にするか、空けてください`}; }
    else if(calc!=='input'){ value=slNum(vs); if(value==null||!Number.isInteger(value)||value<=0) return {err:`${i}行目（${name}）：${calc==='yen'?'金額':'％'}を1以上の整数で入れてください`}; }
    out.push({name,target:g('target').value,calc,value,per_unit:calc==='yen'&&g('per_unit').checked}); }
  const seen=new Set(); for(const r of out){ const k=r.name+'/'+r.target; if(seen.has(k)) return {err:`名前と対象が同じ行が2つあります：${r.name}`}; seen.add(k); }
  return {rows:out}; }

// v0.14・SQL 055：アフターの延長（attendance_rules。タイムカードの打刻の時に round_punch が使う）。閉店の○分前を過ぎたアフターは、閉店まで働いたことにする。閉店時間は店舗設定で決める
const closeTxt=c=>{ const m=String(c||'01:00').match(/^(\d{1,2}):(\d{2})/); return m?`${+m[1]<12?'翌':''}${+m[1]}:${m[2]}`:String(c); };
function afterCard(ax,ed){ const h='<h2>アフターの延長<br><small class="muted" style="font-weight:400">アフターの打刻（退勤の代わり）で、時給を付ける時間を延ばします</small></h2>';
  if(ax.error) return `<div class="card">${h}<div class="err">${esc(/after_ext|minutes|close/.test(ax.error.message)||/find|exist|schema cache/.test(ax.error.message)?'SQL 055 が未実行です：':'読み込めません：')}${esc(ax.error.message)}</div></div>`;
  const a=ax.data||{}; if(a.minutes==null) return `<div class="card">${h}<div class="err">SQL 055 が未実行です</div></div>`;
  const on=!!a.on, dis=ed?'':'disabled', cl=closeTxt(a.close);
  return `<div class="card" data-after>${h}<div class="row"><span class="seg" id="afOn">${[[true,'する'],[false,'しない']].map(([v,n])=>`<button data-v="${v}" class="${on===v?'on':''}" ${dis}>${n}</button>`).join('')}</span></div>
    <div class="row" style="margin-top:10px;font-size:14px">閉店（${esc(cl)}）の<input id="afM" inputmode="numeric" value="${esc(String(a.minutes))}" ${dis} style="width:80px;text-align:right">分前を過ぎたアフターは、閉店（${esc(cl)}）まで働いたことにする${ed?'<button class="primary sm" id="afSave">保存</button>':''}</div>
    <div class="muted" style="font-size:13px;margin-top:8px;line-height:1.6">時給の人・日給の人の両方。タイムカードで打刻した時に決まります（変えても、前の打刻はそのまま）<br>閉店時間は「店舗設定」で変えます。退勤・アフターの打刻は閉店より後になりません</div></div>`; }

// ---------- 店舗設定 v0.14・SQL 055：閉店時間（タイムカードの打ち止め。アフターの延長もここから数える） ----------
PAGES.set_store=async()=>{ const st=storeId, ed=perm('set_store')==='edit';
  $('main').innerHTML=`<h1>店舗設定 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1><div class="card muted">読み込み中…</div>`;
  const ax=await sb.rpc('admin_get_after_ext',{p_store:st}); if(page!=='set_store'||storeId!==st) return;
  const bad=ax.error||ax.data?.close==null;
  $('main').innerHTML=`<h1>店舗設定 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>${ed?'':'<div class="muted" style="margin-bottom:10px">見るだけ</div>'}
  <div class="card"><h2>閉店時間</h2>${bad?`<div class="err">${ax.error?'読み込めません：'+esc(ax.error.message):'SQL 055 が未実行です'}</div>`:`
    <div class="row" style="font-size:14px">閉店<input type="time" id="clT" value="${esc(ax.data.close)}" ${ed?'':'disabled'} style="width:140px">${ed?'<button class="primary sm" id="clSave">保存</button>':''}</div>
    <div class="muted" style="font-size:13px;margin-top:8px;line-height:1.6">タイムカードの退勤・アフターの打刻は、閉店より後になりません（時給は閉店まで）<br>0:00〜6:00 は日付が変わった後として扱います（例：1:00 ＝ 翌1:00、23:00 ＝ その日の23:00）<br>アフターの延長（給与項目）も、この閉店時間から数えます。変えても、前の打刻はそのまま</div>`}</div>`;
  if(!ed||bad) return;
  const sv=$('clSave'); sv.onclick=guard(sv,async()=>{ const v=$('clT').value; if(!v){ await uiAlert('閉店時間を入れてください'); return; } if(v>'06:00'&&v<'18:00'){ await uiAlert('閉店時間は 18:00〜翌6:00 の間にしてください'); return; }
    if(!await uiConfirm(`閉店時間を ${closeTxt(v)} にしますか？\nこれから押す打刻から変わります`)) return;
    const r=await rpc('admin_set_close_time',{p_store:st,p_close:v}); if(!r.ok) return; toast('保存しました'); PAGES.set_store(); }); };

  const rows=SCREENS.map(x=>x.grp?`<tr><th colspan="2" style="padding-top:14px;color:var(--ink);font-weight:700">${esc(x.grp)}</th></tr>`

  <div class="muted" style="font-size:14px;margin-top:6px">例：3 にすると、今日・昨日・2日前・3日前まで。0 にすると今日だけ</div></div>
  <div class="row"><button class="primary" id="permSave">保存</button></div>`;
  $('main').querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ perms[g.dataset.pk]=b.dataset.v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));
  $('permSave').onclick=guard($('permSave'),async()=>{

    const r=await rpc('admin_save_store_settings',{p_store:storeId,p_perms:clean,p_nippo_days:n}); if(!r.ok) return;
    me=await loadMe()||me; toast('保存しました'); renderNav(); });

  $('main').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editAccount(list.find(a=>a.id===b.dataset.ed),halls));
};
async function editAccount(a,halls){ if(!a) return;
  const m=modal(`<h2 style="margin:0">IDの変更：${esc(a.login_id)}</h2>
    <label>名前<input data-k="name" value="${esc(a.name)}"></label>
    <label>黒服と結びつける<select data-k="staff"><option value="">結びつけない</option>${halls.map(h=>`<option value="${h.id}" ${h.id===a.staff_id?'selected':''}>${esc(h.name)}</option>`).join('')}${a.staff_id&&!halls.some(h=>h.id===a.staff_id)?`<option value="${a.staff_id}" selected>${esc(a.staff_name||'（削除済みの黒服）')}</option>`:''}</select></label>
    <label>状態<select data-k="active"><option value="1" ${a.is_active?'selected':''}>使える</option><option value="0" ${a.is_active?'':'selected'}>止める（ログインできなくする）</option></select></label>
    <div class="bar"><button class="ghost" data-k="no">キャンセル</button><button class="primary" data-k="ok">保存</button></div>`);
  const q=k=>m.querySelector(`[data-k=${k}]`);
  q('no').onclick=()=>m.remove();
  q('ok').onclick=guard(q('ok'),async()=>{ const act=q('active').value==='1';
    if(a.is_active&&!act&&!await uiConfirm(`「${a.login_id}」を止めます。今ログインしていてもすぐに使えなくなります`,'止める','danger')) return;
    const r=await rpc('admin_account_update',{p_id:a.id,p_name:q('name').value.trim(),p_staff:q('staff').value||null,p_active:act}); if(!r.ok) return;
    m.remove(); toast('保存しました'); PAGES.o_ids(); });
}

// ---------- パスワード ----------
PAGES.pw=async()=>{
  const own=`<div class="card"><h2>自分のパスワード（ID：${esc(me.login_id)}）</h2>
    <div class="grid2"><label>新しいパスワード（8文字以上）<input id="myPw1" type="password" autocomplete="new-password"></label><label>もう一度<input id="myPw2" type="password" autocomplete="new-password"></label><div><button class="primary" id="mySave" style="width:100%">変える</button></div></div>
    <div class="muted" style="font-size:14px;margin-top:8px">変えると、ほかの端末でこのIDでログインしている分はログアウトされます</div></div>`;
  $('main').innerHTML=`<h1>パスワード <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>${own}<div class="card muted">読み込み中…</div>`; bindOwn();
  const r=await sb.rpc('admin_credentials',{p_store:storeId}); if(page!=='pw') return;
  if(r.error){ $('main').lastElementChild.outerHTML=`<div class="card err">${esc(r.error.message)}</div>`; return; }
  const d=r.data||{};
  const pwCell=pw=>pw?`<span class="pwv" data-pwv="${esc(pw)}">••••••••</span> <button class="ghost sm" data-show>見る</button>`:'<small class="muted">管理サイトで変えると、ここに出ます</small>';
  const O=true; // v0.04：オーナー以外も自分の店舗のパスワードを変えられる（SQL 047）
  const row=(label,sub,key,pw)=>`<tr><td>${label}${sub?`<br><small class="muted">${sub}</small>`:''}</td><td>${pwCell(pw)}</td><td style="text-align:right">${O?`<button class="ghost sm" data-pw="${esc(key)}" data-label="${esc(label.replace(/<[^>]*>/g,''))}">変える</button>`:''}</td></tr>`;
  $('main').lastElementChild.outerHTML=(O?`
  <div class="card"><h2>全部まとめて新しくする</h2><div class="muted" style="font-size:14px;margin-bottom:10px">POS・タイムカードの端末と顧客サイトのパスワードを、自動で作った新しいものに一度に変えます。黒服が辞めた時に使ってください</div><button class="danger" id="rotAll">全部のパスワードを新しくする</button></div>`:'')+`
  <div class="card"><h2>今のパスワード</h2><div class="muted" style="font-size:14px;margin-bottom:6px">「変える」で、好きなパスワードを入れて変えられます（自動で作ることもできます）</div><table class="t">
    <tr><th>どこの</th><th>パスワード</th><th></th></tr>
    ${(d.devices||[]).map(x=>row(`POS・タイムカード：${esc(x.label||'端末')}`,`ログイン用メール ${esc(x.email||'')}`,`dev:${x.user_id}`,x.pw)).join('')||'<tr><td class="muted" colspan="3">POS・タイムカードの端末がありません</td></tr>'}
    ${(d.cs||[]).map(x=>row(esc(CS_KIND[x.kind]||x.kind),'',`cs:${x.kind}`,x.pw)).join('')}
    ${(d.accounts||[]).map(x=>row(`管理サイト：${esc(x.login_id)}`,esc(x.name)+(x.is_owner&&x.name!=='オーナー'?'（オーナー）':'')+(x.is_active?'':'（止めている）'),x.login_id===me.login_id?'own:':`acc:${x.id}`,x.pw)).join('')}
  </table></div>`;
  $('main').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const v=b.previousElementSibling; const on=b.textContent==='見る'; v.textContent=on?v.dataset.pwv:'••••••••'; b.textContent=on?'隠す':'見る'; });
  if(O) $('rotAll').onclick=guard($('rotAll'),()=>rotateAll());
  $('main').querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{ if(b.dataset.pw==='own:'){ $('myPw1').focus(); window.scrollTo(0,0); return; } changeOne(b.dataset.pw,b.dataset.label); });
};
function bindOwn(){ $('mySave').onclick=guard($('mySave'),async()=>{
  const a=$('myPw1').value, b=$('myPw2').value;
  if(a.length<8){ await uiAlert('パスワードは8文字以上にしてください'); return; }
  if(a!==b){ await uiAlert('2つのパスワードが違います'); return; }
  const r=await rpc('admin_set_own_pw',{p_pw:a}); if(!r.ok) return;
  $('myPw1').value=''; $('myPw2').value=''; toast('パスワードを変えました'); if(page==='pw') PAGES.pw(); }); }
async function changeOne(key,label){
  const [kind,id]=[key.slice(0,key.indexOf(':')),key.slice(key.indexOf(':')+1)];
  const m=modal(`<h2 style="margin:0">パスワードを変える</h2><div>${esc(label)}</div>
    <label>新しいパスワード（8文字以上）<input data-k="pw" autocapitalize="off" spellcheck="false"></label>
    <div class="muted" style="font-size:14px">${kind==='acc'?'このIDでログインしている分はログアウトされます':'この端末・サイトでログインしている分は全部ログアウトされます'}</div>
    <div class="bar"><button class="ghost" data-k="gen">自動で作る</button><button class="ghost" data-k="no">キャンセル</button><button class="primary" data-k="ok">変える</button></div>`);
  const q=k=>m.querySelector(`[data-k=${k}]`);
  q('gen').onclick=()=>{ q('pw').value=genPw(10); };
  q('no').onclick=()=>m.remove();
  q('ok').onclick=guard(q('ok'),async()=>{ const pw=q('pw').value;
    if(pw.length<8){ await uiAlert('パスワードは8文字以上にしてください'); return; }
    const r= kind==='dev'?await rpc('admin_set_device_pw',{p_user:id,p_pw:pw})
           : kind==='cs'?await rpc('admin_set_cs_pw',{p_store:storeId,p_kind:id,p_pw:pw})
           : await rpc('admin_set_account_pw',{p_id:id,p_pw:pw});
    if(!r.ok) return; m.remove(); toast('変えました'); PAGES.pw(); });
}

start();
</script>
</body>
