<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OLIVE 管理</title><!-- admin v0.28 -->
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--acc:#3f9d5a;--warn:#d9534f;--gold:#e0a32a;--blue:#3b82f6;--h:44px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:0 16px;height:var(--h);background:#eee;color:var(--ink);white-space:nowrap}
  button.primary{background:var(--blue);color:#fff}button.ok{background:var(--acc);color:#fff}button.danger{background:var(--warn);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line)}button.sm{height:34px;padding:0 10px;font-size:14px}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,select{font:inherit;font-size:16px;height:var(--h);padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;min-width:0}
  label{display:block;font-size:13px;color:var(--muted)}label>input,label>select{margin-top:4px;color:var(--ink)}
  .muted{color:var(--muted)}small{font-size:13px}.hide{display:none!important}
  .err{color:var(--warn);font-size:14px;min-height:20px;margin-top:8px}

  /* ログイン */
  #vLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  #vLogin .box{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px}
  #vLogin h1{margin:0;font-size:22px}

  /* 画面の枠 */
  #vApp{min-height:100vh;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:20;background:#3a3a3a;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top))}
  .top .ttl{font-weight:700;font-size:17px;white-space:nowrap}
  .top select{width:auto;max-width:220px;height:36px;background:#fff}
  .top .who{margin-left:auto;font-size:13px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .top button{height:36px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:14px;padding:0 12px}
  #menuBtn{display:none}
  .alertbar{background:#fde8e8;color:#9b1c1c;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .alertbar button{height:36px;font-size:14px}
  .body{flex:1;display:flex;min-height:0}
  nav{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 0;overflow:auto}
  nav .grp{font-size:12px;color:var(--muted);padding:12px 18px 4px}
  nav a{display:flex;align-items:center;gap:6px;padding:9px 18px;color:var(--ink);text-decoration:none;font-size:15px;cursor:pointer}
  nav a:hover{background:#f3f2ee}nav a.on{background:var(--ink);color:#fff}
  nav a .tag{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;flex:none}nav a.on .tag{color:#ccc}
  main{flex:1;min-width:0;padding:18px 22px 60px;overflow:auto}
  main h1{font-size:22px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 10px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:end}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;vertical-align:middle}
  table.t th{font-size:13px;color:var(--muted);font-weight:400}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border-radius:0;background:#fff;height:36px;font-size:14px;padding:0 12px;border-right:1px solid var(--line)}.seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:#fff}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--gold);color:#fff}.badge.gray{background:#999}.badge.k{background:var(--acc)}.badge.warnb{background:var(--warn)}
  .num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
  .alert{background:#fde8e8;color:#9b1c1c;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:700}
  table.reg{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}table.reg td,table.reg th{padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
  table.reg th{color:var(--muted);font-weight:400}table.reg tr[data-rd]{cursor:pointer}table.reg tr[data-rd]:hover{background:#f3f2ee}
  table.sl{border-collapse:collapse;font-variant-numeric:tabular-nums}table.sl th{font-size:12px;color:var(--muted);font-weight:400;padding:4px 4px;text-align:right;white-space:nowrap}
  table.sl td{padding:3px 4px}table.sl input{width:88px;text-align:right;height:38px}table.sl td.x{width:40px}
  table.fn{border-collapse:collapse}table.fn th{font-size:12px;color:var(--muted);font-weight:400;padding:4px 4px;text-align:left;white-space:nowrap}
  table.fn td{padding:3px 4px;white-space:nowrap}table.fn input,table.fn select{height:38px}table.fn input[data-f=name]{width:260px}table.fn select{width:auto}table.fn input[data-f=hv],table.fn input[data-f=dv]{width:80px;text-align:right}table.fn th.gh{text-align:center;color:var(--ink);font-weight:700;border-bottom:1px solid var(--line)}table.fn .sep{width:10px;border-left:1px solid var(--line)}table.fn .u{display:inline-block;width:1.4em;color:var(--muted);font-size:13px}
  table.fn label.pu{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink);height:38px}table.fn label.pu input{width:auto;height:auto;margin:0}table.fn td.x{width:40px}
  .slw{overflow-x:auto}.slgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
  .kv2{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
  .pwbox{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.05em}
  .pwv{font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .box{background:#fff;border-radius:16px;padding:18px;width:min(520px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .modal .bar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}#toast.on{opacity:1}
  /* v0.15 キャスト設定 */
  .cs-w{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.cs-w.editing{border-color:var(--blue)}
  table.cs{width:max-content;min-width:100%}table.cs td,table.cs th{padding:7px 8px}table.cs th.nm,table.cs td.nm{position:sticky;left:0;background:#fff;text-align:left;z-index:1;border-right:1px solid var(--line)}
  table.cs td.nm a{color:var(--blue);font-weight:700;cursor:pointer}
  table.cs input,table.cs select{height:34px;font-size:13px;padding:0 6px;width:auto}table.cs input{text-align:right}table.cs button.sm{height:34px}
  .cs-gu{display:inline-flex;align-items:center;gap:6px}.cs-gu input[type=date]{width:140px;text-align:left}.cs-gu label{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--ink)}.cs-gu input[type=checkbox]{width:auto;height:auto}
  .cs-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.cs-tabs button{background:none;border-radius:0;border-bottom:3px solid transparent;color:var(--muted);height:42px}.cs-tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
  table.rgden input,#rgDepIn,#rgOpenIn{height:38px;font-size:15px}
  .ck{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);min-height:var(--h)}.ck input{width:auto;height:auto;margin:0}
  table.pc th,table.pc td{vertical-align:top;text-align:left}.pc-c{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:15px}.pc-c img{width:72px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;background:#eee}
  .tccode{font-size:44px;font-weight:700;letter-spacing:.2em;text-align:center;font-variant-numeric:tabular-nums;padding:8px 0}
  table.vip input{width:110px;text-align:right}
  .sif{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.sit{display:flex;align-items:center;gap:6px;margin-top:4px}.sit input{flex:1}
  [data-st] .seg button{height:var(--h)}[data-st] .stb{display:inline-flex;align-items:center;height:var(--h);padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#f6f5f2;white-space:nowrap}
  .cs-li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.cs-li:last-child{border-bottom:none}
  @media (max-width:820px){
    #menuBtn{display:inline-block}
    nav{position:fixed;top:52px;bottom:0;left:0;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}
    nav.open{transform:none}
    main{padding:14px 16px 60px}
    .top .who{display:none}
    table.perm tr.pr{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
    table.perm tr.pr td{border:none;padding:0 6px;text-align:left!important}
    table.perm .seg{display:flex}table.perm .seg button{flex:1}
  }
  /* 15番：長い説明は1行＋「？」で詳しく（押すとその場で下に開く）。入力欄の高さは全部 44px */
  .hint .qm{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px!important;min-height:0!important;min-width:0;padding:0!important;margin:0 0 0 6px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--muted);font-size:12px;line-height:1;vertical-align:middle;cursor:pointer}
  .hint .more{display:none;margin-top:4px}.hint.open .more{display:block}.hint.open .qm{background:var(--line)}
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]),select{height:44px!important;min-height:44px;box-sizing:border-box;padding-top:0!important;padding-bottom:0!important}
  table.cs button.sm,table.fn button,.row button.sm{height:44px} /* 入力欄の横のボタンも 44px */
  table.ks td,table.ks th{text-align:right;white-space:nowrap}table.ks th.nm,table.ks td.nm{text-align:left}table.ks th.ksg{text-align:center;color:var(--ink);font-weight:700;border-left:1px solid var(--line)}table.ks tr.kst td{border-top:2px solid var(--line);font-weight:700}
</style>

<body>
<div id="vLogin" class="hide"><form class="box" id="loginForm" autocomplete="on">
  <h1>OLIVE 管理</h1>
  <input id="lid" placeholder="ID" autocomplete="username" autocapitalize="off" spellcheck="false">
  <input id="lpw" type="password" placeholder="パスワード" autocomplete="current-password">
  <button class="primary" type="submit">ログイン</button>
  <div class="err" id="loginErr"></div>
</form></div>

<div id="vApp" class="hide">
  <div class="top">
    <button id="menuBtn">☰</button>
    <span class="ttl">OLIVE 管理</span>
    <select id="storeSel"></select><span id="storeName" style="font-weight:700"></span>
    <span class="who" id="who"></span>
    <button id="logoutBtn">ログアウト</button>
  </div>
  <div id="alertBar"></div>
  <div class="body">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script>
document.addEventListener('click',e=>{ const q=e.target.closest&&e.target.closest('.hint .qm'); if(q){ e.preventDefault(); e.stopPropagation(); q.closest('.hint').classList.toggle('open'); } },true); /* 15番：「？」で詳しい説明を開く・閉じる */
const SUPABASE_URL='https://gjqaxenwvvazhjtziusf.supabase.co', SUPABASE_KEY='sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
// POS・タイムカードと同じサイト上にあるので、ログイン情報は別の場所にしまう（POSのログインを横取りしない）
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'olive-admin-auth'}});
const EMAIL_DOMAIN='@admin.olive.local';
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2000); }
function guard(btn,fn){ return async(...a)=>{ if(btn.disabled) return; btn.disabled=true; try{ await fn(...a); } finally{ btn.disabled=false; } }; }
function modal(html){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box">${html}</div>`; document.body.appendChild(m); return m; }
function uiAlert(msg){ return new Promise(res=>{ const m=modal(`<div style="white-space:pre-wrap">${esc(msg)}</div><div class="bar"><button class="primary" data-k="ok">OK</button></div>`); m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(); }; }); }
function uiConfirm(msg,okLabel='OK',cls='primary'){ return new Promise(res=>{ const m=modal(`<div style="white-space:pre-wrap">${esc(msg)}</div><div class="bar"><button class="ghost" data-k="no">キャンセル</button><button class="${cls}" data-k="ok">${esc(okLabel)}</button></div>`); m.querySelector('[data-k=no]').onclick=()=>{ m.remove(); res(false); }; m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(true); }; }); }
async function rpc(fn,args){ rtOwn=Date.now(); const r=await sb.rpc(fn,args||{}); rtOwn=Date.now(); if(r.error){ await uiAlert(r.error.message); return {ok:false}; } return {ok:true,data:r.data}; }
function genPw(n=10){ const c='abcdefghjkmnpqrstuvwxyz23456789'; const a=crypto.getRandomValues(new Uint8Array(n)); return [...a].map(x=>c[x%c.length]).join(''); }
const fmtDT=t=>t?new Date(t).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';

// ---------- 画面の一覧（オーナー以外に見せるかは店舗ごとに設定） ----------
const SCREENS=[
  {grp:'集計'},
  {k:'summary',n:'まとめ'},
  {k:'pl',n:'収支'},
  {k:'cast_sales',n:'キャスト'},
  {k:'register',n:'現金管理'},
  {k:'invoice',n:'請求書の未入金'},
  {k:'nippo',n:'日報登録'},
  {k:'punches',n:'打刻一覧'},
  {k:'cust',n:'お客様分析'},
  {grp:'設定'},
  {k:'set_cast',n:'スタッフ設定'},
  {k:'set_pay',n:'給与項目'},
  {k:'set_cash',n:'入出金項目'},
  {k:'set_names',n:'名称変更'},
  {k:'set_pos',n:'POS設定'},
  {grp:'履歴'},
  {k:'hist_memo',n:'メモ一覧'},
  {k:'hist_cash',n:'入出金履歴'},
  {k:'hist_print',n:'印刷履歴'},
  {k:'hist_del',n:'削除履歴'},
];
// v0.21：パスワードはオーナーだけ（「アカウント」の見出しをやめて、オーナーの下へ）
const OWNER_SCREENS=[{grp:'オーナー'},{k:'o_perms',n:'表示設定'},{k:'o_share',n:'顧客情報の共有'},{k:'o_ids',n:'管理サイトのID'},{k:'pw',n:'パスワード'}];
const PERM_LABEL={none:'見られない',view:'見るだけ',edit:'変えられる'};

let me=null, storeId=null, page=null;
const stores=()=>me?.stores||[];
const curStore=()=>stores().find(s=>s.id===storeId);
const stSet=()=>me?.settings?.[storeId]||{perms:{},nippo_days:3};
// v0.05：収支は月次・日次を1つの画面にまとめた（前の設定 pl_day／pl_month も読む）
function perm(k){ if(me?.is_owner) return 'edit'; const p=stSet().perms||{}; if(k==='pl') return p.pl||p.pl_day||p.pl_month||'none'; if(k==='register') return p.register||p.register_month||'none'; /* v0.07：レジ精算も月次・日次を1つの画面に */ return p[k]||'none'; }

// ---------- ログイン ----------
$('loginForm').onsubmit=async e=>{ e.preventDefault(); $('loginErr').textContent='';
  const id=$('lid').value.trim().toLowerCase(), pw=$('lpw').value;
  if(!id||!pw){ $('loginErr').textContent='IDとパスワードを入れてください'; return; }
  const btn=e.submitter; if(btn) btn.disabled=true;
  try{ const { error }=await sb.auth.signInWithPassword({email:id+EMAIL_DOMAIN,password:pw});
    if(error){ $('loginErr').textContent='IDかパスワードが違います'; return; }
    $('lpw').value=''; await start(); } finally{ if(btn) btn.disabled=false; } };
$('logoutBtn').onclick=async()=>{ if(!await uiConfirm('ログアウトしますか？')) return; await sb.auth.signOut(); location.reload(); };
$('menuBtn').onclick=()=>$('nav').classList.toggle('open');
function showLogin(msg){ $('vApp').classList.add('hide'); $('vLogin').classList.remove('hide'); $('loginErr').textContent=msg||''; }

async function loadMe(){ const r=await sb.rpc('admin_me'); if(r.error||!r.data) return null; return r.data; }
async function start(){
  const { data:{ session } }=await sb.auth.getSession(); if(!session){ showLogin(); return; }
  me=await loadMe();
  if(!me){ await sb.auth.signOut(); showLogin('このIDでは管理サイトに入れません（止められたか、パスワードが変わりました）'); return; }
  const saved=(()=>{ try{ return localStorage.getItem('olive_admin_store'); }catch(e){ return null; } })();
  storeId=me.is_owner ? (stores().some(s=>s.id===saved)?saved:stores()[0]?.id) : me.store_id;
  $('vLogin').classList.add('hide'); $('vApp').classList.remove('hide');
  $('who').textContent=`${me.name||me.login_id}（ID：${me.login_id}）`;
  renderStoreSel(); renderAll();
  clearInterval(start.t); start.t=setInterval(refreshMe,60000);
}
// 1分ごとに読み直す（止められた・パスワードが変わった時はログアウト。警告も最新にする）
async function refreshMe(){ const m=await loadMe(); if(!m){ await sb.auth.signOut(); showLogin('ログインが切れました。もう一度ログインしてください'); return; } me=m; renderAlert(); }
function renderStoreSel(){
  if(me.is_owner){ $('storeSel').classList.remove('hide'); $('storeName').classList.add('hide');
    $('storeSel').innerHTML=stores().map(s=>`<option value="${s.id}" ${s.id===storeId?'selected':''}>${esc(s.name)}</option>`).join('');
    $('storeSel').onchange=()=>{ storeId=$('storeSel').value; try{ localStorage.setItem('olive_admin_store',storeId); }catch(e){} renderAll(); };
  } else { $('storeSel').classList.add('hide'); $('storeName').classList.remove('hide'); $('storeName').textContent=curStore()?.name||''; }
}
function renderAll(){ renderAlert(); renderNav(); const ok=page&&visible(page); go(ok?page:firstPage()); rtSub(); }
function visible(k){ if(OWNER_SCREENS.some(s=>s.k===k)) return me.is_owner; return perm(k)!=='none'; }
function firstPage(){ return SCREENS.find(s=>s.k&&visible(s.k))?.k||(me.is_owner?'pw':'none'); }

// ---------- リアルタイム v0.26・SQL 067：この店の設定・伝票がほかで変わったら、今の画面を読み直す ----------
// 入力の途中・確認の画面が出ている時は読み直さず、上に「最新にする」を出す。自分で保存した直後（5秒）は読み直さない。つながらない時も、これまでどおり使える
let rtCh=null, rtSt=null, rtT=0, rtOwn=0, mainDirty=false, rtWait=false;
const RT_SKIP=new Set(['o_perms','o_share','o_ids','pw','none']);
function rtSub(){ if(rtCh&&rtSt===storeId) return; if(rtCh){ sb.removeChannel(rtCh); rtCh=null; } rtSt=storeId; if(!storeId) return;
  try{ rtCh=sb.channel('olive:'+storeId).on('broadcast',{event:'chg'},m=>rtKick(m.payload)).subscribe(); }catch(e){ console.warn('realtime',e); } }
function rtKick(p){ if(!page||RT_SKIP.has(page)) return; clearTimeout(rtT); rtT=setTimeout(rtRefresh,p?.kind==='bill'?4000:1200); }
function rtBar(on){ let b=$('rtBar'); if(!on){ if(b) b.remove(); return; } if(b) return; b=document.createElement('div'); b.id='rtBar'; b.className='alertbar'; b.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:#fff;color:#222;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.2)';

async function regMoves(fromEx,toEx){
  const [mv,adv,pay]=await Promise.all([
    sb.from('cash_movements').select('business_date,kind,amount').eq('store_id',storeId).gt('business_date',fromEx).lt('business_date',toEx),
    sb.from('daily_advances').select('business_date,amount').eq('store_id',storeId).gt('business_date',fromEx).lt('business_date',toEx),
    sb.from('payments').select('amount,paid_at,bills!inner(status,store_id)').eq('method','cash').eq('bills.store_id',storeId).gte('paid_at',bdStart(fromEx)).lt('paid_at',bdStart(toEx)) ]);
  const er=mv.error||adv.error||pay.error; if(er) return {error:er};
  const sum={}; const add=(dd,k,v)=>{ if(dd<=fromEx||dd>=toEx) return; (sum[dd]=sum[dd]||{sales:0,cin:0,cout:0})[k]+=Number(v)||0; };
  (mv.data||[]).forEach(x=>add(x.business_date,x.kind==='in'?'cin':'cout',x.amount)); (adv.data||[]).filter(x=>x.amount>0).forEach(x=>add(x.business_date,'cout',x.amount));
  (pay.data||[]).filter(p=>p.bills&&p.bills.status!=='void'&&p.amount).forEach(p=>add(businessDate(new Date(p.paid_at)),'sales',p.amount));
  return {sum}; }

const SLIDE_DEF={

const slNum=v=>{ const t=String(v??'').replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，\s]/g,''); return t===''?null:Number(t); };
const slShow=(v,sc)=>v==null?'':String(Math.round(Number(v)/(sc||1)*10000)/10000);
function slideCard(kind,rows,ed,note){ const d=SLIDE_DEF[kind];

function slideRead(card,kind){ const d=SLIDE_DEF[kind]; const out=[];
  for(const tr of card.querySelectorAll('tr[data-i]')){ const r={}; let empty=true;
    for(const c of d.cols){ const v=slNum(tr.querySelector(`[data-c="${c.k}"]`).value); if(v!=null) empty=false; if(v!=null&&!Number.isFinite(v)) return {err:`「${c.l}」に数字でないものがあります`}; r[c.k]=v==null?null:Math.round(v*(c.sc||1)*10000)/10000; }
    if(empty) continue; if(r[d.cols[0].k]==null||r[d.cols[1].k]==null) return {err:`「${d.cols[0].l}」と「${d.cols[1].l}」は必ず入れてください`}; out.push(r); }
  const k0=d.cols[0].k; out.sort((a,b)=>a[k0]-b[k0]); for(let i=1;i<out.length;i++) if(out[i][k0]===out[i-1][k0]) return {err:`「${d.cols[0].l}」が同じ行が2つあります`};

  { const fc=$('main').querySelector('[data-fines]'); if(fc){ fc.querySelector('[data-fadd]').onclick=()=>{ const tb=fc.querySelector('table.fn'); fc.querySelector('[data-fempty]')?.remove(); tb.insertAdjacentHTML('beforeend',fineRowHtml({},true)); const last=[...tb.querySelectorAll('tr[data-fr]')].pop(); fineRowWire(last,true); last.querySelector('[data-f=name]').focus(); };
    const hs=$('dHoursSave'); if(hs) hs.onclick=guard(hs,async()=>{ const h=slNum($('dHours').value); if(h==null||!(h>0&&h<=24)){ await uiAlert('所定時間は0より大きく24以下の数にしてください'); return; } if(!await uiConfirm(`日給の人の所定時間を ${h}時間 にしますか？\n時間給 ＝ 日給 ÷ ${h}時間 になります`)) return; const r=await rpc('admin_set_daily_hours',{p_store:st,p_hours:h}); if(!r.ok) return; toast('保存しました'); PAGES.set_pay(); });
    const sv=fc.querySelector('[data-fsave]'); sv.onclick=guard(sv,async()=>{ const g=fineRead(fc); if(g.err){ await uiAlert(g.err); return; } if(!await uiConfirm(`罰金の種類を保存しますか？（${g.n}種類）\nPOS の「＋罰金」の一覧も変わります。今までに登録した罰金は変わりません`)) return;
      const r=await rpc('admin_save_fine_types',{p_store:st,p_rows:g.rows}); if(!r.ok) return; toast('保存しました'); PAGES.set_pay(); }); } }
  stWire(st);
  $('main').querySelectorAll('[data-sl]').forEach(card=>{ const kind=card.dataset.sl, d=SLIDE_DEF[kind];
    card.querySelector('[data-add]').onclick=()=>{ const tb=card.querySelector('table.sl'); const ph=tb.querySelector('td[colspan]'); if(ph) ph.parentElement.remove(); const i=tb.querySelectorAll('tr[data-i]').length+Date.now(); const tr=document.createElement('tr'); tr.dataset.i=i; tr.innerHTML=d.cols.map(c=>`<td><input inputmode="decimal" data-c="${c.k}"></td>`).join('')+`<td class="x"><button class="ghost sm" aria-label="行を消す">✕</button></td>`; tr.querySelector('button').onclick=()=>tr.remove(); tb.appendChild(tr); tr.querySelector('input').focus(); };
    card.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>x.closest('tr').remove());
    const sv=card.querySelector('[data-save]'); sv.onclick=guard(sv,async()=>{ const g=slideRead(card,kind); if(g.err){ await uiAlert(g.err); return; }
      if(!await uiConfirm(`${d.t}を保存しますか？（${g.rows.length}行）`)) return;
      const r=kind==='hall'?await rpc('admin_save_hall_bonus',{p_store:st,p_rows:g.rows}):await rpc('admin_save_pay_slides',{p_store:st,p_kind:kind,p_rows:g.rows}); if(!r.ok) return;
      toast('保存しました'); PAGES.set_pay(); }); });
};

// v0.11・SQL 052：罰金の種類（店舗ごと）。POS の在籍リスト「＋罰金」で選ぶ。金額が決まっているものはそのまま登録、時給の％は月末の時給で計算、日給の％はその人の日給で計算
// v0.17：罰金1つを1行にして、時給の人・日給の人の決め方を横に並べる（表は今と同じ fine_types。時給と日給が同じ「円」か「その都度」なら target='all' の1行＝黒服にもかかる。違えば hourly・daily の2行）
const FINE_H=[['','なし'],['hourly_pct','％'],['yen','円'],['input','その都度']], FINE_D=[['','なし'],['daily_pct','％'],['yen','円'],['input','その都度'],['daily_late','遅刻（時間分）'],['daily_early','早上がり（時間分）']];
const FINE_TIME=c=>c==='daily_late'||c==='daily_early';
// fine_types の行 → 名前ごとに {name, h:{calc,value,per_unit}, d:{…}}
function fineGroup(rows){ const g=new Map();
  for(const r of rows){ const k=r.name; if(!g.has(k)) g.set(k,{name:k,h:null,d:null}); const x=g.get(k), c={calc:r.calc,value:r.value,per_unit:r.per_unit};
    if(r.target==='hourly') x.h=c; else if(r.target==='daily') x.d=c;
    else if(r.calc==='hourly_pct') x.h=x.h||c; else if(r.calc==='daily_pct'||FINE_TIME(r.calc)) x.d=x.d||c; else { x.h=x.h||c; x.d=x.d||c; } }
  return [...g.values()]; }
function fineSide(k,c,ed){ const dis=ed?'':'disabled', os=k==='h'?FINE_H:FINE_D, cl=c?.calc||'';
  return `<td><select data-f="${k}c" ${dis}>${os.map(([v,n])=>`<option value="${v}" ${cl===v?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input data-f="${k}v" inputmode="numeric" value="${c?.value??''}" ${dis}><span class="u" data-f="${k}u"></span></td><td><label class="pu"><input type="checkbox" data-f="${k}p" ${c?.per_unit?'checked':''} ${dis}>個数</label></td>`; }
function fineRowHtml(r,ed){ return `<tr data-fr><td><input data-f="name" value="${esc(r.name||'')}" ${ed?'':'disabled'}></td>${fineSide('h',r.h,ed)}<td class="sep"></td>${fineSide('d',r.d,ed)}${ed?'<td class="x"><button class="ghost sm" data-fdel aria-label="行を消す">✕</button></td>':''}</tr>`; }
function fineRowWire(tr,ed){ for(const k of ['h','d']){ const q=f=>tr.querySelector(`[data-f=${k}${f}]`), cl=q('c'), v=q('v'), pu=q('p'), u=q('u');
    const upd=()=>{ const c=cl.value; u.textContent=c==='yen'?'円':(c===''||c==='input')?'':'%'; v.disabled=!ed||c===''||c==='input'; if(c===''||c==='input') v.value=''; v.placeholder=FINE_TIME(c)?'足す％':''; pu.disabled=!ed||c!=='yen'; if(c!=='yen') pu.checked=false; }; cl.onchange=upd; upd(); }
  const d=tr.querySelector('[data-fdel]'); if(d) d.onclick=()=>tr.remove(); }
function fineCard(rows,ed,hours){ const gs=fineGroup(rows); return `<div class="card" data-fines><h2>罰金の種類<br><small class="muted" style="font-weight:400">POS の在籍リストの「＋罰金」で選びます</small></h2>
  <div class="muted hint" style="font-size:13px;margin-bottom:8px;line-height:1.6">時給の人・日給の人のそれぞれで決め方を選びます（かからない方は「なし」）<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">％：時給は月末に決まった時給の％、日給はその人の日給の％<br>円：選ぶとその金額で登録します（「個数」にすると 金額×個数）<br>その都度：選んだ時に金額を入れます<br>遅刻・早上がり（時間分）：決まった時刻と打刻（15分丸め）の差 × 時間給（日給 ÷ 下の所定時間）。「足す％」を入れると日給のその％を足します（無断の時など）<br>時給と日給が同じ「円」か「その都度」の罰金は、黒服にもかかります<br>一覧にないものは、POS で「その他」を選んで理由と金額を入れられます</div></div>
  <div class="row" style="margin-bottom:10px;font-size:14px">日給の人の所定時間<input id="dHours" inputmode="decimal" value="${hours??''}" ${ed&&hours!=null?'':'disabled'} style="width:80px;text-align:right">時間${ed&&hours!=null?'<button class="ghost sm" id="dHoursSave">保存</button>':''}${hours==null?'<span class="muted" style="font-size:13px">SQL 053 が未実行です</span>':''}</div>
  <div class="slw"><table class="fn"><tr><th rowspan="2" style="vertical-align:bottom">名前</th><th colspan="3" class="gh">時給</th><th class="sep"></th><th colspan="3" class="gh">日給</th>${ed?'<th></th>':''}</tr>
  <tr><th>決め方</th><th>金額・％</th><th></th><th class="sep"></th><th>決め方</th><th>金額・％</th><th></th>${ed?'<th></th>':''}</tr>${gs.map(r=>fineRowHtml(r,ed)).join('')}</table>${gs.length?'':'<div class="muted" data-fempty style="padding:8px 4px">まだ入っていません</div>'}</div>
  ${ed?'<div class="row" style="margin-top:10px"><button class="ghost sm" data-fadd>＋ 行を足す</button><button class="primary sm" data-fsave>保存</button></div>':''}</div>`; }
function fineRead(card){ const out=[]; let i=0, n=0; const names=new Set();
  for(const tr of card.querySelectorAll('tr[data-fr]')){ i++; const g=k=>tr.querySelector(`[data-f=${k}]`); const name=g('name').value.trim();
    const side=k=>{ const calc=g(k+'c').value; if(!calc) return {}; const vs=g(k+'v').value; let value=null, lb=k==='h'?'時給':'日給';
      if(FINE_TIME(calc)){ value=slNum(vs); if(value!=null&&(!Number.isInteger(value)||value<=0)) return {err:`${i}行目（${name}・${lb}）：足す％は1以上の整数にするか、空けてください`}; }
      else if(calc!=='input'){ value=slNum(vs); if(value==null||!Number.isInteger(value)||value<=0) return {err:`${i}行目（${name}・${lb}）：${calc==='yen'?'金額':'％'}を1以上の整数で入れてください`}; }
      return {c:{calc,value,per_unit:calc==='yen'&&g(k+'p').checked}}; };
    const h=side('h'), d=side('d'); if(!name&&!h.c&&!d.c) continue; if(!name) return {err:`${i}行目：名前を入れてください`};
    if(h.err) return {err:h.err}; if(d.err) return {err:d.err}; if(!h.c&&!d.c) return {err:`${i}行目（${name}）：時給か日給のどちらかの決め方を選んでください`};
    if(names.has(name)) return {err:`同じ名前の行が2つあります：${name}`}; names.add(name); n++;
    const same=h.c&&d.c&&h.c.calc===d.c.calc&&(h.c.calc==='yen'||h.c.calc==='input')&&h.c.value===d.c.value&&h.c.per_unit===d.c.per_unit;
    if(same) out.push({name,target:'all',...h.c}); else { if(h.c) out.push({name,target:'hourly',...h.c}); if(d.c) out.push({name,target:'daily',...d.c}); } }
  return {rows:out,n}; }

// v0.14・SQL 055：アフターの延長（attendance_rules。タイムカードの打刻の時に round_punch が使う）。閉店の○分前を過ぎたアフターは、閉店まで働いたことにする。閉店時間は店舗設定で決める
const closeTxt=c=>{ const m=String(c||'01:00').match(/^(\d{1,2}):(\d{2})/); return m?`${+m[1]<12?'翌':''}${+m[1]}:${m[2]}`:String(c); };
function afterCard(ax,ed){ const h='<h2>アフターの延長<br><small class="muted" style="font-weight:400">アフターの打刻（退勤の代わり）で、時給を付ける時間を延ばします</small></h2>';
  if(ax.error) return `<div class="card">${h}<div class="err">${esc(/after_ext|minutes|close/.test(ax.error.message)||/find|exist|schema cache/.test(ax.error.message)?'SQL 055 が未実行です：':'読み込めません：')}${esc(ax.error.message)}</div></div>`;
  const a=ax.data||{}; if(a.minutes==null) return `<div class="card">${h}<div class="err">SQL 055 が未実行です</div></div>`;
  const on=!!a.on, dis=ed?'':'disabled', cl=closeTxt(a.close);
  return `<div class="card" data-after>${h}<div class="row"><span class="seg" id="afOn">${[[true,'する'],[false,'しない']].map(([v,n])=>`<button data-v="${v}" class="${on===v?'on':''}" ${dis}>${n}</button>`).join('')}</span></div>
    <div class="row" style="margin-top:10px;font-size:14px">閉店（${esc(cl)}）の<input id="afM" inputmode="numeric" value="${esc(String(a.minutes))}" ${dis} style="width:80px;text-align:right">分前を過ぎたアフターは、閉店（${esc(cl)}）まで働いたことにする${ed?'<button class="primary sm" id="afSave">保存</button>':''}</div>
    <div class="muted hint" style="font-size:13px;margin-top:8px;line-height:1.6">時給の人・日給の人の両方。タイムカードで打刻した時に決まります<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">（変えても、前の打刻はそのまま）<br>閉店時間は「POS設定」で変えます。退勤・アフターの打刻は閉店より後になりません</div></div></div>`; }

// ---------- キャスト設定 v0.15・SQL 056：一人ずつの給与条件（月ごと。その月以降／その月のみ）・その人だけの条件・メモ ----------
// 担当・給与（時給／日給）・日給・日払い・契約書は staff に入れる（月で変わらない。POS と同じ欄）
// 保証時給・期限・同伴ノルマ・バック・源泉徴収・消費税・厚生費・罰金の免除は cast_terms に月ごとに入れる（その月の行があればそれ、なければ前の月の「以降」の行）
const CS_PUNCH='打刻の手入力'; // v0.24・SQL 064：POS で打刻を手で入れた時に自動で付く罰金
const CS_FOREVER='9999-12-31', CS_CATS=['性格','体調','お客様','勤怠','良かったこと','その他'];
const CS_SP={pay:'特別な支給',deduct:'特別な控除',text:'文字だけ'};
let csMonth=null, csEdit=false, csDetail=null, csTab='sp', csKind='cast';
// v0.24：キャスト設定 → スタッフ設定（キャスト・黒服のタブ）
const csKindTabs=()=>`<div class="cs-tabs">${[['cast','キャスト'],['hall','黒服']].map(([k,n])=>`<button data-kind="${k}" class="${csKind===k?'on':''}" ${csEdit?'disabled':''}>${n}</button>`).join('')}</div>`;
const csKindWire=()=>$('main').querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ if(csEdit) return; csKind=b.dataset.kind; PAGES.set_cast(); });
// v0.23：「今月」は営業日（朝8時で日付が変わる）の月
const csNowMonth=()=>businessDate().slice(0,7)+'-01';
const csAddMonth=(m,n)=>{ const [y,mo]=m.split('-').map(Number); const d=new Date(Date.UTC(y,mo-1+n,1)); return d.toISOString().slice(0,7)+'-01'; };
const csMLabel=m=>{ const [y,mo]=m.split('-').map(Number); return `${y}年${mo}月`; };
const csMShort=m=>`${Number(m.split('-')[1])}月`;
const csList=st=>sb.from('staff').select('*').eq('store_id',st).eq('is_active',true).order('sort_order').order('id');
// v0.23・SQL 063：給与形態（時給・日給）と日給も月ごと。前の行（pay_type が空）は staff の値を使う
function csTerms(s,rows,m){ const t=rows.filter(r=>r.staff_id===s.id&&r.month<=m&&(r.month===m||!r.only_month)).sort((a,b)=>a.month<b.month?1:-1)[0];
  const pay=x=>{ if(s.is_seppan) return {...x,pay_type:null,daily_wage:null}; const pt=x.pay_type||(s.pay_type==='daily'?'daily':'hourly'); return {...x,pay_type:pt,daily_wage:pt==='daily'?(x.pay_type?x.daily_wage:s.daily_wage)??null:null}; };
  if(t) return pay({...t,exempt_fines:t.exempt_fines||[]});
  return pay({month:null,only_month:false,guaranteed_wage:s.guaranteed_wage??null,guarantee_until:s.guarantee_until??null,douhan_quota:s.douhan_quota??null,back_pct:null,back_mode:'add',withhold:null,ctax_pct:null,welfare_mode:'std',welfare_amount:null,exempt_fines:[],slide_ids:null,pay_type:null,daily_wage:null}); }
const csNum=v=>v==null||v===''?null:Number(v);
const csDate=d=>{ if(!d) return '—'; if(d===CS_FOREVER) return '永久'; const [y,m,dd]=d.split('-').map(Number); return `${y}/${m}/${dd}`; };

PAGES.set_cast=async()=>{

  $('main').innerHTML=head+'<div class="card muted">読み込み中…</div>';
  const [sf,tm,ft,nt,stb]=await Promise.all([csList(st), sb.from('cast_terms').select('*').eq('store_id',st).lte('month',m),
    sb.from('fine_types').select('name').eq('store_id',st).order('sort_order'), sb.from('cast_notes').select('staff_id').eq('store_id',st).eq('is_void',false),
    sb.from('slide_tables').select('id,name,unit,sort_order').eq('store_id',st).eq('is_active',true).order('sort_order')]);
  if(page!=='set_cast'||storeId!==st||csMonth!==m) return;
  const er=sf.error||tm.error||nt.error;
  if(er){ $('main').innerHTML=head+`<div class="card err">${esc(/cast_terms|cast_notes|day_pay_ok/.test(er.message)&&/exist|schema cache/.test(er.message)?'SQL 056 が未実行です：':'読み込めません：')}${esc(er.message)}</div>`; csKindWire(); return; }
  const all=sf.data||[], halls=all.filter(x=>x.kind==='hall'), casts=all.filter(x=>x.kind==='cast'&&!x.is_trial&&!x.kakari_only);
  const nc={}; (nt.data||[]).forEach(x=>nc[x.staff_id]=(nc[x.staff_id]||0)+1);
  const tbls=stb.error?[]:(stb.data||[]); // SQL 058 の前は空
  const unitOf=(s,t)=>s.is_seppan?null:t.pay_type==='daily'?'daily':'hourly';
  const slOk=(ids,u)=>(ids||[]).filter(id=>tbls.some(x=>x.id===id&&x.unit===u));
  const slTxt=(s,t)=>{ const u=unitOf(s,t); if(!u) return '—'; const ok=slOk(t.slide_ids,u); return ok.length?esc(ok.map(id=>tbls.find(x=>x.id===id).name).join('・')):'<span class="badge warnb">未選択</span>'; };
  const fines=[...new Set([...(ft.data||[]).map(x=>x.name),'同伴ノルマ','新調日',CS_PUNCH])];
  const rows=casts.map(s=>({s,t:csTerms(s,tm.data||[],m)}));
  const mOpts=[]; for(let i=1;i>=-12;i--) mOpts.push(csAddMonth(cur,i));
  const hallName=id=>halls.find(h=>h.id===id)?.display_name||'—';
  const E=csEdit;
  const sel=(k,v,os,dis)=>`<select data-k="${k}" ${dis?'disabled':''}>${os.map(([ov,on])=>`<option value="${esc(ov)}" ${String(v??'')===String(ov)?'selected':''}>${esc(on)}</option>`).join('')}</select>`;
  const inp=(k,v,w,dis)=>`<input data-k="${k}" inputmode="decimal" value="${esc(v??'')}" style="width:${w}px" ${dis?'disabled':''}>`;
  const yn=v=>v==null?'—':v;
  const cell=({s,t})=>{ const sp=s.is_seppan, daily=!sp&&t.pay_type==='daily';
    const back=t.back_pct==null?'—':`${Number(t.back_pct)}%${t.back_mode==='instead'?'（時給なし）':''}`;
    const wf=t.welfare_mode==='amount'?yen(t.welfare_amount):t.welfare_mode==='none'?'なし':'いつもの決まり';
    if(!E) return [hallName(s.manager_staff_id), sp?'折半':daily?'日給':'時給', slTxt(s,t), daily&&t.daily_wage!=null?yen(t.daily_wage):'—', t.guaranteed_wage!=null?yen(t.guaranteed_wage):'—',
      t.guaranteed_wage!=null?csDate(t.guarantee_until):'—', t.douhan_quota!=null?t.douhan_quota+'回':'—', back, t.withhold==null?'—':t.withhold?'する':'しない',
      t.ctax_pct==null?'—':Number(t.ctax_pct)+'%', wf, t.exempt_fines.length?esc(t.exempt_fines.join('・')):'—', s.day_pay_ok==null?'—':s.day_pay_ok?'可':'不可',
      s.contract_done==null?'—':s.contract_done?'<span class="badge k">済</span>':'<span class="badge warnb">未</span>'];
    const fe=t.guarantee_until===CS_FOREVER;
    return [sel('mgr',s.manager_staff_id||'',[['','未選択'],...halls.map(h=>[h.id,h.display_name])]),
      sp?'折半<br><small class="muted">POSで</small>':sel('pt',daily?'daily':'hourly',[['hourly','時給'],['daily','日給']]),
      sp?'—':`<button class="ghost sm" data-k="sl" data-v="${esc(JSON.stringify(slOk(t.slide_ids,unitOf(s,t))))}">${slTxt(s,t)}</button>`, sp?'—':inp('dw',daily?t.daily_wage:'',80,!daily),
      inp('g',t.guaranteed_wage,80), `<span class="cs-gu"><input type="date" data-k="gu" value="${fe?'':esc(t.guarantee_until||'')}" ${fe?'disabled':''}><label><input type="checkbox" data-k="gf" ${fe?'checked':''}>永久</label></span>`,
      inp('q',t.douhan_quota,50)+' 回', inp('bk',t.back_pct==null?'':Number(t.back_pct),50)+' % '+sel('bm',t.back_mode,[['add','上乗せ'],['instead','時給の代わり']]),
      sel('wh',t.withhold==null?'':String(t.withhold),[['','—'],['true','する'],['false','しない']]), inp('ct',t.ctax_pct==null?'':Number(t.ctax_pct),50)+' %',

  return {month:t?.month??null,only_month:!!t?.only_month,pay_type:pt,amount:amt==null?null:Number(amt),withhold:t?.withhold??null,ctax_pct:t?.ctax_pct==null?null:Number(t.ctax_pct),welfare_mode:t?.welfare_mode||'std',welfare_amount:t?.welfare_mode==='amount'?(t.welfare_amount??null):null}; }

      <div class="row"><input id="spT" maxlength="50" placeholder="内容（50字まで）" style="flex:1;min-width:200px"><input id="spA" inputmode="numeric" placeholder="金額" style="width:120px;text-align:right">
      <select id="spF" style="width:auto">${mo.map(x=>`<option value="${x}" ${x===cur?'selected':''}>${csMLabel(x)}から</option>`).join('')}</select>
      <select id="spTo" style="width:auto"><option value="">ずっと</option>${mo.map(x=>`<option value="${x}">${csMLabel(x)}まで</option>`).join('')}</select><button class="primary" id="spAdd">追加</button></div>
      <div class="muted hint" style="font-size:13px;margin-top:8px">特別な支給・特別な控除は、その期間の毎月の給料に足す／引く金額です<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">罰金の免除は一覧の「罰金の免除」で決めます</div></div></div>`:''}`;
    wire(); if(!ed) return;
    let kind='pay'; const kb=$('spK').querySelectorAll('button'); kb.forEach(b=>b.onclick=()=>{ kind=b.dataset.v; kb.forEach(x=>x.classList.toggle('on',x===b)); $('spA').disabled=kind==='text'; if(kind==='text') $('spA').value=''; });
    $('main').querySelectorAll('[data-del]').forEach(b=>b.onclick=guard(b,async()=>{ if(!await uiConfirm('この条件を消しますか？','消す','danger')) return; const x=await rpc('admin_void_cast_special',{p_id:b.dataset.del}); if(!x.ok) return; toast('消しました'); csDetailPage(); }));
    const ad=$('spAdd'); ad.onclick=guard(ad,async()=>{ const title=$('spT').value.trim(), a=slNum($('spA').value), f=$('spF').value, to=$('spTo').value||null;
      if(!title){ await uiAlert('内容を入れてください'); return; }
      if(kind!=='text'&&(a==null||!Number.isInteger(a)||a<=0)){ await uiAlert('金額を1以上の整数で入れてください'); return; }
      if(to&&to<f){ await uiAlert('「まで」が「から」より前になっています'); return; }
      const x=await rpc('admin_add_cast_special',{p_store:st,p_staff:s.id,p_kind:kind,p_title:title,p_amount:kind==='text'?null:a,p_from:f,p_to:to}); if(!x.ok) return; toast('追加しました'); csDetailPage(); });
    return; }
  const [nr,cr]=await Promise.all([sb.from('cast_notes').select('*').eq('staff_id',s.id).eq('is_void',false).order('created_at',{ascending:false}), sb.from('cast_note_cats').select('names').eq('store_id',st).maybeSingle()]);
  if(page!=='set_cast'||storeId!==st||csDetail?.s!==s||csTab!==t) return;

  const cats=cr.data?.names?.length?cr.data.names:CS_CATS;
  const dt=x=>{ const d=new Date(x); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
  $('main').innerHTML=head+`${ed?`<div class="card"><div class="row"><select id="nC" style="width:auto">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="nB" maxlength="50" placeholder="1行・50字まで" style="flex:1;min-width:200px"><button class="primary" id="nAdd">追加</button></div>
    <div style="margin-top:8px;text-align:right"><button class="ghost sm" id="nCats">分類を変える</button></div></div>`:''}
    <div class="card">${(nr.data||[]).map(x=>`<div class="cs-li"><small class="muted" style="white-space:nowrap">${dt(x.created_at)} ${esc(x.author_name||'')}</small><span class="badge gray">${esc(x.category)}</span><span style="flex:1;min-width:0">${esc(x.body)}</span>${ed?`<button class="ghost sm" data-del="${x.id}" aria-label="消す">✕</button>`:''}</div>`).join('')||'<div class="muted">まだありません</div>'}</div>

    const x=await rpc('admin_add_cast_note',{p_store:st,p_staff:s.id,p_cat:$('nC').value,p_body:b}); if(!x.ok) return; toast('追加しました'); csDetailPage(); });
  $('main').querySelectorAll('[data-del]').forEach(b=>b.onclick=guard(b,async()=>{ if(!await uiConfirm('このメモを消しますか？','消す','danger')) return; const x=await rpc('admin_void_cast_note',{p_id:b.dataset.del}); if(!x.ok) return; toast('消しました'); csDetailPage(); }));
  $('nCats').onclick=()=>{ const md=modal(`<h2 style="margin:0">メモの分類</h2><div class="muted" style="font-size:14px">1行に1つ（10字まで）。今までのメモの分類は変わりません</div><textarea id="nCT" rows="8" style="font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px">${esc(cats.join('\n'))}</textarea>
      <div class="bar"><button class="ghost" data-k="no">やめる</button><button class="primary" data-k="ok">保存</button></div>`);
    md.querySelector('[data-k=no]').onclick=()=>md.remove();

      const x=await rpc('admin_save_note_cats',{p_store:st,p_names:ns}); if(!x.ok) return; md.remove(); toast('保存しました'); csDetailPage(); }); };

// ---------- 集計「キャスト」 v0.28・SQL 068：成績 → 支給 → 罰金 → 控除 → 支払う額（見るだけ。計算はデータベースの admin_cast_month） ----------
// 決定時給：選んだスライド表と保証時給（日給の人は日給）の高い方。時間報酬＝決定時給×勤務時間（日給の人は 日給×出勤日数）。会計済みの伝票だけ。体験は入れない
// 同伴ノルマ罰金＝足りない回数×時間給×4時間。源泉＝（課税対象額−5,000円×その月の日数）×10.21%（罰金は引かずに計算）。厚生費「いつもの決まり」＝出勤 1〜3日 5,000円／4〜10日 10,000円／11日以上 15,000円
let ksMonth=null;
const KS_COLS=[
  ['成績',[['manager','担当','t'],['days','出勤日数','d'],['hours','勤務時間','h'],['sales','係小計','y'],['points','ポイント','p'],['douhan','同伴','dq'],['reactions','反応','n']]],
  ['支給',[['wage','決定時給','w'],['time_pay','時間報酬','y'],['kakari_back','小計バック','y'],['item_back','商品バック','y'],['allowance','手当','y'],['special_pay','特別な支給','y']]],
  ['罰金',[['fines','罰金','m'],['quota_fine','同伴ノルマ','m']]],
  ['控除',[['ctax','消費税','m'],['welfare','厚生費','m'],['special_deduct','特別な控除','m'],['advance','日払（立替）','m'],['withholding','源泉','m']]],
  ['支払う額',[['taxable','課税対象額','y'],['net','残り支給額','net']]]];
PAGES.cast_sales=async()=>{ const st=storeId, now=csNowMonth(); if(!ksMonth) ksMonth=now; const m=ksMonth;
  const mOpts=Array.from({length:13},(_,i)=>csAddMonth(now,-i));
  const head=`<h1>キャスト <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1><div class="row" style="margin-bottom:12px"><select id="ksM" style="width:auto">${mOpts.map(x=>`<option value="${x}" ${x===m?'selected':''}>${csMLabel(x)}</option>`).join('')}</select></div>`;
  $('main').innerHTML=head+'<div class="card muted">読み込み中…</div>'; const wire=()=>{ const e=$('ksM'); if(e) e.onchange=()=>{ ksMonth=e.value; PAGES.cast_sales(); }; }; wire();
  const r=await sb.rpc('admin_cast_month',{p_store:st,p_month:m}); if(page!=='cast_sales'||storeId!==st||ksMonth!==m) return;
  if(r.error){ $('main').innerHTML=head+`<div class="card err">${esc(/admin_cast_month/.test(r.error.message)?'SQL 068 が未実行です：':'読み込めません：')}${esc(r.error.message)}</div>`; wire(); return; }
  const rows=r.data?.rows||[], n=v=>Number(v||0), yen0=v=>v?yen(v):'—', neg=v=>v?`<span style="color:#c0392b">−${yen(v).replace(/^-/,'')}</span>`:'—';
  const fmt=(k,typ,x)=>{ const v=x[k]; if(typ==='t') return esc(v||'—'); if(typ==='d') return n(v)?n(v)+'日':'—'; if(typ==='h') return n(v)?n(v).toLocaleString('ja-JP',{maximumFractionDigits:2})+'時間':'—';
    if(typ==='p') return n(v)?n(v).toLocaleString('ja-JP',{maximumFractionDigits:1}):'—'; if(typ==='n') return n(v)?n(v)+'回':'—';
    if(typ==='dq') return `${n(x.douhan)}回${x.quota!=null?` <small class="muted">／${x.quota}</small>`:''}`;
    if(typ==='w') return x.seppan?'<small class="muted">折半</small>':v==null?'<span class="badge warnb">未設定</span>':yen(v)+(x.pay_type==='daily'?' <small class="muted">日給</small>':'');
    if(typ==='m') return neg(n(v)); if(typ==='net') return n(v)<0?`<b style="color:#c0392b">${yen(v)}</b>`:`<b>${yen(v)}</b>`; return yen0(n(v)); };
  const sumKeys=['days','hours','sales','points','douhan','reactions','time_pay','kakari_back','item_back','allowance','special_pay','fines','quota_fine','ctax','welfare','special_deduct','advance','withholding','taxable','net'];
  const tot={}; sumKeys.forEach(k=>tot[k]=rows.reduce((a,x)=>a+n(x[k]),0));
  const cols=KS_COLS.flatMap(([g,cs])=>cs.map(c=>[g,...c]));
  const totCell=([g,k,l,typ])=>{ if(!sumKeys.includes(k)) return '<td></td>'; if(typ==='dq') return `<td>${tot.douhan}回</td>`; return `<td>${fmt(k,typ,tot)}</td>`; };
  $('main').innerHTML=head+(rows.length?`<div class="cs-w"><table class="t cs ks"><thead><tr><th class="nm" rowspan="2">名前</th>${KS_COLS.map(([g,cs])=>`<th colspan="${cs.length}" class="ksg">${g}</th>`).join('')}</tr>
    <tr>${cols.map(([g,k,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(x=>`<tr><td class="nm">${esc(x.name)}${x.active?'':' <small class="muted">（退店）</small>'}${x.seppan?' <small class="muted">折半</small>':''}</td>${cols.map(([g,k,l,typ])=>`<td>${fmt(k,typ,x)}</td>`).join('')}</tr>`).join('')}
    <tr class="kst"><td class="nm"><b>合計</b></td>${cols.map(totCell).join('')}</tr></tbody></table></div>`:'<div class="card muted">この月のキャストはいません</div>')
    +`<div class="muted hint" style="font-size:13px;margin-top:8px;line-height:1.6">会計済みの伝票と、タイムカードの打刻（丸めた時刻）で計算します<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">決定時給：選んだスライド表と保証時給（日給の人は日給）のうち一番高い金額。時間報酬＝決定時給×勤務時間（日給の人は 日給×出勤日数）<br>小計バック＝係小計×スタッフ設定のバック％。商品バック・手当・日払（立替）・罰金は POS で入れたもの。％の罰金は月末の時給で計算します<br>同伴ノルマ罰金＝足りない回数×時給×4時間（日給の人の時給は 日給÷所定時間）<br>課税対象額＝支給の合計。源泉＝（課税対象額−5,000円×その月の日数）×10.21%（罰金は引かずに計算。スタッフ設定で「しない」の人は0円）<br>厚生費「いつもの決まり」：出勤 1〜3日 5,000円／4〜10日 10,000円／11日以上 15,000円<br>残り支給額＝課税対象額−罰金−控除。体験の人はその日に払っているので入れていません。折半の人の計算はまだです<br>新調日罰金・名刺代は、キャストのマイページを作る時に入れます</div></div>`;
  wire(); };

// ---------- 請求書の未入金 v0.26・SQL 067：売上は会計した日のまま。振り込まれたら入金日を入れて「入金済み」にする（ここだけ。POS は見るだけ）。間違えた時は理由を入れて未入金に戻す。操作ログに残る ----------
let invTab='unpaid';
const mdj=d=>{ const m=String(d||'').match(/^\d{4}-(\d{2})-(\d{2})/); return m?`${+m[1]}/${+m[2]}`:''; };
const todayJst=()=>{ const x=new Date(Date.now()+9*3600000); return x.toISOString().slice(0,10); };
PAGES.invoice=async()=>{ const st=storeId, ed=perm('invoice')==='edit';
  const head=`<h1>請求書の未入金 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>${ed?'':'<div class="muted" style="margin-bottom:10px">見るだけ</div>'}`;
  $('main').innerHTML=head+`<div class="card muted">読み込み中…</div>`;
  const r=await sb.rpc('admin_invoice_list',{p_store:st}); if(page!=='invoice'||storeId!==st) return;
  if(r.error){ $('main').innerHTML=head+`<div class="card err">${esc(/admin_invoice_list/.test(r.error.message)?'SQL 067 が未実行です：':'読み込めません：')}${esc(r.error.message)}</div>`; return; }
  const all=r.data||[], un=all.filter(x=>!x.paid_on), pd=all.filter(x=>x.paid_on), list=invTab==='paid'?pd:un, sum=a=>a.reduce((t,x)=>t+Number(x.amount||0),0);
  $('main').innerHTML=head+`<div class="cs-tabs"><button data-it="unpaid" class="${invTab==='unpaid'?'on':''}">未入金（${un.length}件 ${yen(sum(un))}）</button><button data-it="paid" class="${invTab==='paid'?'on':''}">入金済み（${pd.length}件）</button></div>
  <div class="card"><table class="t"><tr><th>会計した日</th><th>卓</th><th>お客様</th><th>係</th><th style="text-align:right">金額</th>${invTab==='paid'?'<th>入金日</th>':''}${ed?'<th></th>':''}</tr>
  ${list.map(x=>`<tr><td>${esc(x.business_date)}</td><td>${esc(x.table_name||'')}</td><td>${esc(x.customers||'')}</td><td>${esc(x.kakari||'')}</td><td style="text-align:right">${yen(x.amount)}</td>${invTab==='paid'?`<td>${esc(x.paid_on)}</td>`:''}${ed?`<td style="text-align:right">${invTab==='paid'?`<button class="ghost sm" data-iu="${x.id}">未入金に戻す</button>`:`<button class="primary sm" data-ip="${x.id}">入金済みにする</button>`}</td>`:''}</tr>`).join('')||`<tr><td class="muted" colspan="7">${invTab==='paid'?'入金済みの請求書はありません':'未入金の請求書はありません'}</td></tr>`}</table></div>`;
  $('main').querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{ invTab=b.dataset.it; PAGES.invoice(); });
  const row=id=>all.find(x=>x.id===id), what=x=>`${x.business_date}　${x.table_name||''}${x.customers?'　'+x.customers+' 様':''}　${yen(x.amount)}`;
  $('main').querySelectorAll('[data-ip]').forEach(b=>b.onclick=guard(b,async()=>{ const x=row(b.dataset.ip); if(!x) return;
    const t=todayJst(), m=modal(`<h2 style="margin:0">入金済みにする</h2><div>${esc(what(x))}</div><label>入金日<input type="date" id="ipDate" value="${t}" min="${esc(x.business_date)}" max="${t}"></label><div class="bar"><button class="ghost" data-k="no">キャンセル</button><button class="primary" data-k="ok">入金済みにする</button></div>`);
    const d=await new Promise(res=>{ m.querySelector('[data-k=no]').onclick=()=>{ m.remove(); res(null); }; m.querySelector('[data-k=ok]').onclick=()=>{ const v=m.querySelector('#ipDate').value; m.remove(); res(v||''); }; });
    if(d===null) return; if(!d){ await uiAlert('入金日を入れてください'); return; }
    const z=await rpc('admin_invoice_paid',{p_payment:x.id,p_date:d}); if(!z.ok) return; toast(`${mdj(d)} 入金済みにしました`); PAGES.invoice(); }));
  $('main').querySelectorAll('[data-iu]').forEach(b=>b.onclick=guard(b,async()=>{ const x=row(b.dataset.iu); if(!x) return;
    const m=modal(`<h2 style="margin:0">未入金に戻す</h2><div>${esc(what(x))}<br>入金日 ${esc(x.paid_on)}</div><label>理由（必須・操作ログに残ります）<input id="iuWhy" maxlength="100"></label><div class="bar"><button class="ghost" data-k="no">キャンセル</button><button class="danger" data-k="ok">未入金に戻す</button></div>`);
    const w=await new Promise(res=>{ m.querySelector('[data-k=no]').onclick=()=>{ m.remove(); res(null); }; m.querySelector('[data-k=ok]').onclick=()=>{ const v=m.querySelector('#iuWhy').value.trim(); m.remove(); res(v); }; });
    if(w===null) return; if(!w){ await uiAlert('理由を入れてください'); return; }
    const z=await rpc('admin_invoice_unpaid',{p_payment:x.id,p_reason:w}); if(!z.ok) return; toast('未入金に戻しました'); PAGES.invoice(); })); };

// ---------- POS設定の「店の情報」 v0.26・SQL 067：前の「店舗設定」を POS設定にまとめた（権限も POS設定）。v0.14・SQL 055：閉店時間（タイムカードの打ち止め。アフターの延長もここから数える） ----------
// v0.20・SQL 060：店の情報（店名・営業時間・住所・電話・メール・インボイス番号・領収書メールの宛先）。書き換えはここだけ
// 店名は全部のサイト（POS・顧客サイト・タイムカード）に出る。住所・電話・インボイス番号は POS の領収書に出る。領収書メールの宛先は POS の閉店作業で使う。開店時間は登録するだけ
async function siRender(){ const st=storeId, ed=perm('set_pos')==='edit', dis=ed?'':'disabled', box=()=>$('siBox');
  const r=await sb.rpc('admin_get_store_info',{p_store:st}); if(page!=='set_pos'||storeId!==st||!box()) return;
  if(r.error){ box().innerHTML=`<div class="card err">${esc(/admin_get_store_info/.test(r.error.message)?'SQL 060 が未実行です：':'読み込めません：')}${esc(r.error.message)}</div>`; return; }
  const d=r.data||{}, f=(id,label,v,o={})=>`<label>${label}<input id="${id}" value="${esc(v||'')}" ${o.type?`type="${o.type}"`:''} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.im?`inputmode="${o.im}"`:''} ${o.ml?`maxlength="${o.ml}"`:''} ${dis}></label>`;
  box().innerHTML=`<div class="card"><h2>店の情報</h2><div class="sif">
    ${f('siName','店名',d.name,{ml:40})}
    <label>営業時間<span class="sit"><input type="time" id="siOpen" value="${esc(d.open||'')}" ${dis}><span>〜</span><input type="time" id="siClose" value="${esc(d.close||'')}" ${dis}></span></label>
    ${f('siAddr','住所',d.address)}
    ${f('siTel','電話番号',d.phone,{type:'tel',ph:'03-0000-0000'})}
    ${f('siMail','メールアドレス',d.email,{type:'email',ph:'info@example.com'})}
    ${f('siInv','インボイス番号（T＋数字13桁）',d.invoice,{ph:'T1234567890123',ml:20})}
    ${f('siRcpt','領収書メールの宛先',d.receipt_mail,{type:'email'})}
  </div>
  ${ed?'<div class="row" style="margin-top:12px"><button class="primary" id="siSave">保存</button></div>':''}
  <div class="muted hint" style="font-size:13px;margin-top:10px;line-height:1.6">店名は POS・顧客サイト・タイムカード・管理サイトに出ます<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">住所・電話番号・インボイス番号は POS の領収書に出ます。領収書メールの宛先は POS の閉店作業「領収書をメールで送る」で使います。開店時間は登録だけです<br>閉店時間：タイムカードの退勤・アフターの打刻は、閉店より後になりません（時給は閉店まで）<br>0:00〜6:00 は日付が変わった後として扱います（例：1:00 ＝ 翌1:00、23:00 ＝ その日の23:00）<br>アフターの延長（給与項目）も、この閉店時間から数えます。変えても、前の打刻はそのまま</div></div></div>`;
  if(!ed) return;
  const sv=$('siSave'); sv.onclick=guard(sv,async()=>{ const v=id=>$(id).value.trim(), name=v('siName'), op=v('siOpen'), cl=v('siClose');
    if(!name){ await uiAlert('店名を入れてください'); return; } if(!cl){ await uiAlert('閉店時間を入れてください'); return; } if(cl>'06:00'&&cl<'18:00'){ await uiAlert('閉店時間は 18:00〜翌6:00 の間にしてください'); return; }
    let iv=v('siInv').replace(/[Ａ-Ｚａ-ｚ０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[\s-]/g,'').toUpperCase(); if(/^\d{13}$/.test(iv)) iv='T'+iv;
    if(iv&&!/^T\d{13}$/.test(iv)){ await uiAlert('インボイス番号は T＋数字13桁 で入れてください'); return; }
    const em=/^[^@\s]+@[^@\s]+\.[^@\s]+$/; if(v('siMail')&&!em.test(v('siMail'))){ await uiAlert('メールアドレスの形が正しくありません'); return; } if(v('siRcpt')&&!em.test(v('siRcpt'))){ await uiAlert('領収書メールの宛先の形が正しくありません'); return; }
    const chg=[]; if(name!==(d.name||'')) chg.push('店名（全部のサイトの表示が変わります）'); if(cl!==(d.close||'')) chg.push(`閉店時間 ${closeTxt(cl)}（これから押す打刻から変わります）`);
    if(!await uiConfirm('店の情報を保存しますか？'+(chg.length?'\n'+chg.map(x=>'・'+x).join('\n'):''))) return;
    const x=await rpc('admin_save_store_info',{p_store:st,p_name:name,p_open:op||null,p_close:cl,p_address:v('siAddr'),p_phone:v('siTel'),p_email:v('siMail'),p_invoice:iv,p_receipt_mail:v('siRcpt')}); if(!x.ok) return;
    toast('保存しました'); me=await loadMe()||me; renderStoreSel(); const h=$('main').querySelector('h1 small'); if(h) h.textContent=curStore()?.name||''; siRender(); }); }

// ---------- POS設定 v0.22・SQL 062：料金（メニュー以外）はここだけで変える。POS では見るだけ ----------
// HC・BC は伝票を立ち上げた時に人数分つける。金額だけ選ぶ（伝票の名前は HC／BC）。HC は係にバック100%（振分できる）、BC は誰にもバックなし
const HCBC_OPTS=[[null,'付けない'],...Array.from({length:10},(_,i)=>[(i+1)*1000,((i+1)*1000).toLocaleString('ja-JP')+'円'])];
PAGES.set_pos=async()=>{ const st=storeId, ed=perm('set_pos')==='edit', dis=ed?'':'disabled';
  const keep=$('siBox')?.dataset.st===st?$('siBox'):null; // 料金だけ保存した時は、店の情報の入力中の内容を消さない
  $('main').innerHTML=`<h1>POS設定 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1><div class="card muted">読み込み中…</div>`;
  const [ps,tb]=await Promise.all([ sb.from('pos_settings').select('*').eq('store_id',st).maybeSingle(), sb.from('tables').select('id,name,vip_set_fee,vip_ext_fee,sort_order').eq('store_id',st).order('sort_order').order('id') ]);
  if(page!=='set_pos'||storeId!==st) return;
  const er=ps.error||tb.error; if(er){ $('main').innerHTML=`<h1>POS設定</h1><div class="card err">読み込めません：${esc(er.message)}</div>`; return; }
  const d=ps.data||{}; if(!('auto_hc_amount' in d)){ $('main').innerHTML=`<h1>POS設定</h1><div class="card err">SQL 062 が未実行です</div>`; return; }
  const num=(id,label,v)=>`<label>${label}<input id="${id}" inputmode="decimal" value="${esc(v??'')}" ${dis}></label>`;
  const amt=(id,label,v)=>`<label>${label}<select id="${id}" ${dis}>${HCBC_OPTS.map(([a,n])=>`<option value="${a??''}" ${(v??null)===a?'selected':''}>${n}</option>`).join('')}</select></label>`;
  const tables=tb.data||[];
  $('main').innerHTML=`<h1>POS設定 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>${ed?'':'<div class="muted" style="margin-bottom:10px">見るだけ</div>'}
  <div id="siBox" data-st="${esc(st)}"><div class="card muted">読み込み中…</div></div>
  <div class="card"><h2>料金</h2><div class="grid2">
    ${num('psSetM','最初のセット時間（分）',d.set_minutes)}${num('psSetP','セット1名単価（円）',d.set_unit_price)}
    ${num('psExtM','延長単位（分）',d.ext_minutes)}${num('psExtP','延長1名単価（円）',d.ext_unit_price)}
    ${num('psSvc','サービス料率（%）',d.service_rate)}${num('psTax','消費税率（%）',d.tax_rate)}
    ${num('psRnd','合計の切り上げ単位（円）',d.total_round_unit)}
    ${amt('psHc','HC（人数分・係にバック100%）',d.auto_hc_amount)}${amt('psBc','BC（人数分・バックなし）',d.auto_bc_amount)}
  </div></div>
  <div class="card"><h2>伝票</h2>
    <label class="ck"><input type="checkbox" id="psDk" ${d.douhan_is_kakari?'checked':''} ${dis}>同伴にした人を自動で係にする</label>
    <label class="ck"><input type="checkbox" id="psCk" ${d.cust_auto_kakari!==false?'checked':''} ${dis}>お客様を登録したら、そのお客様の係を自動で入れる</label></div>
  <div class="card"><h2>VIP料金（卓ごと・0＝通常卓）</h2>
    <div class="muted" style="font-size:13px;margin-bottom:6px">VIP代は部屋に1回、VIP延長は延長ごと。人数は掛けません</div>
    <table class="t vip"><tr><th>卓</th><th>VIP代（円）</th><th>VIP延長（円）</th></tr>
    ${tables.map(t=>`<tr data-tb="${t.id}"><td>${esc(t.name)}</td><td><input inputmode="numeric" data-v="set" value="${esc(String(t.vip_set_fee||0))}" ${dis}></td><td><input inputmode="numeric" data-v="ext" value="${esc(String(t.vip_ext_fee||0))}" ${dis}></td></tr>`).join('')||'<tr><td class="muted" colspan="3">卓がありません</td></tr>'}</table></div>
  ${ed?'<div class="row"><button class="primary" id="psSave">保存</button></div>':''}
  <div class="muted hint" style="font-size:13px;margin-top:10px;line-height:1.6">保存すると、POS の次の伝票から変わります（今開いている伝票はそのまま）<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">日払（立替）の上限・体験の源泉・ポイント・同伴の準備時間は「給与項目」で変えます</div></div>`;
  if(keep) $('siBox').replaceWith(keep); else siRender();
  if(!ed) return;
  const sv=$('psSave'); sv.onclick=guard(sv,async()=>{
    const g=id=>slNum($(id).value), v={set_minutes:g('psSetM'),set_unit_price:g('psSetP'),ext_minutes:g('psExtM'),ext_unit_price:g('psExtP'),service_rate:g('psSvc'),tax_rate:g('psTax'),total_round_unit:g('psRnd')};
    const lab={set_minutes:'最初のセット時間',set_unit_price:'セット1名単価',ext_minutes:'延長単位',ext_unit_price:'延長1名単価',service_rate:'サービス料率',tax_rate:'消費税率',total_round_unit:'合計の切り上げ単位'};
    for(const [k,x] of Object.entries(v)){ if(x==null||!Number.isFinite(x)||x<0){ await uiAlert(`${lab[k]}を0以上の数で入れてください`); return; } }
    for(const k of ['set_minutes','set_unit_price','ext_minutes','ext_unit_price','total_round_unit']) if(!Number.isInteger(v[k])){ await uiAlert(`${lab[k]}は整数で入れてください`); return; }
    if(!(v.set_minutes>0)||!(v.ext_minutes>0)){ await uiAlert('セット時間と延長単位は1分以上にしてください'); return; }
    if(v.service_rate>100||v.tax_rate>100){ await uiAlert('サービス料率・消費税率は100%までです'); return; }
    v.auto_hc_amount=$('psHc').value?Number($('psHc').value):null; v.auto_bc_amount=$('psBc').value?Number($('psBc').value):null;
    v.douhan_is_kakari=$('psDk').checked; v.cust_auto_kakari=$('psCk').checked;
    const vip=[]; for(const tr of $('main').querySelectorAll('tr[data-tb]')){ const a=slNum(tr.querySelector('[data-v=set]').value)??0, b=slNum(tr.querySelector('[data-v=ext]').value)??0;
      if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0){ await uiAlert(`${tr.cells[0].textContent} のVIP料金は0以上の整数で入れてください`); return; } vip.push({id:tr.dataset.tb,set:a,ext:b}); }
    if(!await uiConfirm('POS設定を保存しますか？\nPOS の次の伝票から変わります')) return;
    const r=await rpc('admin_save_pos_settings',{p_store:st,p_vals:v,p_vip:vip}); if(!r.ok) return; toast('保存しました'); PAGES.set_pos(); }); };

// v0.22・SQL 062：給与で使う数（日払の上限・体験の源泉・ポイント・同伴の準備時間）。前は POS の料金設定にあった
function payNumCard(pos,ed){ const d=pos.data||{}, dis=ed?'':'disabled'; const num=(id,label,v)=>`<label>${label}<input id="${id}" inputmode="decimal" value="${esc(v??'')}" ${dis}></label>`;
  return `<div class="card" data-paynum><h2>日払（立替）・体験・ポイント・同伴</h2><div class="grid2">
    ${num('pnCapC','日払（立替）の上限（キャスト）円',d.advance_cap_cast)}${num('pnCapH','日払（立替）の上限（黒服）円',d.advance_cap_hall)}
    ${num('pnTw','体験入店の源泉（%）',d.trial_withholding_rate)}
    ${num('pnSp','セット1名のポイント',d.set_point)}${num('pnEp','延長1回1名のポイント',d.ext_point)}
    ${num('pnDh','同伴の準備時間（分・0＝警告なし）',d.douhan_punch_limit_min)}

function payNumWire(st){ const sv=$('pnSave'); if(!sv) return; sv.onclick=guard(sv,async()=>{
  const g=id=>slNum($(id).value), v={advance_cap_cast:g('pnCapC'),advance_cap_hall:g('pnCapH'),trial_withholding_rate:g('pnTw'),set_point:g('pnSp'),ext_point:g('pnEp'),douhan_punch_limit_min:g('pnDh')};

  if(!await uiConfirm('日払（立替）・体験・ポイント・同伴の設定を保存しますか？')) return;

// ---------- 打刻一覧 v0.23・SQL 063：日ごとの打刻と写真（見るだけ。打刻の修正は POS） ----------
let pcDate=null;
const PC_TYPES=[['douhan','同伴'],['clock_in','出勤'],['after','アフター'],['clock_out','退勤']];
PAGES.punches=async()=>{ const st=storeId; if(!pcDate) pcDate=businessDate(); const d=pcDate;
  const head=`<h1>打刻一覧 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>
  <div class="row" style="margin-bottom:12px"><button class="ghost" id="pcPrev">◀</button><input type="date" id="pcDate" value="${d}" style="width:auto"><button class="ghost" id="pcNext">▶</button><button class="ghost" id="pcToday">今日</button></div>`;
  $('main').innerHTML=head+'<div class="card muted">読み込み中…</div>';
  const wire=()=>{ $('pcDate').onchange=()=>{ if($('pcDate').value){ pcDate=$('pcDate').value; PAGES.punches(); } }; $('pcPrev').onclick=()=>{ pcDate=dayAdd(d,-1); PAGES.punches(); }; $('pcNext').onclick=()=>{ pcDate=dayAdd(d,1); PAGES.punches(); }; $('pcToday').onclick=()=>{ pcDate=businessDate(); PAGES.punches(); }; };
  const [ev,sf]=await Promise.all([ sb.from('attendance_events').select('staff_id,event_type,event_at,photo_path,is_corrected').eq('store_id',st).eq('business_date',d).order('event_at'),
    sb.from('staff').select('id,display_name,kind,sort_order').eq('store_id',st).order('sort_order').order('id') ]);
  if(page!=='punches'||storeId!==st||pcDate!==d) return;
  const er=ev.error||sf.error; if(er){ $('main').innerHTML=head+`<div class="card err">読み込めません：${esc(er.message)}</div>`; wire(); return; }
  const by={}; (ev.data||[]).forEach(e=>{ const o=by[e.staff_id]||(by[e.staff_id]={}); o[e.event_type]=e; });
  const people=(sf.data||[]).filter(x=>by[x.id]);
  const paths=(ev.data||[]).map(e=>e.photo_path).filter(Boolean); let urls={};
  if(paths.length){ const r=await sb.storage.from('selfies').createSignedUrls(paths,3600); (r.data||[]).forEach(x=>{ if(x.signedUrl) urls[x.path]=x.signedUrl; }); if(page!=='punches'||pcDate!==d) return; }
  const hm=t=>{ const x=new Date(t); return `${x.getHours()}:${String(x.getMinutes()).padStart(2,'0')}`; };
  const cell=e=>!e?'<span class="muted">—</span>':`<div class="pc-c"><span>${hm(e.event_at)}${e.is_corrected?' <small class="badge warnb">修正</small>':''}</span>${e.photo_path?(urls[e.photo_path]?`<img src="${esc(urls[e.photo_path])}" data-big="${esc(urls[e.photo_path])}" alt="">`:'<small class="muted">写真を出せません</small>'):'<small class="muted">写真なし</small>'}</div>`;
  $('main').innerHTML=head+(people.length?`<div class="cs-w"><table class="reg pc"><tr><th class="nm">名前</th>${PC_TYPES.map(([,n])=>`<th>${n}</th>`).join('')}</tr>
    ${people.map(p=>`<tr><td class="nm">${esc(p.display_name)}${p.kind==='hall'?' <small class="muted">黒服</small>':''}</td>${PC_TYPES.map(([k])=>`<td>${cell(by[p.id][k])}</td>`).join('')}</tr>`).join('')}</table></div>`
    :'<div class="card muted">この日の打刻はありません</div>')+`<div class="muted" style="font-size:13px;margin-top:10px">写真を押すと大きく出ます。打刻の修正は POS の在籍リストで行います</div>`;
  wire();
  $('main').querySelectorAll('[data-big]').forEach(im=>im.onclick=()=>{ const m=modal(`<img src="${esc(im.dataset.big)}" alt="" style="width:100%;border-radius:10px"><div class="bar"><button class="primary" data-k="ok">閉じる</button></div>`); m.querySelector('[data-k=ok]').onclick=()=>m.remove(); }); };

// ---------- タイムカードの端末 v0.23・SQL 063（オーナーだけ）：登録した端末だけ打刻できる ----------
async function tcCard(){ const box=$('tcBox'); if(!box) return; const st=storeId;
  const r=await sb.rpc('admin_tc_list',{p_store:st}); if(page!=='pw'||storeId!==st||!$('tcBox')) return;
  if(r.error){ box.innerHTML=`<h2>タイムカードの端末</h2><div class="err">${esc(/admin_tc_list/.test(r.error.message)?'SQL 063 が未実行です：':'読み込めません：')}${esc(r.error.message)}</div>`; return; }
  const L=r.data||[];
  box.innerHTML=`<h2>タイムカードの端末</h2><div class="muted hint" style="font-size:14px;margin-bottom:8px">ここで登録した端末だけ打刻できます<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">「登録コードを出す」で出た6けたを、その端末のタイムカードで入れます（30分有効）</div></div>
    <table class="t"><tr><th>端末</th><th>状態</th><th>最後の打刻</th><th></th></tr>
    ${L.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.registered?'<span class="badge k">登録済み</span>':x.code_expires_at?`<span class="badge warnb">コード待ち</span><br><small class="muted">${esc(fmtDT(x.code_expires_at))} まで</small>`:'<span class="badge gray">未登録</span>'}</td>
      <td>${x.last_used_at?esc(fmtDT(x.last_used_at)):'—'}</td><td style="text-align:right;white-space:nowrap"><button class="ghost sm" data-tcre="${x.id}" data-l="${esc(x.label)}">登録し直す</button> <button class="ghost sm" data-tcdel="${x.id}" data-l="${esc(x.label)}">消す</button></td></tr>`).join('')||'<tr><td class="muted" colspan="4">まだありません</td></tr>'}</table>
    <div class="grid2" style="margin-top:10px"><label>端末の名前<input id="tcLabel" placeholder="例：入口の iPad" maxlength="30"></label><div><button class="primary" id="tcAdd" style="width:100%">登録コードを出す</button></div></div>`;
  const show=(label,code)=>new Promise(res=>{ const m=modal(`<h2 style="margin:0">登録コード</h2><div>${esc(label)}</div><div class="tccode">${esc(code)}</div><div class="muted" style="font-size:14px">この端末のタイムカードを開いて入れてください（30分有効・1回だけ使えます）</div><div class="bar"><button class="primary" data-k="ok">閉じる</button></div>`); m.querySelector('[data-k=ok]').onclick=()=>{ m.remove(); res(); }; });
  const add=$('tcAdd'); add.onclick=guard(add,async()=>{ const lb=$('tcLabel').value.trim(); if(!lb){ await uiAlert('端末の名前を入れてください'); return; }
    const x=await rpc('admin_tc_code',{p_store:st,p_id:null,p_label:lb}); if(!x.ok) return; await show(lb,x.data.code); tcCard(); });
  box.querySelectorAll('[data-tcre]').forEach(b=>b.onclick=guard(b,async()=>{ if(!await uiConfirm(`${b.dataset.l} を登録し直しますか？\n今の登録は使えなくなり、新しい登録コードを入れるまで、この端末では打刻できません`)) return;
    const x=await rpc('admin_tc_code',{p_store:st,p_id:b.dataset.tcre,p_label:null}); if(!x.ok) return; await show(b.dataset.l,x.data.code); tcCard(); }));
  box.querySelectorAll('[data-tcdel]').forEach(b=>b.onclick=guard(b,async()=>{ if(!await uiConfirm(`${b.dataset.l} を消しますか？\nこの端末では打刻できなくなります`,'消す','danger')) return;
    const x=await rpc('admin_tc_delete',{p_id:b.dataset.tcdel}); if(!x.ok) return; toast('消しました'); tcCard(); })); }

// ---------- 表示設定（オーナー） ----------
PAGES.o_perms=()=>{
  const s=stSet(); const perms={...(s.perms||{})}; if(!perms.pl&&(perms.pl_day||perms.pl_month)) perms.pl=perms.pl_day||perms.pl_month; if(!perms.register&&perms.register_month) perms.register=perms.register_month;
  const rows=SCREENS.map(x=>x.grp?`<tr><th colspan="2" style="padding-top:14px;color:var(--ink);font-weight:700">${esc(x.grp)}</th></tr>`
    :`<tr class="pr"><td>${esc(x.n)}</td><td style="text-align:right"><span class="seg" data-pk="${x.k}">${['none','view','edit'].map(v=>`<button data-v="${v}" class="${(perms[x.k]||'none')===v?'on':''}">${PERM_LABEL[v]}</button>`).join('')}</span></td></tr>`).join('');
  $('main').innerHTML=`<h1>表示設定 <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>
  <div class="card"><h2>オーナー以外の人が使える画面</h2><div class="muted" style="font-size:14px;margin-bottom:8px">この店舗のオーナー以外の人、全員に同じ設定が使われます。オーナーはいつでも全部の画面を使えます</div>
  <table class="t perm">${rows}</table></div>
  <div class="card"><h2>日報のさかのぼり</h2><div class="row"><span>オーナー以外は、今日から</span><input id="ndays" type="number" inputmode="numeric" min="0" max="366" value="${Number(s.nippo_days??3)}" style="width:100px;text-align:right"><span>日前まで見られる</span></div>
  <div class="muted" style="font-size:14px;margin-top:6px">例：3 にすると、今日・昨日・2日前・3日前まで。0 にすると今日だけ</div></div>
  <div class="row"><button class="primary" id="permSave">保存</button></div>`;
  $('main').querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ perms[g.dataset.pk]=b.dataset.v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));
  $('permSave').onclick=guard($('permSave'),async()=>{

};

// ---------- 顧客情報の共有（オーナー）v0.06・SQL 048 ----------
// 「共有する」にした店舗どうしで、お客様の基本情報・来店履歴・キープ中のボトル（見るだけ）を見せ合う。「しない」に戻してもデータは消えない
PAGES.o_share=()=>{
  const on=id=>!!me?.settings?.[id]?.cust_share;
  $('main').innerHTML=`<h1>顧客情報の共有</h1>
  <div class="card"><div class="muted hint" style="font-size:14px;margin-bottom:8px">「共有する」にした店舗どうしで、お客様の情報を見せ合います<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">「共有する」にした店舗どうしで、お客様の基本情報（見る・変える）・来店履歴・キープ中のボトル（見るだけ）を見せ合います。係はそれぞれの店舗で決めます。<br>「しない」に戻しても、データは消えません（ほかの店舗から見えなくなるだけです）</div></div>
  <table class="t">${stores().map(st=>`<tr><td>${esc(st.name)}</td><td style="text-align:right"><span class="seg" data-st="${st.id}">${[[true,'共有する'],[false,'しない']].map(([v,n])=>`<button data-v="${v}" class="${on(st.id)===v?'on':''}">${n}</button>`).join('')}</span></td></tr>`).join('')}</table></div>`;
  $('main').querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=guard(b,async()=>{
    const v=b.dataset.v==='true', st=stores().find(x=>x.id===g.dataset.st); if(on(st.id)===v) return;
    if(!await uiConfirm(v?`${st.name} の顧客情報を「共有する」にしますか？\n「共有する」のほかの店舗から見えるようになります`:`${st.name} の顧客情報を「しない」にしますか？\nデータは消えません。ほかの店舗から見えなくなります`)) return;
    const r=await rpc('admin_set_cust_share',{p_store:st.id,p_on:v}); if(!r.ok) return;
    me=await loadMe()||me; toast('保存しました'); PAGES.o_share(); })));
};

// ---------- 管理サイトのID（オーナー） ----------
PAGES.o_ids=async()=>{
  $('main').innerHTML=`<h1>管理サイトのID</h1><div class="card muted">読み込み中…</div>`;
  const [ra,rh]=await Promise.all([sb.rpc('admin_accounts_list'),sb.rpc('admin_hall_staff',{p_store:storeId})]);
  if(page!=='o_ids') return;
  if(ra.error||rh.error){ $('main').innerHTML=`<h1>管理サイトのID</h1><div class="card err">${esc((ra.error||rh.error).message)}</div>`; return; }
  const halls=rh.data||[], sName=id=>stores().find(s=>s.id===id)?.name||'';
  const list=(ra.data||[]).filter(a=>a.is_owner||a.store_id===storeId);
  $('main').innerHTML=`<h1>管理サイトのID <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>
  <div class="card"><h2>IDの一覧</h2><table class="t"><tr><th>ID</th><th>名前</th><th>店舗</th><th>黒服</th><th>状態</th><th></th></tr>
  ${list.map(a=>`<tr><td><b>${esc(a.login_id)}</b></td><td>${esc(a.name)}</td><td>${a.is_owner?'全店舗':esc(sName(a.store_id))}</td><td>${esc(a.staff_name||'—')}</td>
    <td>${a.is_owner?'<span class="badge">オーナー</span>':a.is_active?'使える':'<span class="badge gray">止めている</span>'}</td>
    <td style="text-align:right">${a.is_owner?'':`<button class="ghost sm" data-ed="${a.id}">変更</button>`}</td></tr>`).join('')}
  </table></div>
  <div class="card"><h2>IDを作る</h2>
    <div class="grid2">
      <label>ID（半角の小文字・数字 3〜20文字）<input id="nId" autocapitalize="off" spellcheck="false"></label>
      <label>名前<input id="nName"></label>
      <label>黒服と結びつける<select id="nStaff"><option value="">結びつけない</option>${halls.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></label>
      <label>最初のパスワード（8文字以上）<input id="nPw" autocapitalize="off" spellcheck="false"></label>
    </div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="nGen">パスワードを自動で作る</button><button class="primary" id="nSave">作る</button></div>
    <div class="muted hint" style="font-size:14px;margin-top:8px">黒服と結びつけると、POSでその黒服を削除した時に、このIDも自動で使えなくなります<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">店舗は上で選んでいる「${esc(curStore()?.name||'')}」になります</div></div>
  </div>`;
  $('nGen').onclick=()=>{ $('nPw').value=genPw(10); };
  $('nSave').onclick=guard($('nSave'),async()=>{
    const id=$('nId').value.trim().toLowerCase(), pw=$('nPw').value;
    if(!/^[a-z0-9_-]{3,20}$/.test(id)){ await uiAlert('IDは半角の小文字・数字で3〜20文字にしてください'); return; }
    if(pw.length<8){ await uiAlert('パスワードは8文字以上にしてください'); return; }
    const r=await rpc('admin_account_create',{p_login:id,p_pw:pw,p_name:$('nName').value.trim(),p_store:storeId,p_staff:$('nStaff').value||null}); if(!r.ok) return;
    await uiAlert(`IDを作りました\n\nID：${id}\nパスワード：${pw}\n\n本人に伝えてください`); PAGES.o_ids(); });
  $('main').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editAccount(list.find(a=>a.id===b.dataset.ed),halls));
};
async function editAccount(a,halls){ if(!a) return;
  const m=modal(`<h2 style="margin:0">IDの変更：${esc(a.login_id)}</h2>
    <label>名前<input data-k="name" value="${esc(a.name)}"></label>
    <label>黒服と結びつける<select data-k="staff"><option value="">結びつけない</option>${halls.map(h=>`<option value="${h.id}" ${h.id===a.staff_id?'selected':''}>${esc(h.name)}</option>`).join('')}${a.staff_id&&!halls.some(h=>h.id===a.staff_id)?`<option value="${a.staff_id}" selected>${esc(a.staff_name||'（削除済みの黒服）')}</option>`:''}</select></label>
    <label>状態<select data-k="active"><option value="1" ${a.is_active?'selected':''}>使える</option><option value="0" ${a.is_active?'':'selected'}>止める（ログインできなくする）</option></select></label>
    <div class="bar"><button class="ghost" data-k="no">キャンセル</button><button class="primary" data-k="ok">保存</button></div>`);
  const q=k=>m.querySelector(`[data-k=${k}]`);
  q('no').onclick=()=>m.remove();
  q('ok').onclick=guard(q('ok'),async()=>{ const act=q('active').value==='1';
    if(a.is_active&&!act&&!await uiConfirm(`「${a.login_id}」を止めます。今ログインしていてもすぐに使えなくなります`,'止める','danger')) return;
    const r=await rpc('admin_account_update',{p_id:a.id,p_name:q('name').value.trim(),p_staff:q('staff').value||null,p_active:act}); if(!r.ok) return;
    m.remove(); toast('保存しました'); PAGES.o_ids(); });
}

// ---------- パスワード ----------
PAGES.pw=async()=>{
  if(!me.is_owner){ PAGES.none(); return; }
  const own=`<div class="card"><h2>自分のパスワード（ID：${esc(me.login_id)}）</h2>
    <div class="grid2"><label>新しいパスワード（8文字以上）<input id="myPw1" type="password" autocomplete="new-password"></label><label>もう一度<input id="myPw2" type="password" autocomplete="new-password"></label><div><button class="primary" id="mySave" style="width:100%">変える</button></div></div>
    <div class="muted" style="font-size:14px;margin-top:8px">変えると、ほかの端末でこのIDでログインしている分はログアウトされます</div></div>`;
  $('main').innerHTML=`<h1>パスワード <small class="muted" style="font-weight:400">${esc(curStore()?.name||'')}</small></h1>${own}<div class="card muted">読み込み中…</div>`; bindOwn();
  const r=await sb.rpc('admin_credentials',{p_store:storeId}); if(page!=='pw') return;
  if(r.error){ $('main').lastElementChild.outerHTML=`<div class="card err">${esc(r.error.message)}</div>`; return; }
  const d=r.data||{};
  const pwCell=pw=>pw?`<span class="pwv" data-pwv="${esc(pw)}">••••••••</span> <button class="ghost sm" data-show>見る</button>`:'<small class="muted">管理サイトで変えると、ここに出ます</small>';
  const O=true; // v0.21：この画面はオーナーだけ（SQL 061 で関数もオーナーだけにする）
  const row=(label,sub,key,pw)=>`<tr><td>${label}${sub?`<br><small class="muted">${sub}</small>`:''}</td><td>${pwCell(pw)}</td><td style="text-align:right">${O?`<button class="ghost sm" data-pw="${esc(key)}" data-label="${esc(label.replace(/<[^>]*>/g,''))}">変える</button>`:''}</td></tr>`;
  $('main').lastElementChild.outerHTML=(O?`
  <div class="card"><h2>全部まとめて新しくする</h2><div class="muted hint" style="font-size:14px;margin-bottom:10px">黒服が辞めた時に使ってください<button type="button" class="qm" aria-label="詳しく">？</button><div class="more">POS・タイムカードの端末と顧客サイトのパスワードを、自動で作った新しいものに一度に変えます</div></div><button class="danger" id="rotAll">全部のパスワードを新しくする</button></div>`:'')+`
  <div class="card"><h2>今のパスワード</h2><div class="muted" style="font-size:14px;margin-bottom:6px">「変える」で、好きなパスワードを入れて変えられます（自動で作ることもできます）</div><table class="t">
    <tr><th>どこの</th><th>パスワード</th><th></th></tr>
    ${(d.devices||[]).map(x=>row(`POS・タイムカード：${esc(x.label||'端末')}`,`ログイン用メール ${esc(x.email||'')}`,`dev:${x.user_id}`,x.pw)).join('')||'<tr><td class="muted" colspan="3">POS・タイムカードの端末がありません</td></tr>'}
    ${(d.cs||[]).map(x=>row(esc(CS_KIND[x.kind]||x.kind),'',`cs:${x.kind}`,x.pw)).join('')}
    ${(d.accounts||[]).map(x=>row(`管理サイト：${esc(x.login_id)}`,esc(x.name)+(x.is_owner&&x.name!=='オーナー'?'（オーナー）':'')+(x.is_active?'':'（止めている）'),x.login_id===me.login_id?'own:':`acc:${x.id}`,x.pw)).join('')}
  </table></div>`;
  $('main').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{ const v=b.previousElementSibling; const on=b.textContent==='見る'; v.textContent=on?v.dataset.pwv:'••••••••'; b.textContent=on?'隠す':'見る'; });
  $('main').insertAdjacentHTML('beforeend','<div class="card" id="tcBox"><h2>タイムカードの端末</h2><div class="muted">読み込み中…</div></div>'); tcCard();
  if(O) $('rotAll').onclick=guard($('rotAll'),()=>rotateAll());
  $('main').querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{ if(b.dataset.pw==='own:'){ $('myPw1').focus(); window.scrollTo(0,0); return; } changeOne(b.dataset.pw,b.dataset.label); });
};
function bindOwn(){ $('mySave').onclick=guard($('mySave'),async()=>{
  const a=$('myPw1').value, b=$('myPw2').value;
  if(a.length<8){ await uiAlert('パスワードは8文字以上にしてください'); return; }
  if(a!==b){ await uiAlert('2つのパスワードが違います'); return; }
  const r=await rpc('admin_set_own_pw',{p_pw:a}); if(!r.ok) return;
  $('myPw1').value=''; $('myPw2').value=''; toast('パスワードを変えました'); if(page==='pw') PAGES.pw(); }); }
async function changeOne(key,label){
  const [kind,id]=[key.slice(0,key.indexOf(':')),key.slice(key.indexOf(':')+1)];
  const m=modal(`<h2 style="margin:0">パスワードを変える</h2><div>${esc(label)}</div>
    <label>新しいパスワード（8文字以上）<input data-k="pw" autocapitalize="off" spellcheck="false"></label>
    <div class="muted" style="font-size:14px">${kind==='acc'?'このIDでログインしている分はログアウトされます':'この端末・サイトでログインしている分は全部ログアウトされます'}</div>
    <div class="bar"><button class="ghost" data-k="gen">自動で作る</button><button class="ghost" data-k="no">キャンセル</button><button class="primary" data-k="ok">変える</button></div>`);
  const q=k=>m.querySelector(`[data-k=${k}]`);
  q('gen').onclick=()=>{ q('pw').value=genPw(10); };
  q('no').onclick=()=>m.remove();
  q('ok').onclick=guard(q('ok'),async()=>{ const pw=q('pw').value;
    if(pw.length<8){ await uiAlert('パスワードは8文字以上にしてください'); return; }
    const r= kind==='dev'?await rpc('admin_set_device_pw',{p_user:id,p_pw:pw})
           : kind==='cs'?await rpc('admin_set_cs_pw',{p_store:storeId,p_kind:id,p_pw:pw})
           : await rpc('admin_set_account_pw',{p_id:id,p_pw:pw});
    if(!r.ok) return; m.remove(); toast('変えました'); PAGES.pw(); });
}

start();
</script>
