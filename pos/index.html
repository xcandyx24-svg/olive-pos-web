<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OLIVE 会計</title><!-- v5 -->
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--acc:#3f9d5a;--warn:#d9534f;--gold:#e0a32a;--blue:#3b82f6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
  header .store{font-weight:700;font-size:18px}
  header .clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:18px}
  main{flex:1;overflow:auto;padding:16px 20px}
  .view{display:none}.view.on{display:block}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:#eee;color:var(--ink)}
  button.primary{background:var(--blue);color:#fff}button.ok{background:var(--acc);color:#fff}
  button.danger{background:var(--warn);color:#fff}button.gold{background:var(--gold);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line)}button.sm{padding:6px 10px;font-size:13px}
  button.on{background:var(--ink);color:#fff}
  input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .tbl{background:#dfe7f5;border-radius:14px;min-height:150px;padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:center;cursor:pointer;border:2px solid transparent}
  .tbl .name{font-weight:700;font-size:16px}.tbl .empty{font-size:26px;color:#3a4a6b;margin-top:10px}
  .tbl.busy{background:#f3dfa0;text-align:left;justify-content:flex-start;gap:4px}.tbl.busy.over{border-color:var(--warn)}
  .tbl .row{display:flex;justify-content:space-between;font-size:14px}.tbl .total{font-size:22px;font-weight:700;text-align:right}.tbl .casts{font-size:13px;color:#444}
  .alert{background:#fde8e8;color:#9b1c1c;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .cols{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px}
  h2{margin:0 0 10px;font-size:15px;color:var(--muted)}
  .list{display:flex;flex-direction:column;gap:6px}
  .item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#fafafa;border:1px solid var(--line)}
  .item .n{flex:1}.item .amt{font-variant-numeric:tabular-nums;min-width:90px;text-align:right}.item small{color:var(--muted)}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--gold);color:#fff}.badge.k{background:var(--ink)}
  .totals{display:grid;grid-template-columns:auto auto;gap:4px 20px;font-variant-numeric:tabular-nums;justify-content:end}.totals .big{font-size:28px;font-weight:800}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 14px;border-radius:999px;background:#eee;font-size:15px}.chip.on{background:var(--ink);color:#fff}
  .prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .prod{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;min-height:64px}.prod .p{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  .num{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:700}.num button{width:40px;height:40px;border-radius:50%;font-size:22px;padding:0}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30}.modal.on{display:flex}
  .modal .box{background:#fff;border-radius:16px;padding:18px;width:min(760px,92vw);max-height:88vh;overflow:auto}
  table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}table.t input{width:100%}table.t input.n{width:110px;text-align:right}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:40}.toast.on{display:block}
  .login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
  .login form{width:360px;background:#fff;padding:32px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .hidden{display:none!important}.muted{color:var(--muted)}.right{text-align:right}
  .settings{display:grid;grid-template-columns:170px 1fr 1.2fr;gap:12px;min-height:70vh}.settings .menu{display:flex;flex-direction:column;gap:6px}.settings .menu button{text-align:left}
  .lst{display:flex;flex-direction:column;gap:6px}.lst .row{display:flex;align-items:center;gap:8px;padding:12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:16px;user-select:none;-webkit-user-select:none}
  .lst .row.on{background:#e8eefb;border-color:var(--blue)}.lst .row .nm{flex:1}.lst .row .hd{color:#aaa;font-size:20px;padding:0 6px;touch-action:none}.lst .row.drag{opacity:.4}
  .form{display:flex;flex-direction:column;gap:10px}.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.form input,.form select{font-size:16px}
  .form .sw{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}.form .sw input{width:22px;height:22px}

  header{background:#3a3a3a;color:#fff;padding:8px 16px;gap:10px}
  header .store{background:#7a6a4a;color:#fff;padding:10px 40px;border-radius:10px;font-size:20px}
  header .dt{background:#7a6a4a;color:#fff;padding:6px 12px;border-radius:10px;text-align:center;line-height:1.2;font-variant-numeric:tabular-nums}
  header .dt small{display:block;font-size:12px}
  header .nav{margin-left:auto;display:flex;gap:8px}
  header .nav button{position:relative;background:#c9b37a;color:#fff;font-weight:700;padding:10px 14px;border-radius:50%;min-width:74px;height:74px;font-size:14px;line-height:1.1}
  header .nav button.on{background:#a08a4f}
  header .nav .bd{position:absolute;top:-4px;right:-4px;background:#d9534f;color:#fff;border-radius:999px;font-size:12px;padding:2px 7px;font-weight:700}
  header .menuBtn{background:#c9b37a;color:#fff;border-radius:50%;width:74px;height:74px;font-weight:700}
  .tables{grid-template-columns:repeat(5,1fr);gap:16px}
  .tbl{background:linear-gradient(#a9c3f0,#5f86d9);color:#1a1a1a;border:2px solid #4a6fb8;min-height:170px}
  .tbl .empty{color:#1a2a4a;font-size:28px;font-weight:600}
  .tbl.busy{background:linear-gradient(#f5e6b0,#c9a94f);border-color:#a08a4f}
  .tbl.busy .pill{background:rgba(255,255,255,.55);border-radius:999px;text-align:center;padding:2px 8px;font-size:14px;margin:4px 0}
  .tbl.busy .casts{background:rgba(120,90,30,.35);border-radius:8px;padding:4px 8px;margin-top:auto;color:#222}
  .tbl.busy.over{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
  .tbl.busy.oki{background:linear-gradient(#e8e8e8,#bdbdbd);border-color:#999}
  .rlist{display:flex;flex-direction:column;gap:8px}
  .rrow{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:20px;user-select:none;-webkit-user-select:none}
  .rrow .nm{flex:1}.rrow .hd{color:#aaa;font-size:24px;padding:0 6px;touch-action:none}.rrow.drag{opacity:.4}.rrow.inactive{opacity:.5}
  .pillbtn{border-radius:999px;padding:12px 22px;font-weight:700}.pillbtn.brown{background:#7a5a2a;color:#fff}.pillbtn.gray{background:#ccc;color:#666}
</style>
</head>
<body>
<div class="login" id="login"><form id="loginForm">
  <h1 style="margin:0;font-size:20px">店舗端末ログイン</h1>
  <input id="email" type="email" placeholder="端末メールアドレス" required><input id="pw" type="password" placeholder="パスワード" required>
  <button class="primary" type="submit">ログイン</button><div id="loginErr" style="color:var(--warn);font-size:14px;min-height:18px"></div>
</form></div>

<header>
  <button class="menuBtn" id="navTop">メニュー</button>
  <div class="store" id="storeName">—</div>
  <div class="dt"><small id="hdDate">—</small><span id="clock">--:--</span></div>
  <nav class="nav">
    <button id="navHall">ホール<br>状況<span class="bd" id="bdHall">0</span></button>
    <button id="navOrder">注文</button>
    <button id="navCasts">在籍<br>キャスト<span class="bd" id="bdCasts">0</span></button>
    <button id="navSettings">設定</button>
    <button id="navTop2">トップ</button>
  </nav>
</header>

<main>
<section class="view on" id="v-hall"><div id="alerts"></div><div class="tables" id="tables"></div></section>

<section class="view" id="v-bill"><div class="card">
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <b id="bTable" style="font-size:20px"></b><span id="bTime" class="muted"></span>
    <span>客数 <span class="num"><button id="gMinus">−</button><span id="bGuests">1</span><button id="gPlus">＋</button></span></span>
    <span class="chips" id="modeChips" style="margin-left:auto"></span>
  </div>
  <div class="cols" style="margin-top:12px">
    <div><h2>お客様</h2><div class="list" id="bCust"></div><button class="ghost sm" id="custAddBtn" style="margin-top:6px">＋ お客様</button>
      <h2 style="margin-top:14px">キャスト</h2><div class="list" id="bCasts"></div><button class="ghost sm" id="castAddBtn" style="margin-top:6px">＋ キャスト</button></div>
    <div><h2>セット・延長</h2><div class="list" id="bSet"></div><button class="ghost sm" id="extAdd" style="margin-top:6px">＋ 延長を手動追加</button></div>
    <div><h2>注文</h2><div class="list" id="bItems"></div></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:end;margin-top:12px;flex-wrap:wrap;gap:12px">
    <div class="totals" id="bTotals"></div>
    <div class="bar"><button class="ghost" id="bBack">ホールへ</button><button class="danger" id="bVoid">伝票取消</button><button class="primary" id="bOrder">注文</button><button class="gold" id="bPay">会計</button></div>
  </div>
</div></section>

<section class="view" id="v-order"><div class="card">
  <div class="chips" id="catChips"></div><div class="prodgrid" id="prodGrid" style="margin-top:12px"></div>
  <div class="bar"><button class="ghost" id="orderBack">伝票へ戻る</button></div>
</div></section>

<section class="view" id="v-pay"><div class="card">
  <h2>会計：<span id="pTable"></span></h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="totals" id="pTotals"></div>
    <div><div class="chips" id="payMethods"></div>
      <input id="payAmount" type="number" placeholder="金額" style="width:100%;font-size:24px;text-align:right;margin-top:10px">
      <div class="bar"><button id="payAdjDiscount">値引</button><button id="payAdjSurcharge">値増</button><button class="ok" id="payAdd" style="margin-left:auto">入金</button></div>
      <div class="list" id="payList" style="margin-top:10px"></div></div>
  </div>
  <div class="bar"><button class="ghost" id="payBack">伝票へ戻る</button><button class="primary" id="payClose">会計を締める</button></div>
</div></section>

<section class="view" id="v-casts"><div class="card">
  <div class="bar" style="margin:0 0 12px">
    <button class="pillbtn brown" id="cTabToday">出勤リスト <span id="cTodayN"></span></button>
    <button class="pillbtn brown" id="cSort">並べ替え</button>
    <button class="pillbtn brown" id="cNew">新規登録</button>
    <button class="pillbtn gray" id="cShowInactive">削除表示</button>
    <input id="cSearch" placeholder="キャスト検索" style="flex:1;font-size:18px">
    <button class="sm" id="cTabAll">名前順</button>
  </div>
  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px">
    <div class="rlist" id="cList"></div>
    <div><h2>詳細</h2><div class="form" id="cForm"><div class="muted">一覧の「編集」を押してください</div></div></div>
  </div>
</div></section>

<section class="view" id="v-top"><div class="card">
  <h2>トップ</h2>
  <div class="bar"><button class="primary" id="topHall">ホール状況へ</button><button class="ghost" id="topLogout">ログアウト</button></div>
  <div class="muted" style="margin-top:12px">売上済伝票一覧・データ確認は管理画面（段階3）で作ります</div>
</div></section>

<section class="view" id="v-settings"><div class="card settings">
  <div class="menu" id="setMenu"></div>
  <div><div class="bar" style="margin:0 0 10px"><button class="ok sm" id="setAdd">追加</button><input id="setFilter" placeholder="検索" style="flex:1"><button class="sm" id="setEdit">編集</button></div><div class="lst" id="setList"></div></div>
  <div><h2>詳細</h2><div class="form" id="setForm"><div class="muted">左の一覧から選ぶか「追加」</div></div></div>
</div></section>
</main>

<div class="modal" id="custModal"><div class="box" style="width:520px">
  <h2 style="color:var(--ink)">お客様を追加</h2>
  <div style="display:flex;gap:8px"><input id="custSearch" placeholder="名前で検索" style="flex:1"><button id="custNew">新規登録</button></div>
  <div class="chips" id="custList" style="margin-top:10px"></div>
  <div class="bar"><button class="ghost" id="custCancel" style="margin-left:auto">閉じる</button></div>
</div></div>

<div class="modal" id="castModal"><div class="box" style="width:600px">
  <h2 style="color:var(--ink)">キャストを追加（本日出勤している人）</h2>
  <div class="chips" id="castList"></div>
  <div class="muted" style="margin-top:8px">同伴①②は打刻時刻から自動判定。係は追加後に「係にする」で指定</div>
  <div class="bar"><button class="ghost" id="castCancel" style="margin-left:auto">閉じる</button></div>
</div></div>

<div class="modal" id="splitModal"><div class="box">
  <h2 style="color:var(--ink)">振り分け：<span id="splitName"></span></h2><div class="muted" id="splitBase"></div>
  <table class="t" id="splitTable"></table>
  <div class="bar"><button id="splitEven">均等</button><button class="ghost" id="splitCancel" style="margin-left:auto">戻る</button><button class="primary" id="splitOk">確定</button></div>
</div></div>

<div class="modal" id="fixedModal"><div class="box" style="width:380px">
  <h2 style="color:var(--ink)">総額指定</h2><input id="fixedAmount" type="number" placeholder="お客様への請求総額" style="width:100%;font-size:24px;text-align:right">
  <div class="bar"><button class="ghost" id="fixedCancel">戻る</button><button class="primary" id="fixedOk" style="margin-left:auto">適用</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://gjqaxenwvvazhjtziusf.supabase.co', SUPABASE_KEY='sb_publishable_pPfJUvJd6iJeHBNiD7XkWA_2RKF7JYw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const yen = n => (n ?? 0).toLocaleString('ja-JP') + '円';
const hm = t => { const d=new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const ROLE = { douhan1:'同伴①', douhan2:'同伴②', none:'' };
const METHOD = { cash:'現金', card:'カード', invoice:'請求書', oki:'置き' };
let store, settings, modes=[], tables=[], categories=[], products=[], staff=[], customers=[], openBills=[], cur=null, payMethod='cash';
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }
function show(v){ document.querySelectorAll('.view').forEach(x=>x.classList.remove('on')); $(v).classList.add('on'); }
function businessDate(d=new Date()){ const x=new Date(d.getTime()-8*3600*1000); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
setInterval(()=>{ const d=new Date(); $('clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; $('hdDate').textContent=`${d.getMonth()+1}月${d.getDate()}日`; },1000);

$('loginForm').addEventListener('submit', async e => { e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('pw').value });
  if (error) { $('loginErr').textContent='ログインできません：'+error.message; return; } start(); });
async function start(){ const { data:{ session } } = await sb.auth.getSession(); if (!session) return;
  $('login').classList.add('hidden'); await loadMasters(); await loadHall(); setInterval(loadHall,60000); show('v-hall'); }

async function loadMasters(){
  const [s,st,pm,tb,ca,pr,sf,cu] = await Promise.all([
    sb.from('stores').select('id,name').limit(1), sb.from('pos_settings').select('*').limit(1),
    sb.from('pricing_modes').select('*').eq('is_active',true).order('sort_order'), sb.from('tables').select('*').order('sort_order'),
    sb.from('categories').select('*').order('sort_order'), sb.from('products').select('*').order('sort_order'),
    sb.from('staff').select('id,display_name,kind').eq('is_active',true).order('sort_order'), sb.from('customers').select('id,name,memo').order('name')]);
  store=s.data?.[0]; settings=st.data?.[0]; modes=pm.data||[]; tables=tb.data||[]; categories=ca.data||[]; products=pr.data||[]; staff=sf.data||[]; customers=cu.data||[];
  $('storeName').textContent = store?.name || '店舗未設定';
}

// ---------- hall ----------
async function loadHall(){
  const { data, error } = await sb.from('bills').select('*, bill_casts(staff_id,role,is_kakari), bill_extensions(minutes,unit_price,qty,is_auto)').eq('status','open');
  if (error) { toast(error.message); return; }
  openBills = data||[]; await autoExtend(); await loadOki();
  const totals={}; await Promise.all(openBills.map(async b=>{ const r=await sb.rpc('calc_bill',{p_bill:b.id}); totals[b.id]=r.data; }));
  renderHall(totals);
}
function billEnd(b){ const ext=(b.bill_extensions||[]).reduce((a,e)=>a+e.minutes,0); return new Date(new Date(b.set_start).getTime()+(b.set_minutes+ext)*60000); }
async function autoExtend(){ const now=new Date(); let added=false;
  for (const b of openBills) { const mode=modes.find(m=>m.id===b.pricing_mode_id); if (mode && !mode.include_set) continue;
    let end=billEnd(b);
    while (end<now) { const { error } = await sb.from('bill_extensions').insert({ bill_id:b.id, minutes:settings.ext_minutes, unit_price:settings.ext_unit_price, qty:b.guest_count, is_auto:true });
      if (error) break; b.bill_extensions=[...(b.bill_extensions||[]),{minutes:settings.ext_minutes,unit_price:settings.ext_unit_price,qty:b.guest_count,is_auto:true}]; end=billEnd(b); added=true; } }
  if (added) toast('セット時間を過ぎた卓に延長を追加しました'); }
let okiBills=[];
async function loadOki(){ const { data } = await sb.from('bills').select('id,memo,guest_count,set_start,business_date,bill_casts(staff_id,is_kakari),payments(method,amount,received_at)').eq('status','closed').or('method.eq.oki,method.eq.invoice',{foreignTable:'payments'});
  okiBills=(data||[]).filter(b=>(b.payments||[]).some(p=>(p.method==='oki'||p.method==='invoice')&&!p.received_at)); }
function renderHall(totals){ const now=new Date();
  const al=openBills.filter(b=>(billEnd(b)-now)<10*60000);
  $('alerts').innerHTML = al.length ? `<div class="alert">⏰ 残り10分未満：${al.map(b=>tables.find(t=>t.id===b.table_id)?.name||'?').join('、')}</div>` : '';
  $('bdHall').textContent=openBills.length;
  $('tables').innerHTML='';
  for (const t of tables.filter(t=>t.is_visible)) { const b=openBills.find(x=>x.table_id===t.id); const el=document.createElement('div');
    if (!b) { el.className='tbl'; el.innerHTML=`<div class="name">${t.name}</div><div class="empty">空 席</div>`; el.onclick=()=>createBill(t); }
    else { const end=billEnd(b), remain=Math.round((end-now)/60000); el.className='tbl busy'+(remain<10?' over':'');
      const k=(b.bill_casts||[]).find(c=>c.is_kakari); const kn=k?staff.find(s=>s.id===k.staff_id)?.display_name:'';
      el.innerHTML=`<div class="name">${t.name}</div><div class="row"><span>👤 ${b.guest_count}</span><span>残り ${remain<0?'-':''}${Math.abs(remain).toLocaleString()}分</span></div><div class="pill">${hm(b.set_start)}〜${hm(end)}</div><div class="total">${yen(totals[b.id]?.amount_due)}</div><div class="casts">${kn?'☑ '+kn:''}</div>`;

  await sb.from('bill_item_splits').delete().eq('bill_item_id',splitItem.id); if(rows.length) await sb.from('bill_item_splits').insert(rows); $('splitModal').classList.remove('on'); openBill(cur.id); };

// ---------- pay ----------
function renderPay(){ const b=cur,T=b.totals; $('pTable').textContent=tables.find(x=>x.id===b.table_id)?.name||'';
  $('pTotals').innerHTML=`<span>請求額</span><span class="right big">${yen(T.amount_due)}</span><span>入金済</span><span class="right">${yen(T.paid)}</span><span>未収</span><span class="right big">${yen(T.unpaid)}</span>`;
  $('payMethods').innerHTML=Object.entries(METHOD).map(([k,v])=>`<button class="chip ${payMethod===k?'on':''}" data-m="${k}">${v}</button>`).join('');
  $('payMethods').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{payMethod=c.dataset.m;renderPay();});
  $('payAmount').value=T.unpaid>0?T.unpaid:'';
  $('payList').innerHTML=[...(b.payments||[]).map(p=>`<div class="item"><span class="n">${METHOD[p.method]}</span><span class="amt">${yen(p.amount)}</span></div>`),...(b.bill_adjustments||[]).map(a=>`<div class="item"><span class="n">${a.kind==='discount'?'値引':'値増'} <small>${a.reason||''}</small></span><span class="amt">${yen(a.amount)}</span><button class="ghost sm" data-adj="${a.id}">×</button></div>`)].join('');
  $('payList').querySelectorAll('[data-adj]').forEach(x=>x.onclick=async()=>{ await sb.from('bill_adjustments').delete().eq('id',x.dataset.adj); await openBill(cur.id); renderPay(); show('v-pay'); }); }
async function addAdj(kind){ const v=parseInt($('payAmount').value||'0',10); if(!v){toast('金額を入力してください');return;} await sb.from('bill_adjustments').insert({bill_id:cur.id,kind,amount:v}); await openBill(cur.id); renderPay(); show('v-pay'); }
$('payAdjDiscount').onclick=()=>addAdj('discount'); $('payAdjSurcharge').onclick=()=>addAdj('surcharge');
$('payAdd').onclick=async()=>{ const v=parseInt($('payAmount').value||'0',10); if(!v){toast('金額を入力してください');return;}
  const { error } = await sb.from('payments').insert({bill_id:cur.id,method:payMethod,amount:v,revenue_date:cur.business_date,received_at:(payMethod==='cash'||payMethod==='card')?new Date().toISOString():null});
  if(error){toast(error.message);return;} await openBill(cur.id); renderPay(); show('v-pay'); };
$('payBack').onclick=()=>openBill(cur.id);
$('payClose').onclick=async()=>{ if(cur.totals.unpaid>0){toast(`未収 ${yen(cur.totals.unpaid)} があります。請求書か置きで登録してください`);return;}
  await sb.from('bills').update({status:'closed',closed_at:new Date().toISOString(),set_end:billEnd(cur).toISOString()}).eq('id',cur.id); toast('会計を締めました'); loadHall(); show('v-hall'); };

// ---------- settings（d-system風：一覧＋詳細、編集モードで長押し並び替え・削除） ----------
const SET = [
  { key:'tables', name:'テーブル', table:'tables', label:r=>r.name, cols:[['name','テーブル名','text'],['is_visible','表示','bool']], newRow:()=>({store_id:store.id,name:'新しいテーブル',is_visible:true}) },
  { key:'categories', name:'カテゴリー', table:'categories', label:r=>r.name, cols:[['name','カテゴリー名','text'],['short_name','略称','text'],['is_visible','表示','bool'],['is_industry_target','同業者モードの対象','bool']], newRow:()=>({store_id:store.id,name:'新しいカテゴリー',is_visible:true,is_industry_target:false}) },
  { key:'products', name:'メニュー', table:'products', label:r=>`${r.name}`, sub:r=>yen(r.price), cols:[['name','メニュー名','text'],['short_name','略称','text'],['category_id','カテゴリー','cat'],['price','販売価格（税抜）','number'],['cast_subtotal_price','小計価格（係小計に入る額）','number'],['back_amount','バック金額','number'],['back_points','バックポイント','number'],['is_service_target','サービス料の対象','bool'],['is_keepable','キープ可','bool'],['in_stock','在庫あり','bool'],['is_visible','表示','bool']], newRow:()=>({store_id:store.id,name:'新メニュー',category_id:categories[0]?.id,price:0,cast_subtotal_price:0,back_amount:0,back_points:0,is_service_target:true,is_keepable:false,in_stock:true,is_visible:true}) },
  { key:'customers', name:'お客様情報', table:'customers', label:r=>r.name, cols:[['name','お客様名','text'],['memo','メモ','text']], newRow:()=>({store_id:store.id,name:'新しいお客様',memo:''}), nosort:true },
  { key:'pos', name:'料金設定', table:'pos_settings', single:true, cols:[['set_minutes','最初のセット時間（分）','number'],['set_unit_price','セット1名単価','number'],['ext_minutes','延長単位（分）','number'],['ext_unit_price','延長1名単価','number'],['service_rate','サービス料率 %','number'],['tax_rate','消費税率 %','number'],['total_round_unit','合計の切り上げ単位','number']] },
];
let setCur='tables', setSel=null, setEditMode=false, setCatFilter=null;
$('navSettings').onclick=()=>{ renderSettings(setCur); show('v-settings'); };
function setRows(def){ if(def.single) return [settings]; let r=({tables,categories,products,customers})[def.key]; if(def.key==='products'&&setCatFilter) r=r.filter(p=>p.category_id===setCatFilter); return r; }
async function renderSettings(key, keepSel){ if(key!==setCur){ setSel=null; setEditMode=false; setCatFilter=null; } setCur=key; await loadMasters(); const def=SET.find(s=>s.key===key);
  $('setMenu').innerHTML=SET.map(s=>`<button class="${s.key===key?'on':''}" data-k="${s.key}">${s.name}</button>`).join('');
  $('setMenu').querySelectorAll('button').forEach(b=>b.onclick=()=>renderSettings(b.dataset.k));
  $('setAdd').style.display=def.single?'none':''; $('setEdit').style.display=(def.single||def.nosort)?'none':''; $('setEdit').textContent=setEditMode?'完了':'編集'; $('setEdit').classList.toggle('on',setEditMode);
  $('setFilter').style.display=def.single?'none':'';
  if (def.single) { $('setList').innerHTML=''; setSel=settings; renderForm(def); return; }
  const rows=setRows(def);
  let head='';
  if (key==='products') head=`<select id="setCat" style="margin-bottom:6px"><option value="">--- すべて ---</option>${categories.map(c=>`<option value="${c.id}" ${setCatFilter===c.id?'selected':''}>${c.name}</option>`).join('')}</select>`;
  $('setList').innerHTML=head+rows.map(r=>`<div class="row ${setSel?.id===r.id?'on':''}" data-id="${r.id}">${setEditMode?`<button class="danger sm" data-del="${r.id}">削除</button>`:''}<span class="nm">${def.label(r)}${def.sub?` <small class="muted">${def.sub(r)}</small>`:''}${r.is_visible===false?' <small class="muted">（非表示）</small>':''}</span>${setEditMode&&!def.nosort?'<span class="hd">≡</span>':''}</div>`).join('');
  if (key==='products') $('setCat').onchange=e=>{ setCatFilter=e.target.value||null; renderSettings(key,true); };
  $('setList').querySelectorAll('.row').forEach(row=>{ row.onclick=e=>{ if(e.target.dataset.del||e.target.classList.contains('hd'))return; setSel=rows.find(r=>r.id===row.dataset.id); renderSettings(key,true); }; });
  $('setList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const r=rows.find(x=>x.id===b.dataset.del); if(!confirm(`「${def.label(r)}」を削除しますか？`))return;
    const { error } = await sb.from(def.table).delete().eq('id',b.dataset.del); if(error){ toast('使用中のため削除できません。非表示にしてください'); return; } setSel=null; renderSettings(key,true); });
  if (setEditMode && !def.nosort) enableDrag(def);
  renderForm(def);
}
function renderForm(def){ const r=setSel; const f=$('setForm');
  if(!r){ f.innerHTML='<div class="muted">左の一覧から選ぶか「追加」</div>'; return; }
  f.innerHTML=def.cols.map(([k,label,type])=>{
    if(type==='bool') return `<label class="sw"><input type="checkbox" data-k="${k}" ${r[k]?'checked':''}>${label}</label>`;
    if(type==='cat') return `<label>${label}<select data-k="${k}">${categories.map(c=>`<option value="${c.id}" ${r[k]===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label>`;
    return `<label>${label}<input type="${type}" data-k="${k}" value="${r[k]??''}"></label>`; }).join('')+`<div class="bar"><button class="primary" id="setSave">保存</button></div>`;
  $('setSave').onclick=async()=>{ const o={}; def.cols.forEach(([k,,type])=>{ const el=f.querySelector(`[data-k="${k}"]`); o[k]=type==='bool'?el.checked:type==='number'?Number(el.value||0):el.value; });
    const q = def.single ? sb.from('pos_settings').update(o).eq('store_id',settings.store_id) : sb.from(def.table).update(o).eq('id',r.id);
    const { error } = await q; toast(error?error.message:'保存しました'); if(!error) renderSettings(def.key,true); };
}
$('setAdd').onclick=async()=>{ const def=SET.find(s=>s.key===setCur); const rows=setRows(def); const row=def.newRow(); if(!def.nosort) row.sort_order=(Math.max(0,...rows.map(r=>r.sort_order||0))+1); if(def.key==='products'&&setCatFilter) row.category_id=setCatFilter;
  const { data, error } = await sb.from(def.table).insert(row).select().single(); if(error){toast(error.message);return;} setSel=data; renderSettings(setCur,true); };
$('setEdit').onclick=()=>{ setEditMode=!setEditMode; renderSettings(setCur,true); };
$('setFilter').oninput=e=>{ const q=e.target.value.trim(); $('setList').querySelectorAll('.row').forEach(r=>{ r.style.display=!q||r.textContent.includes(q)?'':'none'; }); };
// 長押しドラッグ並び替え
function enableDrag(def){ const list=$('setList'); let dragging=null, timer=null;
  list.querySelectorAll('.row').forEach(row=>{ const h=row.querySelector('.hd'); if(!h)return;
    h.onpointerdown=e=>{ e.preventDefault(); timer=setTimeout(()=>{ dragging=row; row.classList.add('drag'); },150); h.setPointerCapture(e.pointerId); };
    h.onpointermove=e=>{ if(!dragging)return; const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.row'); if(!el||el===dragging||el.parentElement!==list)return; const rect=el.getBoundingClientRect(); if(e.clientY<rect.top+rect.height/2) list.insertBefore(dragging,el); else list.insertBefore(dragging,el.nextSibling); };
    h.onpointerup=async e=>{ clearTimeout(timer); if(!dragging)return; dragging.classList.remove('drag'); dragging=null;
      const ids=[...list.querySelectorAll('.row')].map(r=>r.dataset.id); await Promise.all(ids.map((id,i)=>sb.from(def.table).update({sort_order:(i+1)*10}).eq('id',id))); toast('並び順を保存しました'); renderSettings(def.key,true); };
    h.onpointercancel=()=>{ clearTimeout(timer); if(dragging){dragging.classList.remove('drag');dragging=null;} }; }); }

start();
</script>
