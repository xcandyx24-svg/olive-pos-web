<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OLIVE 会計</title><!-- v10.41 -->
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1a1a1a;--muted:#7a7a7a;--line:#e3e1dc;--acc:#3f9d5a;--warn:#d9534f;--gold:#e0a32a;--blue:#3b82f6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
  header .store{font-weight:700;font-size:18px}
  header .clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:18px}
  main{flex:1;overflow:auto;padding:16px 20px}
  .view{display:none}.view.on{display:block}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:#eee;color:var(--ink)}
  button.primary{background:var(--blue);color:#fff}button.ok{background:var(--acc);color:#fff}
  button.danger{background:var(--warn);color:#fff}button.gold{background:var(--gold);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line)}button.sm{padding:6px 10px;font-size:13px}
  button.on{background:var(--ink);color:#fff}
  input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .tbl{background:#dfe7f5;border-radius:14px;min-height:150px;padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:center;cursor:pointer;border:2px solid transparent}
  .tbl .name{font-weight:700;font-size:16px}.tbl .empty{font-size:26px;color:#3a4a6b;margin-top:10px}
  .tbl.busy{background:#f3dfa0;text-align:left;justify-content:flex-start;gap:4px}.tbl.busy.over{border-color:var(--warn)}
  .tbl .row{display:flex;justify-content:space-between;font-size:14px}.tbl .total{font-size:22px;font-weight:700;text-align:right}.tbl .casts{font-size:13px;color:#444}
  .alert{background:#fde8e8;color:#9b1c1c;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .cols{display:grid;grid-template-columns:.85fr .9fr .95fr 1.1fr;gap:12px}
  .item.cast{flex-direction:row;align-items:center;gap:6px}.item.cast .n{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px;font-weight:700}.item.cast .nm{white-space:nowrap}.badge{white-space:nowrap}.item.cast .btns{display:flex;gap:6px}.item.cast .btns button{flex:1;padding-left:6px;padding-right:6px;white-space:nowrap}.item.cast .btns button[data-rmcast]{flex:none}
  h2{margin:0 0 10px;font-size:15px;color:var(--muted)}
  .cols>div,#bOrders>div{min-width:0}.cols .item{flex-wrap:wrap}.cols .item .n{flex:1 1 90px;min-width:0;overflow-wrap:anywhere}#bCust .item .n{flex:1 1 40px}.tbl .cust{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cols .item.cast .n{flex:1 1 0;min-width:0}
  button:disabled{opacity:.4;cursor:not-allowed}
  .pillbtn.brown.on{background:#3a2a10;box-shadow:0 0 0 3px #e0c98a}
  .list{display:flex;flex-direction:column;gap:6px}
  .item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#fafafa;border:1px solid var(--line)}
  .item .n{flex:1}.item .amt{font-variant-numeric:tabular-nums;min-width:90px;text-align:right}.item small{color:var(--muted)}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--gold);color:#fff}.badge.k{background:var(--ink)}
  .totals{display:grid;grid-template-columns:auto auto;gap:4px 20px;font-variant-numeric:tabular-nums;justify-content:end}.totals .big{font-size:28px;font-weight:800}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 14px;border-radius:999px;background:#eee;font-size:15px}.chip.on{background:var(--ink);color:#fff}
  .prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .ord4{display:grid;grid-template-columns:minmax(150px,1fr) minmax(200px,1.3fr) minmax(170px,1.2fr) minmax(170px,1.1fr);gap:10px;height:calc(100vh - 170px);min-height:420px}
  .ord4 .col{min-width:0;border:1px solid var(--line);border-radius:10px;background:#fafafa;display:flex;flex-direction:column;min-height:0}
  .ord4 .col h3{margin:0;padding:8px 10px;font-size:14px;border-bottom:1px solid var(--line);background:#f0f0f0;border-radius:10px 10px 0 0}
  .ord4 .body{overflow:auto;padding:8px;flex:1;display:flex;flex-direction:column;gap:6px}
  .ord4 .ocat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:12px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);text-align:left;font-size:15px}.ord4 .ocat.on{background:var(--ink);color:#fff}
  .ord4 .oprod{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);text-align:left;font-size:15px}
  .ord4 .oprod .pb{background:#eee;border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
  .ord4 .ocast{padding:11px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);text-align:left;font-size:15px}.ord4 .ocast.on{background:#1b7f3b;color:#fff;border-color:#1b7f3b}.ord4 .ocgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ord4 .oline{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.ord4 .oline.sel{border:2px solid var(--ink)}
  .ord4 .oline .r1{display:flex;justify-content:space-between;align-items:center;gap:6px}.ord4 .oline small{color:var(--muted)}.ord4 .oline small.none{color:#c0392b}
  .ord4 .qty{display:flex;align-items:center;gap:6px}.ord4 .qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px}
  .prod{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;min-height:64px}.prod .p{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  .num{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:700}.num button{width:40px;height:40px;border-radius:50%;font-size:22px;padding:0}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30}.modal.on{display:flex}
  .modal .box{background:#fff;border-radius:16px;padding:18px;width:min(760px,92vw);max-height:88vh;overflow:auto}
  table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}table.t input{width:100%}table.t input.n{width:110px;text-align:right}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:40}.toast.on{display:block}
  .login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
  .login form{width:360px;background:#fff;padding:32px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .hidden{display:none!important}.muted{color:var(--muted)}.right{text-align:right}
  .badge.warnb{background:var(--warn)}.badge.gray{background:#999}.badge.tag{background:#5a7d9a}
  .cast-line{display:flex;align-items:center;gap:8px;padding:4px 0 4px 12px;font-size:15px}
  .kindbtn{padding:10px 14px;border-radius:10px;background:#eee}.kindbtn.on{background:var(--ink);color:#fff}
  .tbl .tags{font-size:13px;color:#5a7d9a}
  @media print{ body>*{display:none!important} #printArea{display:block!important;font-family:"Hiragino Sans",sans-serif;font-size:13px;width:72mm} }
  #printArea{display:none}
  .settings{display:grid;grid-template-columns:170px 1fr 1.2fr;gap:12px;min-height:70vh}.settings .menu{display:flex;flex-direction:column;gap:6px}.settings .menu button{text-align:left}
  .lst{display:flex;flex-direction:column;gap:6px}.lst .row{display:flex;align-items:center;gap:8px;padding:12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:16px;user-select:none;-webkit-user-select:none}
  .lst .row.on{background:#e8eefb;border-color:var(--blue);color:var(--ink)}#v-cust .card>div{min-width:0}#cuBtSel{min-width:0}.lst .row .nm{flex:1}.lst .row .hd{color:#aaa;font-size:20px;padding:0 6px;touch-action:none}.lst .row.drag{opacity:.4}
  .form{display:flex;flex-direction:column;gap:10px}.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.form input,.form select{font-size:16px}
  .form .sw{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}.form .sw input{width:22px;height:22px}
  #v-settings .settings{height:calc(100dvh - 150px);min-height:420px}#v-settings .settings>div{min-height:0;overflow-y:auto}#v-settings .settings>div:nth-child(2){display:flex;flex-direction:column;overflow:hidden}#setList{flex:1;overflow-y:auto;min-height:0;padding-bottom:24px}#setCat{position:sticky;top:0;z-index:1;flex:none}.form label.sw{flex-direction:row;align-items:center;font-size:15px;color:var(--ink)}.lst .row small{white-space:nowrap}

  header{background:#3a3a3a;color:#fff;padding:8px 16px;gap:10px}
  header .store{background:#7a6a4a;color:#fff;padding:10px 40px;border-radius:10px;font-size:20px}
  header .dt{background:#7a6a4a;color:#fff;padding:6px 12px;border-radius:10px;text-align:center;line-height:1.2;font-variant-numeric:tabular-nums}
  header .dt small{display:block;font-size:12px}
  header .nav{margin-left:auto;display:flex;gap:8px}
  header .nav button{position:relative;background:#c9b37a;color:#fff;font-weight:700;padding:10px 14px;border-radius:50%;min-width:74px;height:74px;font-size:14px;line-height:1.1}
  header .nav button.on{background:#a08a4f}
  header .nav .bd{position:absolute;top:-4px;right:-4px;background:#d9534f;color:#fff;border-radius:999px;font-size:12px;padding:2px 7px;font-weight:700}
  header .menuBtn{background:#c9b37a;color:#fff;border-radius:50%;width:74px;height:74px;font-weight:700}
  .tables{grid-template-columns:repeat(5,1fr);gap:16px}
  .tbl{background:linear-gradient(#a9c3f0,#5f86d9);color:#1a1a1a;border:2px solid #4a6fb8;min-height:170px}
  .tbl .empty{color:#1a2a4a;font-size:28px;font-weight:600}
  .tbl.busy{background:linear-gradient(#f5e6b0,#c9a94f);border-color:#a08a4f}
  .tbl.busy .pill{background:rgba(255,255,255,.55);border-radius:999px;text-align:center;padding:2px 8px;font-size:14px;margin:4px 0}
  .tbl.busy .casts{background:rgba(120,90,30,.35);border-radius:8px;padding:4px 8px;margin-top:auto;color:#222}
  .tbl.busy.over{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
  .tbl.busy.oki{background:linear-gradient(#e8e8e8,#bdbdbd);border-color:#999}
  .rlist{display:flex;flex-direction:column;gap:8px}
  .rrow{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:20px;user-select:none;-webkit-user-select:none}
  .rrow .nm{flex:1}.rrow .hd{color:#aaa;font-size:24px;padding:0 6px;touch-action:none}.rrow.drag{opacity:.4}.rrow.inactive{opacity:.5}
  .pillbtn{border-radius:999px;padding:12px 22px;font-weight:700}.pillbtn.brown{background:#7a5a2a;color:#fff}.pillbtn.gray{background:#ccc;color:#666}
#splitModal .box{width:min(980px,96vw);max-height:94vh}
#splitTable .sp2{width:28px;border:none}
#splitTable td{padding:4px 6px}
#splitTable select{padding-top:6px;padding-bottom:6px}
</style>
</head>
<body>
<div class="login" id="login"><form id="loginForm">
  <h1 style="margin:0;font-size:20px">店舗端末ログイン</h1>
  <input id="email" type="email" placeholder="端末メールアドレス" autocomplete="username" required><input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" required>
  <button class="primary" type="submit">ログイン</button><div id="loginErr" style="color:var(--warn);font-size:14px;min-height:18px"></div>
</form></div>

<header>
  <div class="store" id="storeName">—</div>
  <div class="dt"><small id="hdDate">—</small><span id="clock">--:--</span></div>
  <nav class="nav">
    <button id="navHall">ホール<br>状況<span class="bd" id="bdHall">0</span></button>
    <button id="navOrder">注文</button>
    <button id="navCasts">在籍<br>キャスト<span class="bd" id="bdCasts">0</span></button>
    <button id="navCust">顧客</button>
    <button id="navSettings">設定</button>
  </nav>
</header>

<main>
<section class="view on" id="v-hall"><div id="alerts"></div><div class="tables" id="tables"></div></section>

<section class="view" id="v-new"><div class="card">
  <div style="background:#555;color:#fff;text-align:center;font-size:22px;padding:12px;border-radius:10px">基本構成：<span id="nTable"></span></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:60px;min-height:46vh;flex-wrap:wrap">
    <button class="ghost" id="nCust" style="font-size:26px;padding:24px 40px">👤 新規</button>
    <span style="display:flex;align-items:center;gap:18px"><span id="nCount" style="font-size:72px;font-weight:700;min-width:110px;text-align:right">0</span>
      <button id="nPlus" style="width:110px;height:110px;border-radius:50%;font-size:56px;background:#f0a83c;color:#fff;padding:0">＋</button>
      <button id="nMinus" style="width:110px;height:110px;border-radius:50%;font-size:56px;background:#e77;color:#fff;padding:0">−</button></span>
  </div>
  <div class="muted" style="text-align:center">人数を入れて「次へ」で伝票が立ち上がります（最大50名）</div>
  <div class="bar" style="justify-content:space-between"><button class="ghost" id="nBack" style="padding:16px 60px;border-radius:999px;background:#bbb;color:#fff;border:none">ホール状況</button><button class="primary" id="nNext" style="padding:16px 80px;border-radius:999px;background:#3b8de0">次　へ</button></div>
</div></section>

<section class="view" id="v-bill"><div class="card">
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <b id="bTable" style="font-size:20px"></b><span id="bTime" class="muted"></span>
    <span>客数 <span class="num"><button id="gMinus">−</button><span id="bGuests">1</span><button id="gPlus">＋</button></span></span><button class="ghost sm" id="gLeave">途中退店</button>
    <span id="bFlags" style="margin-left:auto;display:flex;gap:6px"></span>
  </div>
  <div class="cols" style="margin-top:12px">
    <div><h2>基本構成</h2><div class="list" id="bCust"></div><button class="ghost sm" id="custAddBtn" style="margin-top:6px">＋ お客様</button>
      <div class="list" id="bCasts" style="margin-top:10px"></div><button class="ghost sm" id="castAddBtn" style="margin-top:6px">＋ 係／同伴</button>
      <div class="list" id="bTags" style="margin-top:14px"></div><button class="ghost sm" id="tagBtn" style="margin-top:6px">＋ お預かりタグ</button></div>
    <div><h2>1セット目・延長</h2><div class="list" id="bSet"></div><div class="bar" style="margin-top:6px"><button class="ghost sm" id="extAdd">延長（30分）</button><button class="ghost sm" id="svcBtn">サービス料</button></div></div>
    <div id="bOrders" style="display:contents"><div><h2>ボトル</h2><div class="list" id="bItems"></div></div><div><h2>ドリンク・フード他</h2><div class="list" id="bItems2"></div></div></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:end;margin-top:12px;flex-wrap:wrap;gap:12px">
    <div class="totals" id="bTotals"></div>
    <div class="bar"><button class="ghost" id="bBack">ホールへ</button><button class="ghost sm" id="bVoid" style="color:var(--muted)">伝票取消</button>
      <button class="ghost" id="prEst">概算印刷</button><button class="ghost" id="prBill">会計印刷</button><button class="ghost" id="prDetail">明細印刷</button>
      <button class="primary" id="bOrder">注文</button><button class="gold" id="bPay">会計</button></div>
  </div>
</div></section>

<section class="view" id="v-order"><div class="card">
  <div class="ord4">
    <div class="col"><h3>カテゴリー</h3><div class="body" id="oCats"></div></div>
    <div class="col"><h3>メニュー</h3><div class="body" id="oProds"></div></div>
    <div class="col"><h3>振り分け（バックを付ける人）</h3><div class="body" id="oCasts"></div></div>
    <div class="col"><h3>注文</h3><div class="body" id="oCart"></div><div style="padding:8px"><button class="primary" id="oConfirm" style="width:100%;min-height:52px;font-size:17px">確定</button></div></div>
  </div>
  <div class="bar"><button class="ghost" id="orderBack">伝票へ戻る</button></div>
</div></section>

<section class="view" id="v-pay"><div class="card">
  <h2>会計：<span id="pTable"></span></h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="totals" id="pTotals" style="align-content:start;align-self:start"></div>
    <div><div class="chips" id="payMethods"></div>
      <input id="payAmount" type="number" inputmode="numeric" placeholder="金額" style="width:100%;font-size:24px;text-align:right;margin-top:10px">
      <div class="bar"><button id="payAdjDiscount">値引</button><button id="payAdjSurcharge">値増</button><button class="ok" id="payAdd" style="margin-left:auto">入金</button></div>
      <div class="list" id="payList" style="margin-top:10px"></div></div>
  </div>
  <div class="bar"><button class="ghost" id="payBack">伝票へ戻る</button><button class="ghost" id="prReceipt">領収書印刷</button><button class="primary" id="payClose">会計を締める</button></div>
</div></section>

<section class="view" id="v-cust"><div class="card settings" style="grid-template-columns:280px minmax(0,1.25fr) minmax(0,1fr)">
  <div style="min-width:0"><div style="display:flex;gap:6px;margin-bottom:8px"><input id="cuSearch" placeholder="名前・会社名で検索" style="flex:1 1 0;min-width:0;width:0"><button class="primary sm" id="cuNew" style="white-space:nowrap;flex:none">＋新規</button></div><div id="cuModes" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="chip on" data-cm="all">全員</button><button class="chip" data-cm="old">ご来店なし</button><select id="cuMonths" style="width:auto;padding:6px 8px"></select></div><div class="lst" id="cuList" style="max-height:70vh;overflow:auto"></div></div>
  <div id="cuForm" class="form"></div>
  <div id="cuSide"></div>
</div></section>

<section class="view" id="v-casts"><div class="card">
  <div class="bar" style="margin:0 0 12px">
    <button class="pillbtn brown" id="cTabToday">出勤リスト <span id="cTodayN"></span></button>
    <button class="pillbtn brown" id="cTabAll">全員</button>
    <button class="pillbtn brown" id="cSort">並べ替え</button>
    <button class="pillbtn brown" id="cNew">新規登録</button>
    <input id="cSearch" placeholder="キャスト検索" style="flex:1;font-size:18px">
    
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px">
    <div class="rlist" id="cList"></div>
    <div><h2>詳細</h2><div class="form" id="cForm"><div class="muted">一覧の「編集」を押してください</div></div></div>
  </div>
</div></section>

<section class="view" id="v-settings"><div class="card settings">
  <div class="menu" id="setMenu"></div>
  <div><div class="bar" style="margin:0 0 10px"><button class="ok sm" id="setAdd">追加</button><input id="setFilter" placeholder="検索" style="flex:1"><button class="sm" id="setEdit">編集</button></div><div class="lst" id="setList"></div></div>
  <div><h2>詳細</h2><div class="form" id="setForm"><div class="muted">左の一覧から選ぶか「追加」</div></div></div>
</div></section>
</main>

<div class="modal" id="custModal"><div class="box" style="width:520px">
  <h2 style="color:var(--ink)">お客様を追加</h2>
  <div style="display:flex;gap:8px"><input id="custSearch" placeholder="名前で検索" style="flex:1"><button id="custNew">新規登録</button></div>
  <div class="chips" id="custList" style="margin-top:10px"></div>
  <div class="bar"><button class="ghost" id="custCancel">伝票へ戻る</button></div>

// 体験入店の日払い：（時給×勤務時間 または 日給 ＋ 手当）− 源泉 ＝ 日払い額。勤務時間は出勤15分切り上げ・退勤15分切り下げ・1:00打ち止め
function trialHours(inAt,outAt){ if(!inAt||!outAt) return null; const Q=900000; const a=Math.ceil(new Date(inAt).getTime()/Q)*Q; const bd=businessDate(new Date(inAt)); const cap=new Date(`${bd}T01:00:00`).getTime()+24*3600*1000; const b=Math.floor(Math.min(new Date(outAt).getTime(),cap)/Q)*Q; return Math.max(0,(b-a)/3600000); }
function trialCalc(s,ev,extra){ const rate=Number(settings?.trial_withholding_rate??10); const amt=Number(s.trial_pay_amount||0); const f=n=>Number(n).toLocaleString(); let base, head; if(s.trial_pay_type==='daily'){ if(!ev.in) return {ready:false,note:'出勤打刻がありません'}; base=amt; head=`日給 ${f(amt)}`; } else { if(!ev.in) return {ready:false,note:'出勤打刻がありません'}; const h=trialHours(ev.in,ev.out); if(h==null) return {ready:false,note:`時給 ${f(amt)}：退勤打刻後に計算`}; base=Math.floor(amt*h); head=`時給 ${f(amt)} × ${h}時間 ＝ ${f(base)}`; } const gross=base+(extra||0); const tax=Math.floor(gross*rate/100); const pay=gross-tax; return {ready:true,base,gross,tax,pay,note:`${head} ＋ 手当 ${f(extra||0)} ＝ ${f(gross)} − 源泉${rate}% ${f(tax)} ＝ ${f(pay)}円`}; }

const jmd=d=>{ const m=String(d||'').match(/^\d{4}-(\d{2})-(\d{2})/); return m?`${+m[1]}月${+m[2]}日`:''; };
function isOki(b){ return !!b&&b.status==='closed'&&(b.payments||[]).some(p=>p.method==='oki'&&p.amount>0&&!p.received_at); }
function okiRemain(b){ return (b?.payments||[]).filter(p=>p.method==='oki'&&p.amount>0&&!p.received_at).reduce((a,p)=>a+p.amount,0); }
// 置き伝票の会計：入金・値引などの後に、置きの残額を請求額に合わせ直す。残額0で全額入金＝その日の売上として確定しホールへ戻る（true を返す）
async function okiSync(wasOki){ if(!wasOki||!cur) return false; const pays=(cur.payments||[]).filter(p=>p.amount>0); const delta=(cur.totals?.amount_due??0)-pays.reduce((a,p)=>a+p.amount,0); const row=pays.find(p=>p.method==='oki'&&!p.received_at);
  if(delta!==0){ let r=null; if(row){ const na=row.amount+delta; r=na>0?await sb.from('payments').update({amount:na}).eq('id',row.id):await sb.from('payments').delete().eq('id',row.id); } else if(delta>0){ r=await sb.from('payments').insert({bill_id:cur.id,method:'oki',amount:delta,revenue_date:cur.business_date,received_at:null}); } if(r&&r.error){ toast('置きの残額を更新できません：'+r.error.message); } await openBill(cur.id); }
  if(okiRemain(cur)>0) return false; const d=businessDate(); const r2=await sb.from('payments').update({revenue_date:d}).eq('bill_id',cur.id); if(r2.error) toast('売上日の更新に失敗：'+r2.error.message); await logOp('置きの入金完了',{total:cur.totals?.amount_due??null,revenue_date:d,payments:(cur.payments||[]).filter(p=>p.amount>0).map(p=>`${METHOD[p.method]}:${p.amount}`)}); toast('全額の入金を受けました。本日の売上に計上します'); loadHall(); show('v-hall'); return true; }

$('gLeave').onclick=guard($('gLeave'),async()=>{ if(!cur||cur.status!=='open'||cur.guest_count<2) return; const gb=cur.guest_count, up=x=>Math.ceil(x/1000)*1000; const due=up(cur.totals?.amount_due??0), unpaid=Math.max(0,cur.totals?.unpaid??0); let n=1; if(gb>2){ n=await uiPick('退店する人数',Array.from({length:gb-1},(_,k)=>({label:`${k+1}名`,value:k+1}))); if(!n) return; } const share=Math.min(unpaid,up(due/gb)*n);

// 来店時刻の変更（v10.41）：セットの終了・延長・同伴①②を新しい時刻で計算し直す
function uiTimeHM(def,bd){ return new Promise(res=>{ const st=new Date(`${bd||businessDate()}T08:00:00+09:00`).getTime(); const d0=Math.max(st,new Date(def).getTime()); const m=document.createElement('div'); m.className='modal on'; m.style.zIndex=60; m.innerHTML=`<div class="box" style="width:320px"><div style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:20px"><select data-ut="h" style="font-size:22px"></select>時<select data-ut="m" style="font-size:22px"></select>分</div><div class="bar" style="justify-content:flex-end"><button class="ghost" data-ut="no">キャンセル</button><button class="primary" data-ut="ok">決定</button></div></div>`; document.body.appendChild(m); const H=m.querySelector('[data-ut=h]'), M=m.querySelector('[data-ut=m]'); const kmax=Math.max(0,Math.min(23,Math.floor((Date.now()-st)/3600000))); let hs=''; for(let k=0;k<=kmax;k++) hs+=`<option value="${k}">${(8+k)%24}</option>`; H.innerHTML=hs; let ms=''; for(let i=0;i<60;i++) ms+=`<option value="${i}">${String(i).padStart(2,'0')}</option>`; M.innerHTML=ms; const dk=Math.min(kmax,Math.floor((d0-st)/3600000)); H.value=String(dk); M.value=String(Math.min(59,Math.floor((d0-st-dk*3600000)/60000))); const done=v=>{ m.remove(); res(v); }; m.querySelector('[data-ut=no]').onclick=()=>done(null); m.querySelector('[data-ut=ok]').onclick=()=>done(new Date(st+Number(H.value)*3600000+Number(M.value)*60000).toISOString()); }); }
$('bTime').onclick=async()=>{ if(!cur||cur.status!=='open') return; const v=await uiTimeHM(cur.set_start,cur.business_date); if(!v) return; if(new Date(v).getTime()>Date.now()){ toast('今より後の時刻にはできません'); return; } const before=cur.set_start; if(Math.abs(new Date(v).getTime()-new Date(before).getTime())<60000) return;
  const u=await sb.from('bills').update({opened_at:v,set_start:v}).eq('id',cur.id); if(u.error){ toast(u.error.message); return; } await logOp('来店時刻の変更',{before:hm(before),after:hm(v)});

// ---------- order（d-system準拠の4列：カテゴリー／メニュー／選択／注文→確定） ----------
// ルール：売上は全部係に付く（複数なら等分）。3列目で選ぶのはバック・ポイントを付ける人だけ（選んだ人数で等分・切り捨て。選ばなければバックなし）
let oCat=null, oCart=[], oSel=-1, oPresent=new Set();
async function openOrder(){ oCart=[]; oSel=-1; oCat=(categories.find(c=>c.is_visible&&products.some(p=>p.category_id===c.id&&p.is_visible))||categories.find(c=>c.is_visible))?.id||null; oPresent=await updateCastBadge(); renderOrder(); show('v-order'); }
function renderOrder(catId){ if(catId) oCat=catId;
  $('oCats').innerHTML=categories.filter(c=>c.is_visible).map(c=>`<button class="ocat ${c.id===oCat?'on':''}" data-id="${c.id}">${esc(c.name)}</button>`).join('');
  $('oCats').querySelectorAll('.ocat').forEach(c=>c.onclick=()=>renderOrder(c.dataset.id));
  $('oProds').innerHTML=products.filter(p=>p.category_id===oCat&&p.is_visible).map(p=>`<button class="oprod" data-id="${p.id}"><span>${esc(p.name)}</span><span class="pb">${yen(p.price)}</span></button>`).join('')||'<div class="muted">なし</div>';
  $('oProds').querySelectorAll('.oprod').forEach(b=>b.onclick=()=>cartAdd(products.find(p=>p.id===b.dataset.id)));
  renderOrderCasts(); renderCart(); }
function cartAdd(p){ const i=oCart.findIndex(l=>l.p.id===p.id); if(i>=0){ oCart[i].qty++; oSel=i; } else { oCart.push({p,qty:1,casts:[]}); oSel=oCart.length-1; } renderOrderCasts(); renderCart(); }
function renderOrderCasts(){ const line=oCart[oSel]; const cs=staff.filter(s=>s.kind==='cast'); const onBill=new Set((cur.bill_casts||[]).map(c=>c.staff_id));
  const rank=s=>onBill.has(s.id)?0:oPresent.has(s.id)?1:2; const list=[...cs].sort((a,b)=>rank(a)-rank(b));
  if(!line){ $('oCasts').innerHTML='<div class="muted">メニューを選ぶと、バックを付けるキャストを選べます</div>'; return; }
  if(noBack(line.p)){ line.casts=[]; $('oCasts').innerHTML=`<div class="muted" style="font-size:14px">「${esc(line.p.name)}」<br>バック0円（設定→メニューで変更できます）</div>`; return; }
  $('oCasts').innerHTML=`<div class="muted" style="font-size:12px">「${esc(line.p.name)}」のバックを付ける人（選ばなければバックなし）</div><div class="ocgrid">`+list.map(s=>`<button class="ocast ${line.casts.includes(s.id)?'on':''}" data-id="${s.id}">${esc(s.display_name)}</button>`).join('')+`</div>`;
  $('oCasts').querySelectorAll('.ocast').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; const k=line.casts.indexOf(id); if(k>=0) line.casts.splice(k,1); else line.casts.push(id); renderOrderCasts(); renderCart(); }); }
const noBack=p=>!Number(p.back_amount)&&!Number(p.back_points); // バック金額もポイントも0のメニュー＝振り分け不要
function castLabel(line){ const nm=id=>staff.find(x=>x.id===id)?.display_name||''; if(noBack(line.p)) return ''; if(!line.casts.length) return '<small class="none">バックなし</small>'; return `<small>バック：${line.casts.map(nm).map(esc).join('・')}${line.casts.length>1?`で${line.casts.length}等分`:''}</small>`; }
function renderCart(){ $('oCart').innerHTML=oCart.map((l,i)=>`<div class="oline ${i===oSel?'sel':''}" data-i="${i}"><div class="r1"><span>${esc(l.p.name)}<br><small>${yen(l.p.price*l.qty)}</small></span><span class="qty"><button data-m="${i}">−</button><b>${l.qty}</b><button data-p="${i}">＋</button></span></div>${castLabel(l)}</div>`).join('')||'<div class="muted">メニューをタップして追加</div>';

  $('oCart').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.m); oCart[i].qty--; if(oCart[i].qty<=0){ oCart.splice(i,1); oSel=Math.min(oSel,oCart.length-1); renderOrderCasts(); } renderCart(); }); }
function buildSplits(itemId, line){ const q=line.qty, back=line.p.back_amount*q, pts=Number(line.p.back_points)*q, n=line.casts.length; // 売上は常に係。ここはバックとポイントだけ

$('oConfirm').onclick=async()=>{ if(!oCart.length){ toast('メニューを選んでください'); return; }

      if(keepFor.has(l)){ const cid=keepFor.get(l); const cu=customers.find(c=>c.id===cid); const kk=(cur.bill_casts||[]).find(c=>c.is_kakari)?.staff_id||cu?.kakari_staff_id||null; for(let k=0;k<l.qty;k++){ const rb=await sb.from('customer_bottles').insert({store_id:store.id,customer_id:cid,product_id:p.id,name:p.name,remaining:10,kakari_staff_id:kk,keep_name:cu?.name||null}); if(rb.error){ toast('ボトル登録エラー：'+rb.error.message); break; } } await logOp('ボトル登録（注文から自動）',{customer:cu?.name||null,bottle:p.name,qty:l.qty}); } }
    const n=oCart.reduce((a,l)=>a+l.qty,0); oCart=[]; oSel=-1; await openBill(cur.id); renderOrder(); show('v-order'); toast(`${n}点を注文しました`); }
  finally{ $('oConfirm').disabled=false; } };

let splitItem=null;
function openSplit(item){ splitItem=item; const base={back:item.back_amount*item.qty,pts:Number(item.back_points)*item.qty};

  const steps=(max,unit,v)=>{ const a=[]; for(let x=0;x<=max;x+=unit) a.push(x); if(max%unit) a.push(max); if(v&&!a.includes(v)) a.push(v); return a.sort((p,q)=>p-q); };

  const rows=[...$('splitTable').querySelectorAll('input[type=checkbox]:checked')].map(c=>({bill_item_id:splitItem.id,staff_id:c.dataset.s,sales_amount:0,back_amount:g('back',c.dataset.s),back_points:g('pts',c.dataset.s)})).filter(r=>r.back_amount>0||r.back_points>0);

  await sb.from('bill_item_splits').delete().eq('bill_item_id',splitItem.id); if(rows.length) await sb.from('bill_item_splits').insert(rows); $('splitModal').classList.remove('on'); openBill(cur.id); };

let okiBusy=false; async function closeAsOki(){ if(okiBusy||!cur||cur.status!=='open') return; const un=cur.totals?.unpaid??0; if(un<=0){ toast('未収がないため、置きにする金額がありません'); return; }

function ymdJa(d){ const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${+m[1]}年${+m[2]}月${+m[3]}日`:''; }
function expLine(b){ return `${b.name}　${b.remaining??0}/10　${ymdJa(b.expired_on)} 期限切れ`; }
function knLabel(b,cname){ return b.keep_name&&b.keep_name!==cname?`（キープ名：${b.keep_name}）`:''; }
async function expireBottle(b,cname){ if(!b) return false; if(!await uiConfirm(`${b.name}（残り ${b.remaining??0}/10）を期限切れにしますか？\n残量はこのまま記録されます。`)) return false; const d=businessDate(); const { error } = await sb.from('customer_bottles').update({expired_on:d,updated_at:new Date().toISOString()}).eq('id',b.id); if(error){ toast(error.message.includes('column')?'SQL 017 が未適用です：'+error.message:error.message); return false; } await logOp('ボトル期限切れ',{customer:cname,bottle:b.name,remaining:b.remaining},null,true); b.expired_on=d; toast('期限切れにしました'); return true; }
async function unexpireBottle(b,cname){ if(!b) return false; if(!await uiConfirm(`${b.name} の期限切れを取り消して、キープ中に戻しますか？`)) return false; const { error } = await sb.from('customer_bottles').update({expired_on:null,updated_at:new Date().toISOString()}).eq('id',b.id); if(error){ toast(error.message); return false; } await logOp('ボトル期限切れを戻す',{customer:cname,bottle:b.name,remaining:b.remaining},null,true); b.expired_on=null; toast('キープ中に戻しました'); return true; }
function btMonths(){ return 6; }
function btCutoff(n){ const [y,m,d]=businessDate().split('-').map(Number); const x=new Date(y,m-1-(n||btMonths()),d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
// 顧客一覧に出す情報：最終来店日・キープ中のボトル本数・キープ名（検索用）
let cuInfo={last:{},cnt:{},first:{},kn:{}}, cuMode='all';
async function loadCuInfo(){ const info={last:{},cnt:{},first:{},kn:{}}; const bt=await sb.from('customer_bottles').select('*').eq('is_finished',false); (bt.data||[]).filter(b=>!b.expired_on).forEach(b=>{ const c=b.customer_id; info.cnt[c]=(info.cnt[c]||0)+1; const d=b.opened_on||String(b.created_at||'').slice(0,10); if(d&&(!info.first[c]||d<info.first[c])) info.first[c]=d; if(b.keep_name) (info.kn[c]||(info.kn[c]=[])).push(b.keep_name); });
  for(let from=0;;from+=1000){ const v=await sb.from('bill_customers').select('customer_id,bills(business_date,status)').range(from,from+999); if(v.error) break; (v.data||[]).forEach(x=>{ const bl=x.bills; if(!bl||bl.status==='void') return; if(!info.last[x.customer_id]||bl.business_date>info.last[x.customer_id]) info.last[x.customer_id]=bl.business_date; }); if((v.data||[]).length<1000) break; } cuInfo=info; }
function cuBase(id){ return cuInfo.last[id]||cuInfo.first[id]||String(customers.find(c=>c.id===id)?.created_at||'').slice(0,10)||''; }

  let list=customers.filter(c=>!q||(c.name||'').includes(q)||(c.company||'').includes(q)||(c.receipt_name||'').includes(q)||(cuInfo.kn[c.id]||[]).some(k=>k.includes(q)));
  if(cuMode==='old') list=list.filter(c=>cuBase(c.id)&&cuBase(c.id)<=cut).sort((a,b)=>cuBase(a.id).localeCompare(cuBase(b.id))); list=list.slice(0,200);
  const md=d=>{ const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[1]===businessDate().slice(0,4)?'':m[1]+'/'}${+m[2]}/${+m[3]}`:''; };

    const changed=Object.keys(patch).filter(k=>(c[k]||null)!==patch[k]); if(!changed.length){toast('変更はありません');return;}

    const live=(data||[]).filter(b=>b.status==='closed'); const sum=live.reduce((a,b)=>a+(tot[b.id]||0),0);
    $('setList').innerHTML=`<div class="muted" style="margin-bottom:6px">本日（${businessDate()}）　会計済み ${live.length}件・${yen(sum)}</div>`+((data||[]).map(b=>{ const cn=(b.bill_customers||[]).map(c=>customers.find(x=>x.id===c.customer_id)?.name).filter(Boolean).join('・'); const pm=[...new Set((b.payments||[]).filter(p=>p.amount>0).map(p=>METHOD[p.method]+(p.method==='oki'&&!p.received_at?'(未入金)':'')))].join('・');
      return `<div class="row" data-bill="${b.id}" style="cursor:pointer">${SJ[b.status]||''}<span class="nm">${esc(tables.find(t=>t.id===b.table_id)?.name||'')}　${hm(b.opened_at)}${b.closed_at?'〜'+hm(b.closed_at):''}　${b.guest_count}名　${esc(cn)} <small class="muted">${esc(pm)}${b.business_date&&b.business_date!==today?`（ご来店日 ${jmd(b.business_date)}）`:''}</small></span><b>${tot[b.id]!=null?yen(tot[b.id]):''}</b></div>`; }).join('')||'<div class="muted">本日の伝票はまだありません</div>');
    $('setList').querySelectorAll('[data-bill]').forEach(r=>r.onclick=()=>{ billFrom='bills'; openBill(r.dataset.bill); }); return; }
  if (def.audit) { $('setAdd').style.display='none'; $('setEdit').style.display='none'; $('setFilter').style.display='none'; $('setForm').innerHTML='';
    const { data, error } = await sb.from('pos_audit_log').select('*').eq('store_id',store.id).order('created_at',{ascending:false}).limit(300);
    if(error){ $('setList').innerHTML=`<div class="muted">操作ログを読めません（SQL 010 が未適用の可能性）：${esc(error.message)}</div>`; return; }
    const f=d=>{ const x=new Date(d); return `${x.getMonth()+1}/${x.getDate()} ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`; };
    const KJ={amount:'金額',minutes:'分',is_auto:'自動延長',before:'変更前',after:'変更後',item:'商品',qty:'数量',total:'請求額',guest_count:'客数',items:'注文',name:'名前',fields:'内容',customer:'お客様',bottle:'ボトル',kind:'種別',reason:'理由',total_before:'切替前の請求額',method:'支払方法',payments:'支払',kakari:'係',tag_no:'タグ番号'};
    const vj=v=>v===true?'はい':v===false?'いいえ':Array.isArray(v)?v.join('、'):(typeof v==='number'?v.toLocaleString():v);
    const dt=o=>Object.entries(o||{}).filter(([k,v])=>v!==null&&v!==undefined&&k!=='table').map(([k,v])=>`${KJ[k]||k}：${vj(v)}`).join(' ／ ');
    $('setList').innerHTML=(data||[]).map(l=>`<div class="item" style="display:block"><b>${esc(l.action)}</b> <small>${f(l.created_at)}　${esc(l.detail?.table||'')}</small><br><small>${esc(dt(l.detail))}</small>${l.reason?`<br><small>理由：${esc(l.reason)}</small>`:''}</div>`).join('')||'<div class="muted">まだ記録はありません</div>'; return; }
  if (def.single) { $('setList').innerHTML=''; setSel=settings; renderForm(def); return; }
  const rows=setRows(def);
  if(setSel) setSel=rows.find(r=>r.id===setSel.id)||null; // 保存後は読み直した最新の行を表示する（古い値が残らないように）
  let head='';
  if (key==='products') head=`<select id="setCat" style="margin-bottom:6px"><option value="">--- すべて ---</option>${categories.map(c=>`<option value="${c.id}" ${setCatFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
  const _st=$('setList').dataset.key===key?$('setList').scrollTop:0; $('setList').dataset.key=key;
  $('setList').innerHTML=head+rows.map(r=>`<div class="row ${setSel?.id===r.id?'on':''}" data-id="${r.id}">${setEditMode?`<button class="danger sm" data-del="${r.id}">削除</button>`:''}<span class="nm">${esc(def.label(r))}${def.sub?` <small class="muted">${def.sub(r)}</small>`:''}${r.is_visible===false?' <small class="muted">（非表示）</small>':''}</span>${setEditMode&&!def.nosort?'<span class="hd">≡</span>':''}</div>`).join('');
  if (key==='products') $('setCat').onchange=e=>{ setCatFilter=e.target.value||null; renderSettings(key,true); };
  $('setList').querySelectorAll('.row').forEach(row=>{ row.onclick=e=>{ if(e.target.dataset.del||e.target.classList.contains('hd'))return; setSel=rows.find(r=>r.id===row.dataset.id); renderSettings(key,true); }; });
  $('setList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const r=rows.find(x=>x.id===b.dataset.del); if(!await uiConfirm(`「${def.label(r)}」を削除しますか？`))return;
    const { error } = await sb.from(def.table).delete().eq('id',b.dataset.del); if(error){ toast('使用中のため削除できません。非表示にしてください'); return; } await logOp('設定の削除',{kind:def.name,name:def.label(r)},null,true); setSel=null; renderSettings(key,true); });
  $('setList').scrollTop=_st; { const q=$('setFilter').value.trim(); if(q) $('setList').querySelectorAll('.row').forEach(r=>{ r.style.display=r.textContent.includes(q)?'':'none'; }); const on=$('setList').querySelector('.row.on'); if(on){ const a=on.getBoundingClientRect(), l=$('setList').getBoundingClientRect(); if(a.top<l.top+40||a.bottom>l.bottom) on.scrollIntoView({block:'center'}); } }
  if (setEditMode && !def.nosort) enableDrag(def);
  renderForm(def);
}
function renderForm(def){ const r=setSel; const f=$('setForm');
  if(!r){ f.innerHTML='<div class="muted">左の一覧から選ぶか「追加」</div>'; return; }
  f.innerHTML=def.cols.map(([k,label,type])=>{
    if(type==='bool') return `<label class="sw"><input type="checkbox" data-k="${k}" ${r[k]?'checked':''}>${label}</label>`;
    if(type==='prod') return `<label>${label}<select data-k="${k}"><option value="">なし</option>${products.filter(p=>p.agg_category==='HC').map(p=>`<option value="${p.id}" ${r[k]===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`;
    if(type==='cat') return `<label>${label}<select data-k="${k}">${categories.map(c=>`<option value="${c.id}" ${r[k]===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`;
    return `<label>${label}<input type="${type}" data-k="${k}" value="${esc(r[k]??'')}"></label>`; }).join('')+(def.key==='pos'?`<h3 style="margin:16px 0 4px">VIP料金（卓ごと。0＝通常卓）</h3><div class="muted" style="font-size:12px">VIP代＝部屋につき1回／VIP延長＝延長${settings.ext_minutes}分ごとに加算。人数は掛けません</div><table style="width:100%;margin-top:6px"><tr><th style="text-align:left">卓</th><th>VIP代</th><th>VIP${settings.ext_minutes}分延長</th></tr>${tables.map(t=>`<tr><td>${esc(t.name)}</td><td><input type="number" data-vipset="${t.id}" value="${t.vip_set_fee||0}"></td><td><input type="number" data-vipext="${t.id}" value="${t.vip_ext_fee||0}"></td></tr>`).join('')}</table>`:'')+`<div class="bar"><button class="primary" id="setSave">保存</button></div>`;
  $('setSave').onclick=async()=>{ const o={}; def.cols.forEach(([k,,type])=>{ const el=f.querySelector(`[data-k="${k}"]`); o[k]=type==='bool'?el.checked:type==='number'?Number(el.value||0):(type==='prod'?(el.value||null):el.value); });
    const q = def.single ? sb.from('pos_settings').update(o).eq('store_id',settings.store_id) : sb.from(def.table).update(o).eq('id',r.id);
    let { error } = await q;
    if(!error){ const ch=def.cols.filter(([k])=>String(r[k]??'')!==String(o[k]??'')).map(([k,label])=>`${label.split('（')[0].split('：')[0]}:${r[k]??''}→${o[k]??''}`); if(ch.length) await logOp('設定変更',{kind:def.name,name:def.single?null:def.label(r),fields:ch},null,true); }
    if(!error&&def.key==='pos'){ for(const t of tables){ const a=Number(f.querySelector(`[data-vipset="${t.id}"]`)?.value||0), b=Number(f.querySelector(`[data-vipext="${t.id}"]`)?.value||0); if(a!==(t.vip_set_fee||0)||b!==(t.vip_ext_fee||0)){ const r=await sb.from('tables').update({vip_set_fee:a,vip_ext_fee:b}).eq('id',t.id); if(r.error){ error=r.error; break; } await logOp('設定変更',{kind:'VIP料金',name:t.name,fields:[`VIP代:${t.vip_set_fee||0}→${a}`,`VIP延長:${t.vip_ext_fee||0}→${b}`]},null,true); } } }
    toast(error?error.message:'保存しました'); if(!error) renderSettings(def.key,true); };
}
$('setAdd').onclick=async()=>{ const def=SET.find(s=>s.key===setCur); const rows=setRows(def); const row=def.newRow(); if(!def.nosort) row.sort_order=(Math.max(0,...rows.map(r=>r.sort_order||0))+1); if(def.key==='products'&&setCatFilter) row.category_id=setCatFilter;
  const { data, error } = await sb.from(def.table).insert(row).select().single(); if(error){toast(error.message);return;} await logOp('設定の追加',{kind:def.name,name:def.label(data)},null,true); setSel=data; renderSettings(setCur,true); };
$('setEdit').onclick=()=>{ setEditMode=!setEditMode; renderSettings(setCur,true); };
$('setFilter').oninput=e=>{ const q=e.target.value.trim(); $('setList').querySelectorAll('.row').forEach(r=>{ r.style.display=!q||r.textContent.includes(q)?'':'none'; }); };
// 長押しドラッグ並び替え
function enableDrag(def){ dragSort($('setList'),'.row',async ids=>{ const rs=await Promise.all(ids.map((id,i)=>sb.from(def.table).update({sort_order:(i+1)*10}).eq('id',id))); const er=rs.find(r=>r.error); toast(er?('並び順を保存できませんでした：'+er.error.message):'並び順を保存しました'); renderSettings(def.key,true); }); }
// 行を動かすと指の追跡が切れるため、動き・離すは画面全体で受ける
function dragSort(list,sel,onDone){
  list.querySelectorAll(sel).forEach(row=>{ const h=row.querySelector('.hd'); if(!h)return;
    h.onpointerdown=e=>{ e.preventDefault(); let dragging=null, moved=false;
      const timer=setTimeout(()=>{ dragging=row; row.classList.add('drag'); },150);
      const move=ev=>{ if(!dragging)return; ev.preventDefault(); const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(sel); if(!el||el===dragging||el.parentElement!==list)return; const r=el.getBoundingClientRect(); const before=ev.clientY<r.top+r.height/2; const ref=before?el:el.nextSibling; if(ref===dragging||ref===dragging.nextSibling)return; list.insertBefore(dragging,ref); moved=true; };
      const end=async()=>{ clearTimeout(timer); window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',end); window.removeEventListener('pointercancel',end); if(!dragging)return; dragging.classList.remove('drag'); dragging=null; if(moved) await onDone([...list.querySelectorAll(sel)].map(r=>r.dataset.id)); };
      window.addEventListener('pointermove',move,{passive:false}); window.addEventListener('pointerup',end); window.addEventListener('pointercancel',end); }; }); }

start();
</script>
